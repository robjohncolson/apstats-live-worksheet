<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DOK-3 misconception sheets</title>
<style>
body { font-family: Geneva, Verdana, sans-serif; margin: 0; background: #e8e8e8; color: #111; }
header { background: #2B5C8A; color: white; padding: 16px 20px; }
h1 { font-size: 22px; }
main { padding: 20px; max-width: 980px; }
article { background: white; border: 1px solid #999; padding: 16px; margin-bottom: 16px; }
nav a { display: inline-block; margin-right: 16px; }
</style>
</head>
<body>
<header><h1>DOK-3 misconception sheets</h1>
<p>Self-paced bonus problems. Turn in whenever you finish. Teacher-scored E/P/I.</p></header>
<main><p id="status" role="status">Loading sheets?</p><div id="sheets"></div></main>
<script>
(async function () {
  const status = document.getElementById('status');
  try {
    const response = await fetch('manifest.json');
    if (!response.ok) throw new Error('Manifest unavailable');
    const manifest = await response.json();
    const host = document.getElementById('sheets');
    for (const [topic, sheet] of Object.entries(manifest)) {
      const card = document.createElement('article');
      const title = document.createElement('h2');
      title.textContent = sheet.title;
      card.appendChild(title);
      const targets = document.createElement('ul');
      for (const key of sheet.misconceptions) {
        const label = document.createElement('li');
        label.textContent = key.startsWith('label:') ? key.slice(6) : key;
        targets.appendChild(label);
      }
      card.appendChild(targets);
      const generated = document.createElement('p');
      generated.textContent = 'Generated on ' + sheet.generated.on;
      card.appendChild(generated);
      const links = document.createElement('nav');
      links.setAttribute('aria-label', sheet.title + ' PDFs');
      const slug = sheet.slug || topic.replaceAll('+', '_');
      for (const edition of ['student', 'board', 'teacher']) {
        const link = document.createElement('a');
        link.href = 'pdf/aps_' + encodeURIComponent(slug) + '_' + edition + '.pdf';
        link.textContent = edition;
        links.appendChild(link);
      }
      card.appendChild(links);
      host.appendChild(card);
    }
    status.textContent = Object.keys(manifest).length ? '' : 'No misconception sheets yet.';
  } catch (_) {
    status.textContent = 'Unable to load misconception sheets. Please try again later.';
  }
})();
</script>
</body>
</html>
