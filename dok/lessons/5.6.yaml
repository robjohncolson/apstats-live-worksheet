# Topic 5.6 — Sampling Distributions for Differences in Sample Proportions
topic: "5.6"
ced2026: { unit: 3, topic: "3.9", label: "Sampling Distributions (difference of proportions)" }
title: "Two Ways to Sample Library Visits"
minutes: { first_take: 5, video_worksheet: 28, finish: 10, turn_in: 2 }
essential_question: "When is the independent two-proportion sampling model warranted, and what changes for paired observations?"
worksheet: "u5_lesson6_live.html"

tether:
  - '\textbf{UNC-3.N} Determine parameters of a sampling distribution for a difference in sample proportions. \textbf{[Skill 3.B]}'
  - '\textbf{UNC-3.N.1} For a categorical variable, when randomly sampling from two independent populations with proportions $p_1$ and $p_2$, the sampling distribution of the difference in sample proportions has mean $\mu=p_1-p_2$.'
  - '\textbf{UNC-3.N.2} If sampling without replacement and sample sizes are less than 10\% of population sizes, the difference is negligible.'
  - '\textbf{UNC-3.O} Determine whether a sampling distribution for a difference of sample proportions can be described as approximately normal. \textbf{[Skill 3.C]}'
  - '\textbf{UNC-3.O.1} The sampling distribution of the difference in sample proportions will have an approximate normal distribution provided sample sizes are large enough: $n_1p_1\geq10$, $n_1(1-p_1)\geq10$, $n_2p_2\geq10$, $n_2(1-p_2)\geq10$.'
  - '\textbf{UNC-3.P} Interpret probabilities and parameters for a sampling distribution for a difference in proportions. \textbf{[Skill 4.B]}'
  - '\textbf{UNC-3.P.1} Parameters for a sampling distribution for a difference of proportions should be interpreted using appropriate units and within the context of specific populations.'

rules_callout:
  title: "THE VARIANCE FORMULA REQUIRES INDEPENDENT SAMPLES (keep on the page)"
  body: |
    For independent samples, $\mu_{\widehat p_1-\widehat p_2}=p_1-p_2$ and
    $\sigma_{\widehat p_1-\widehat p_2}=\sqrt{p_1(1-p_1)/n_1+p_2(1-p_2)/n_2}$ when each sample is
    below 10\% of its population. Approximate normality requires all four expected counts to be at least 10.
    Repeated measurements on the same people are paired, not independent; their association belongs in the variability.

