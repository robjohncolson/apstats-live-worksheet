# Topic 2.8 — Least Squares Regression (B: 2027-02-12)
topic: "2.8"
ced2026: { unit: 5, topic: "5.5", label: "Least-Squares Regression" }
title: "Which Regression Line Fits?"
minutes: { first_take: 5, video_worksheet: 28, finish: 10, turn_in: 2 }
essential_question: "How do several regression properties distinguish lines that share the same mean point?"
worksheet: "u2_lesson8_live.html"

rules_callout:
  title: "MAKE THE REGRESSION PROPERTIES AGREE (keep on the page)"
  body: |
    The least-squares regression line (LSRL) minimizes the sum of squared residuals and contains
    $(\bar x,\bar y)$. Its slope is $b=r(s_y/s_x)$, its intercept is
    $a=\bar y-b\bar x$, and $r^2$ is the proportion of response variation explained by the
    linear model. Interpret slope as a predicted response change per unit of $x$. The intercept
    predicts at $x=0$, which may be outside the observed range and unsupported in context.

focus: aps-2.8-d3-1
reinforcement: []
exit_reflection: 'One thing the video changed about my first take: \hrulefill'

