teacher:
  phase_tag: 'Do Now (first take) $\rightarrow$ Explore (video + follow-along) $\rightarrow$ Exit (finish + turn in)'
  teacher_does:
    - "Ask students to mark one defensible and one questionable clause before choosing a line."
    - "After the video, require slope units, the mean-point property, and $r^2$ evidence."
    - "Collect at the door; score part (c) only, E/P/I."
  students_do:
    - "Make a first claim, then complete the 2.8 follow-along."
    - "Synthesize a supported analysis in (c), revise, and turn in."
  questions_to_ask:
    - "Which standard-deviation ratio has response-per-explanatory units?"
    - "Why can both lines contain $(7,28)$?"
    - "What differs at 8 sunshine hours?"
  adult_role: "Circulate. Ask for linked evidence rather than confirming an analyst."
  watch_for:
    - "Reversing $s_y/s_x$."
    - "Treating the mean point as sufficient."
    - "Using $r$ rather than $r^2$ for explained variation."
  first_take_note: "Not graded. Credit a committed clause-level comparison supported by one property."

