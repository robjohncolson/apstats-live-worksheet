# Topic 7.6 — Confidence Intervals for the Difference of Two Means (B: 2027-01-25)
topic: "7.6"
ced2026: { unit: 4, topic: "4.7", label: "CI (difference of two means)" }
title: "Two Samples of Service Times"
minutes: { first_take: 5, video_worksheet: 28, finish: 10, turn_in: 2 }
essential_question: "How does the sampling design determine whether a paired or independent-means confidence interval is trustworthy?"
worksheet: "u7_lesson6_live.html"

rules_callout:
  title: "LET THE DESIGN CHOOSE THE INTERVAL (keep on the page)"
  body: |
    For two independent random samples, use a two-sample $t$ interval:
    $(\bar x_1-\bar x_2)\pm t^*\sqrt{s_1^2/n_1+s_2^2/n_2}$. Paired measurements have a link
    in the study design, such as two measurements from the same person; they use one sample of differences.
    Check independent random samples or assignment, each 10 percent condition for sampling without replacement,
    and both sample shapes or both sample sizes over 30. Interpret in the stated subtraction order.
    An interval containing 0 leaves equal population means plausible; an interval entirely on one side supports a difference.

focus: aps-7.6-d3-1
reinforcement: []
exit_reflection: "One thing the video changed about my first take: \\hrulefill"

space: { first_take: 0.9in, a: 0.8in, b: 1.4in, c: 2.0in }

teacher:
  phase_tag: Do Now (first take) $\rightarrow$ Explore (video + follow-along) $\rightarrow$ Exit (finish + turn
    in)
  teacher_does:
  - Display the board and ask for one sentence using the study description.
  - Begin the 7.6 video follow-along at minute 5.
  - Return to the board at minute 33. Students finish the shortened parts and justify their judgment.
  - Collect at the door. Score part (c) only using the three required elements.
  students_do:
  - Write a one-sentence first take before the video.
  - Complete the video follow-along worksheet.
  - Finish (a)--(c), revise the first take in the exit line, and turn in the sheet.
  questions_to_ask:
  - Which specific number or study detail supports your choice?
  - What claim would go beyond the evidence, and why?
  adult_role: Circulate and ask for evidence. Accept a concise response; do not require omitted calculations or
    a second full inference write-up.
  watch_for:
  - Choosing a speaker without a reason.
  - Copying numbers without explaining what they support.
  first_take_note: Ungraded. Everyday language is enough before the video; formal vocabulary belongs in the finish.

