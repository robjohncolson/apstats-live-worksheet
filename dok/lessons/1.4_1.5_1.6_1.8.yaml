teacher:
  questions_to_ask:
  - What does one bar represent in each display?
  - Which display can settle an exact-duration claim?
  watch_for:
  - Treating a category as a measurement.
  - Confusing counts with percents or bin intervals with exact values.
  - Giving quantities without candles, burn duration, or hours.
  first_take_note: Ungraded initial position; accept a reason tied to a displayed feature.
