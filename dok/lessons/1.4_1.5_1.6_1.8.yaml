essential_question: Which displays support a claim about categories or exact measurements?
rules_callout:
  title: Notes on Reading Displays
  body: Categorical variables record labels; quantitative variables record numerical amounts with units. A distribution
    describes values and their frequencies. Relative frequency is count divided by total; multiply by 100 for percent.\par
    A bar chart compares categories. A histogram groups measurements into intervals (bins); its height counts observations
    in each interval. A dotplot places one dot at each recorded value, stacking repeated values. A claim about an
    exact value needs evidence at that precision.
