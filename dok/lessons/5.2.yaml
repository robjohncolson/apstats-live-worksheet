# Topic 5.2 — The Normal Distribution, Revisited (B: 2026-11-10; first of this date-ordered slice)
topic: "5.2"
ced2026: { unit: 2, topic: "2.11", label: "The Normal Distribution" }
title: "Comparing a Score of 92"
minutes: { first_take: 5, video_worksheet: 28, finish: 10, turn_in: 2 }
essential_question: "How can the same raw score have different relative standings in two normal distributions with the same mean?"
worksheet: "u5_lesson1-2_live.html"

rules_callout:
  title: "STANDARDIZE BEFORE COMPARING (keep on the page)"
  body: |
    For a normal random variable, $z=\dfrac{x-\mu}{\sigma}$ tells how many standard deviations $x$ is from its mean.
    The percentile of $x$ is the percent of values at or below $x$.
    Use a normal table or calculator to find the area to the left of the $z$-score; multiply that area by 100.
    A larger percentile means a higher standing relative to that school's scores.

focus: aps-5.2-d3-1
reinforcement: []
exit_reflection: "One thing the video changed about my first take: \\hrulefill"

space: { first_take: 0.9in, a: 0.7in, b: 1.4in, c: 2.0in }

teacher:
  phase_tag: "Do Now (first take) $\\rightarrow$ Explore (video + follow-along) $\\rightarrow$ Exit (finish + turn in)"
  teacher_does:
    - "Board slide up at the bell. Ask for a claim before students calculate either percentile."
    - "Begin the combined 5.1--5.2 video follow-along at minute 5."
    - "Return to the board slide at minute 33. Circulate and require both z-scores before a comparison."
    - "Collect at the door. Score part (c) only, E/P/I."
  students_do:
    - "Choose whether the percentile is the same and cite mean or standard deviation."
    - "Complete the follow-along about sampling variability, normal probabilities, and normal-model appropriateness."
    - "Finish (a)--(c), revise the first take in the exit line, and turn in the sheet."
  questions_to_ask:
    - "How many School A standard deviations above 80 is a 92?"
    - "Why does School B's wider curve place more area above the same score?"
    - "Which area gives a percentile: left of 92 or right of 92?"
    - "What exactly do you mean by `better' when the raw score is identical?"
  adult_role: "Solo teacher. Circulate ~5 pairs. Require students to translate raw-point distance into standard-deviation units and define better as relative standing before choosing a school."
  watch_for:
    - "Using the shared mean as evidence that all corresponding percentiles match."
    - "Reporting the upper-tail probability rather than the percentile below 92."
    - "Reversing the comparison and assigning the higher percentile to the wider distribution."
  first_take_note: "Not graded. Equal means should make the counselor's claim tempting; standardization should change the final judgment."

