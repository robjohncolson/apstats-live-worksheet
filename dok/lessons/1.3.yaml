topic: "1.3"
ced2026:
  unit: 1
  topic: '1.3'
  label: Representing a Categorical Variable with Tables
title: A Percent Needs Its Base
essential_question: When does a count answer the question, and when does a percent --- and what does each
  one hide?
worksheet: u1_lesson3_live.html
rules_callout:
  title: TABLES FOR A CATEGORICAL VARIABLE (keep on the page)
  body: 'A \textbf{frequency table} gives the count in each category. A \textbf{relative-frequency table}
    gives its proportion or percent: $\text{relative frequency}=\dfrac{\text{category count}}{\text{group
    total}}$. Multiply by 100 for a percent. Counts answer `how many?''; percents answer `what share?''.
    Always identify the group that a percent describes.'
focus: aps-1.3-d3-1
reinforcement: []
space:
  first_take: 0.9in
  a: 0.8in
  b: 1.4in
  c: 2.0in
teacher:
  questions_to_ask:
  - If the session room holds 30 chairs, which table tells the council how many chairs each club fills?
  - 83\% of what? 60\% of what? Say the base out loud.
  - Why did Robotics choose counts and Chess choose percents? What would each look like on the other table?
  - Rewrite the council's question so that the \emph{other} table is the right one to answer it.
  watch_for:
  - '`Percents are always better'' (or `counts are the real data'') with no link to what the council asked'
  - Cites 83\% without ever saying it is 15 people out of 18
  - Compares 27 Yes to 15 Yes without noting Robotics has 45 members to Chess's 18
  first_take_note: 'Not graded. Expect a split: some say Robotics (27) and some say Chess (83\%); the
    split IS the lesson.'
visuals:
  club_table:
    kind: two_way_table
    col_label: '``Would you attend a Saturday session?'''' (every member surveyed; counts)'
    row_label: Club
