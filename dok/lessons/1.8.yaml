# Topic 1.8 — Graphical Representations of Summary Statistics
topic: "1.8"
ced2026: { unit: 1, topic: "1.8", label: "Graphical Representations of Summary Statistics" }
title: "Two Displays, One Data Set"
minutes: { first_take: 5, video_worksheet: 28, finish: 10, turn_in: 2 }
essential_question: "What information survives when individual observations are compressed into a boxplot?"
worksheet: "u1_lesson8_live.html"

rules_callout:
  title: "DOTPLOTS AND BOXPLOTS (keep on the page)"
  body: |
    A \textbf{dotplot} keeps every observation, so it can show clusters, gaps, peaks, and isolated values.\
    A \textbf{boxplot} compresses the data to the five-number summary: minimum, Q1, median, Q3, maximum
    (with separately marked outliers). The box contains the middle $50\%$ of observations.\
    A boxplot shows center and spread efficiently, but it may hide modality, clusters, and gaps.

