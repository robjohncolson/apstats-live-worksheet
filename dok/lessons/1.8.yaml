teacher:
  phase_tag: "Do Now (first take) $\\rightarrow$ Explore (video + follow-along) $\\rightarrow$ Exit (finish + turn in)"
  teacher_does:
    - "Board slide up at the bell. Read Omar's and Nia's claims aloud without confirming either."
    - "Video follow-along from minute 5 (five-number summaries and boxplots)."
    - "Board slide back up at minute 33. Circulate; ask students to point before they name a feature."
    - "Collect at the door. Score part (c) only, E/P/I."
  students_do:
    - "Commit to Omar or Nia from the two displays before the video."
    - "Complete the video follow-along on five-number summaries and boxplots."
    - "Finish (a)--(c); complete the exit line; turn in."
  questions_to_ask:
    - "Point to 32 minutes on the dotplot. How many dots are nearby?"
    - "Could a different data set have this same five-number summary but no gap?"
    - "Which features disappeared when the 24 dots became five numbers?"
    - "For the coach's decision, do you need a center or the number of students above 30?"
  adult_role: "Solo teacher. Circulate ~5 pairs. Do not say `bimodal' or confirm Nia; ask students to locate the median on both displays and name what disappears."
  watch_for:
    - "Treating the median as a mode or as a value an observation must equal."
    - "Claiming the boxplot displays the two clusters because its box is wide."
    - "Calling 55 an outlier without checking the $1.5\\,\\mathrm{IQR}$ fence."
  first_take_note: "Not graded. Expect Omar; the empty interval around 32 is the reveal."

