topic: "2.1"
ced2026:
  unit: 2
  topic: '2.1'
  label: 'Two Categorical Variables: Tables & Graphs'
title: Counts or Conditional Percents?
minutes:
  first_take: 5
  video_worksheet: 28
  finish: 10
  turn_in: 2
essential_question: When group sizes differ, which comparison reveals whether two categorical variables
  are related?
worksheet: u2_lesson1_live.html
rules_callout:
  title: COMPARE WITHIN GROUPS (keep on the page)
  body: 'A \textbf{two-way table} records combinations of two categorical variables. A raw count
    answers

    \emph{how many}; it does not by itself answer \emph{how likely within a group}. To compare groups
    of

    different sizes, compute a \textbf{conditional relative frequency}:

    $\text{cell count}\div\text{total for that row or column}$. If the conditional distributions
    differ,

    the variables appear associated. Association from observed data does not by itself establish
    cause.

    '
focus: aps-2.1-d3-1
reinforcement: []
exit_reflection: 'One thing the video changed about my first take: \hrulefill'
space:
  first_take: 0.9in
  a: 0.7in
  b: 1.4in
  c: 2.0in
teacher:
  phase_tag: Do Now (first take) $\rightarrow$ Explore (video + follow-along) $\rightarrow$ Exit
    (finish + turn in)
  teacher_does:
  - Show the board at the bell and collect a one-sentence first take without confirming a claim.
  - Run the named video follow-along, then allow about 10 minutes for parts (a)--(c).
  - Ask for evidence linked to a claim. Collect the sheet and hand-score part (c) with E/P/I.
  students_do:
  - Choose the more useful line of reasoning and cite one table detail.
  - Complete the video follow-along about variable types, displays, and possible relationships.
  - Finish (a)--(c), revise the first take in the exit line, and turn in the sheet.
  questions_to_ask:
  - Which number or visible feature supports your claim?
  - Why does the other claim go beyond that evidence?
  - What would you tell someone who chose the other claim?
  adult_role: Circulate and ask students to connect their choice to evidence. Score part (c) using
    the three required reasoning elements; do not require dropped extension work.
  watch_for:
  - A choice with copied numbers but no explanation of how they support it.
  - Treating a model or average as a guaranteed individual outcome.
  first_take_note: Not graded. Expect the 75-to-35 count comparison to attract students before they
    normalize for group size.
tether:
- \textbf{VAR-1.D} Identify questions to be answered about possible relationships in data. \textbf{[Skill
  1.A]}
- \textbf{VAR-1.D.1} Apparent patterns and associations in data may be random or not.
