topic: "2.2"
ced2026:
  unit: 2
  topic: '2.1'
  label: 'Two Categorical Variables: Tables & Graphs'
title: Same Responses, Different Questions
minutes:
  first_take: 5
  video_worksheet: 28
  finish: 10
  turn_in: 2
essential_question: Which display best answers a relationship question when the groups have different
  sizes?
worksheet: u2_lesson2_live.html
rules_callout:
  title: MATCH THE DISPLAY TO THE QUESTION (keep on the page)
  body: 'A count bar graph shows numbers of students. A segmented bar graph stacks each group''s
    percentages to $100\%$. To compare group preferences, divide each count by its group total and
    compare the within-group percentages. Different group distributions suggest association. Percentages
    alone do not show how many people were surveyed.

    '
focus: aps-2.2-d3-1
reinforcement: []
exit_reflection: 'One thing the video changed about my first take: \hrulefill'
space:
  first_take: 0.6in
  a: 0.7in
  b: 1.4in
  c: 2.0in
teacher:
  phase_tag: Do Now (first take) $\rightarrow$ Explore (video + follow-along) $\rightarrow$ Exit
    (finish + turn in)
  teacher_does:
  - Show the board at the bell and collect a one-sentence first take without confirming a claim.
  - Run the named video follow-along, then allow about 10 minutes for parts (a)--(c).
  - Ask for evidence linked to a claim. Collect the sheet and hand-score part (c) with E/P/I.
  students_do:
  - Choose a graph for the relationship question and cite one feature.
  - Complete the video follow-along about two-way tables and bar-graph displays.
  - Finish (a)--(c), revise the first take in the exit line, and turn in the sheet.
  questions_to_ask:
  - Which number or visible feature supports your claim?
  - Why does the other claim go beyond that evidence?
  - What would you tell someone who chose the other claim?
  adult_role: Circulate and ask students to connect their choice to evidence. Score part (c) using
    the three required reasoning elements; do not require dropped extension work.
  watch_for:
  - A choice with copied numbers but no explanation of how they support it.
  - Treating a model or average as a guaranteed individual outcome.
  first_take_note: Not graded. The goal is to surface whether students instinctively compare bar
    totals, segment counts, or within-grade shares.
