    - "Can you name two events here whose intersection must be empty?"
  adult_role: "Solo teacher. Circulate ~5 pairs. Require a table-based explanation for the subtraction and a reader consequence; do not accept `because the formula says so' alone."
  watch_for:
    - "Treating two different food preferences as automatically mutually exclusive."
    - "Capping 140/120 at 1 without locating the duplicated students."
    - "Naming a proposed mutually exclusive pair that still has a nonzero table cell."
