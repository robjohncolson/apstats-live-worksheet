topic: "4.4"
ced2026:
  unit: 2
  topic: '2.5'
  label: Mutually Exclusive Events
title: Count the Overlap Once
essential_question: How does an intersection determine whether two events are mutually exclusive
  and how their union should be counted?
worksheet: u4_lesson3-4-5_live.html
rules_callout:
  title: INTERSECTIONS AND MUTUALLY EXCLUSIVE EVENTS (keep on the page)
  body: '$A\cap B$ is the intersection: outcomes in both events. Events are mutually exclusive (disjoint)
    when they cannot happen together, so $P(A\cap B)=0$. For a random selection from equally likely
    individuals, divide the number in the event by the total. Count each individual once. The complement
    rule is $P(A^c)=1-P(A)$. Every probability must be between 0 and 1.

    '
focus: aps-4.4-d3-1
reinforcement: []
space:
  first_take: 0.9in
  a: 0.7in
  b: 1.3in
  c: 2.0in
teacher:
  questions_to_ask:
  - Which number or visible feature supports your claim?
  - Why does the other claim go beyond that evidence?
  - What would you tell someone who chose the other claim?
  watch_for:
  - A choice with copied numbers but no explanation of how they support it.
  - Treating a model or average as a guaranteed individual outcome.
  first_take_note: Not graded. A student may initially trust the marginal totals; the finish should
    make the duplicated intersection visible.
