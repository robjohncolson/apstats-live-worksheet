# Topic 7.1 — Introducing Statistics: Should I Worry About Error? (B: 2027-01-12)
topic: "7.1"
ced2026: { unit: 4, topic: "4.2", label: "Constructing a CI for a Mean or Mean Difference" }
title: "Can Chance Explain the Mean Difference?"
minutes: { first_take: 5, video_worksheet: 28, finish: 10, turn_in: 2 }
essential_question: "How can rerandomization distinguish a treatment explanation from chance variation while preserving the possibility of inferential error?"
worksheet: "u7_lesson1_live.html"

rules_callout:
  title: "ASK WHAT CHANCE WOULD DO UNDER NO EFFECT (keep on the page)"
  body: |
    Under no treatment effect, the expected difference in means is 0. A rerandomization simulation
    keeps the observed responses and group sizes, randomly reassigns the responses, and repeats.
    The fraction at least as extreme in the claim's direction estimates how often chance alone
    would give such a result. It does not give the probability that no effect is true.
    A small fraction is evidence against chance alone, but errors remain possible.
    Random assignment supports causation for the study subjects; random sampling supports population claims.

focus: aps-7.1-d3-1
reinforcement: []
exit_reflection: "One thing the video changed about my first take: \\hrulefill"

space: { first_take: 0.9in, a: 0.7in, b: 1.4in, c: 2.0in }

teacher:
  phase_tag: Do Now (first take) $\rightarrow$ Explore (video + follow-along) $\rightarrow$ Exit (finish + turn
    in)
  teacher_does:
  - Display the board and ask for one sentence using the study description.
  - Begin the 7.1 video follow-along at minute 5.
  - Return to the board at minute 33. Students finish the shortened parts and justify their judgment.
  - Collect at the door. Score part (c) only using the three required elements.
  students_do:
  - Write a one-sentence first take before the video.
  - Complete the video follow-along worksheet.
  - Finish (a)--(c), revise the first take in the exit line, and turn in the sheet.
  questions_to_ask:
  - Which specific number or study detail supports your choice?
  - What claim would go beyond the evidence, and why?
  adult_role: Circulate and ask for evidence. Accept a concise response; do not require omitted calculations or
    a second full inference write-up.
  watch_for:
  - Choosing a speaker without a reason.
  - Copying numbers without explaining what they support.
  first_take_note: Ungraded. Everyday language is enough before the video; formal vocabulary belongs in the finish.

tether:
  - '\textbf{VAR-1.I} Identify questions suggested by probabilities of errors in statistical inference. \textbf{[Skill 1.A]}'
  - '\textbf{VAR-1.I.1} Random variation may result in errors in statistical inference.'

