# Topic 5.8 — Sampling Distributions for Differences in Sample Means (B: 2027-01-22)
topic: "5.8"
ced2026: { unit: 4, topic: "4.6", label: "Sampling Distributions (difference of two means)" }
title: "Two Samples, One Difference"
minutes: { first_take: 5, video_worksheet: 28, finish: 10, turn_in: 2 }
essential_question: "How can two sample means use different pathways to justify one normal model for their difference?"
worksheet: "u5_lesson8_live.html"

rules_callout:
  title: "JUSTIFY EACH SAMPLE MEAN BEFORE THEIR DIFFERENCE (keep on the page)"
  body: |
    For independent random samples, $\mu_{\bar X_1-\bar X_2}=\mu_1-\mu_2$ and
    $\sigma_{\bar X_1-\bar X_2}=\sqrt{\sigma_1^2/n_1+\sigma_2^2/n_2}$ when each
    sample meets its 10\% condition. Justify each component's shape: a normal population
    supports a normal sample mean even for small $n$, while the Central Limit Theorem supports
    a sample mean from a nonnormal population when its own $n\geq30$. The two groups need not
    use the same pathway. Interpret probabilities as outcomes from repeated pairs of samples.

