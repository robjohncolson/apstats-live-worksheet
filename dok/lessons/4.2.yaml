topic: "4.2"
ced2026:
  unit: 2
  topic: '2.3'
  label: Estimating Probabilities Using Simulation
title: What Did Each Simulation Estimate?
minutes:
  first_take: 5
  video_worksheet: 28
  finish: 10
  turn_in: 2
essential_question: How must chance labels, one trial, and the success event align with the probability
  question?
worksheet: u4_lesson1-2_live.html
rules_callout:
  title: THREE MATCHES MAKE A VALID SIMULATION (keep on the page)
  body: 'Match each outcome''s chance with the fraction of equally likely labels assigned to it.
    One trial must reproduce the stated number of independent selections. Count the exact event named
    in the question. More trials reduce chance variation but do not repair a wrong assignment or
    event. Estimate probability with $\text{successful trials}/\text{total trials}$.

    '
focus: aps-4.2-d3-1
reinforcement: []
exit_reflection: 'One thing the video changed about my first take: \hrulefill'
space:
  first_take: 0.9in
  a: 0.8in
  b: 1.4in
  c: 2.0in
teacher:
  phase_tag: Do Now (first take) $\rightarrow$ Explore (video + follow-along) $\rightarrow$ Exit
    (finish + turn in)
  teacher_does:
  - Show the board at the bell and collect a one-sentence first take without confirming a claim.
  - Run the named video follow-along, then allow about 10 minutes for parts (a)--(c).
  - Ask for evidence linked to a claim. Collect the sheet and hand-score part (c) with E/P/I.
  students_do:
  - Choose a simulation result and name one design feature in a first take.
  - Complete the follow-along about outcomes, events, chance assignments, trials, and relative frequency.
  - Finish (a)--(c), revise the first take in the exit line, and turn in the sheet.
  questions_to_ask:
  - Which number or visible feature supports your claim?
  - Why does the other claim go beyond that evidence?
  - What would you tell someone who chose the other claim?
  adult_role: Circulate and ask students to connect their choice to evidence. Score part (c) using
    the three required reasoning elements; do not require dropped extension work.
  watch_for:
  - A choice with copied numbers but no explanation of how they support it.
  - Treating a model or average as a guaranteed individual outcome.
  first_take_note: Not graded. Accept a tentative choice; the lesson should move students from decimal
    comparison to model-event alignment.
visuals:
  designs_table:
