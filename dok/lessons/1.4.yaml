topic: "1.4"
ced2026:
  unit: 1
  topic: '1.4'
  label: Representing a Categorical Variable with Graphs
title: Same Counts, Different Message
minutes:
  first_take: 5
  video_worksheet: 28
  finish: 10
  turn_in: 2
essential_question: How can a graph use correct counts but still create a misleading comparison?
worksheet: u1_lesson4_live.html
rules_callout:
  title: GRAPHING ONE CATEGORICAL VARIABLE (keep on the page)
  body: Bar height represents a category's count or relative frequency. Label both axes, use equal-width
    bars, and start the vertical scale at zero to avoid distortion. The visible height above a displayed
    baseline is the count minus that baseline. Compare what the lengths suggest with the actual counts
    before writing a claim.
focus: aps-1.4-d3-1
reinforcement: []
exit_reflection: 'One thing the video changed about my first take: \hrulefill'
space:
  first_take: 0.9in
  a: 0.7in
  b: 1.4in
  c: 2.0in
teacher:
  phase_tag: Do Now (first take) $\rightarrow$ Explore (video + follow-along) $\rightarrow$ Exit (finish
    + turn in)
  teacher_does:
  - Board slide up at the bell. Read both captions aloud, then collect first takes without reacting.
  - Begin the video follow-along at minute 5.
  - Return to the graphs at minute 33. Circulate and require students to connect the baseline to bar height.
  - Collect at the door. Score part (c) only, E/P/I.
  students_do:
  - Write a one-sentence first take that names the graph they trusted.
  - Complete the video follow-along on categorical displays.
  - Finish (a)--(c), revise the first take in the exit line, and turn in the sheet.
  questions_to_ask:
  - What changed between the graphs if the votes are identical?
  - Where does each visible bar begin?
  - What do the counts support about the size of Pizza's lead?
  - What headline would tell readers both the leader and the size of the difference?
  adult_role: Solo teacher. Circulate ~5 pairs. Do not call a graph honest or misleading for students;
    ask them to name the baseline, quantify both comparisons, and connect the display choice to the reader's
    question.
  watch_for:
  - Calling Graph A's counts false instead of explaining its baseline
  - Treating the visible heights as vote counts
  - Repeating a headline without using the counts
  first_take_note: Not graded. Expect Graph A to attract votes because its Pizza bar dominates.
