# Topic 6.2 — Constructing a Confidence Interval for a Population Proportion
topic: "6.2"
ced2026: { unit: 3, topic: "3.3", label: "Constructing a CI for a Proportion" }
title: "Narrower Is Not Automatically Better"
minutes: { first_take: 5, video_worksheet: 28, finish: 10, turn_in: 2 }
essential_question: "Why can a wider interval from a random sample be more trustworthy than a narrower formula result?"
worksheet: "u6_lesson1-2_live.html"

rules_callout:
  title: "ONE-SAMPLE INTERVAL FOR A PROPORTION (keep on the page)"
  body: |
    Use a one-sample $z$-interval for $p$: $\hat p\pm z^*\sqrt{\hat p(1-\hat p)/n}$;
    for $95\%$ confidence, $z^*=1.96$. Check (1) random data collection, (2) when sampling
    without replacement, $n\le 0.10N$, and (3) at least 10 observed successes and 10 failures.
    A smaller formula margin of error describes less random sampling variation; it does not repair
    systematic error caused by who chooses to respond.

