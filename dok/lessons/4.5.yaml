teacher:
  phase_tag: Do Now (first take) $\rightarrow$ Explore (video + follow-along) $\rightarrow$ Exit
    (finish + turn in)
  teacher_does:
  - Show the board at the bell and collect a one-sentence first take without confirming a claim.
  - Run the named video follow-along, then allow about 10 minutes for parts (a)--(c).
  - Ask for evidence linked to a claim. Collect the sheet and hand-score part (c) with E/P/I.
  students_do:
  - Choose a claim and cite one cell or margin from the screening table.
  - Complete the follow-along about conditional probability and the general multiplication rule.
  - Finish (a)--(c), revise the first take in the exit line, and turn in the sheet.
  questions_to_ask:
  - Which number or visible feature supports your claim?
  - Why does the other claim go beyond that evidence?
  - What would you tell someone who chose the other claim?
  adult_role: Circulate and ask students to connect their choice to evidence. Score part (c) using
    the three required reasoning elements; do not require dropped extension work.
  watch_for:
  - A choice with copied numbers but no explanation of how they support it.
  - Treating a model or average as a guaranteed individual outcome.
  first_take_note: Not graded. The familiar 90 percent number is intentionally tempting; the revision
    should use the full positive-test group.
