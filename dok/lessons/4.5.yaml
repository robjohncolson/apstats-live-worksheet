  label: Conditional Probability
title: Which Way Does the Condition Point?
minutes:
  first_take: 5
  video_worksheet: 28
  finish: 10
  turn_in: 2
essential_question: Why can reversing the condition produce a very different probability, even when
  both probabilities use the same table?
worksheet: u4_lesson3-4-5_live.html
rules_callout:
  title: THE GIVEN EVENT SETS THE DENOMINATOR (keep on the page)
  body: '$P(A\mid B)$ means the probability of $A$ \textbf{given} $B$. Restrict attention to the
    outcomes in $B$:

    $P(A\mid B)=\dfrac{P(A\cap B)}{P(B)}=\dfrac{\text{count in both }A\text{ and }B}{\text{count
    in }B}$.

    In general, $P(A\mid B)\neq P(B\mid A)$ because the denominators are different.

    \textbf{Sensitivity} is $P(\text{positive}\mid\text{condition})$.

    The \textbf{false-positive rate} is $P(\text{positive}\mid\text{no condition})$.

    '
focus: aps-4.5-d3-1
reinforcement: []
exit_reflection: 'One thing the video changed about my first take: \hrulefill'
space:
