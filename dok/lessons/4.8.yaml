topic: "4.8"
ced2026:
  unit: 2
  topic: '2.9'
  label: Parameters of Random Variables
title: Same Mean, Different Deadline Risk
minutes:
  first_take: 5
  video_worksheet: 28
  finish: 10
  turn_in: 2
essential_question: When two probability models have the same mean, how can standard deviation change
  the decision?
worksheet: u4_lesson7-8_live.html
rules_callout:
  title: MEAN AND STANDARD DEVIATION (keep on the page)
  body: 'For a discrete random variable, $\mu_X=\sum xP(X=x)$ and $\sigma_X=\sqrt{\sum(x-\mu_X)^2P(X=x)}$.
    For $n$ equally likely outcomes, divide the sum of squared distances from the mean by $n$, then
    take the square root. The mean is a long-run average; the standard deviation describes a typical
    distance from it, in the variable''s units. Add probabilities of outcomes that miss a deadline.

    '
focus: aps-4.8-d3-1
reinforcement: []
exit_reflection: 'One thing the video changed about my first take: \hrulefill'
space:
  first_take: 0.9in
  a: 0.7in
  b: 1.4in
  c: 2.0in
teacher:
  phase_tag: Do Now (first take) $\rightarrow$ Explore (video + follow-along) $\rightarrow$ Exit
    (finish + turn in)
  teacher_does:
  - Show the board at the bell and collect a one-sentence first take without confirming a claim.
  - Run the named video follow-along, then allow about 10 minutes for parts (a)--(c).
  - Ask for evidence linked to a claim. Collect the sheet and hand-score part (c) with E/P/I.
  students_do:
  - Choose a route and cite one model feature.
  - Complete the video follow-along about means, standard deviations, and their interpretations.
  - Finish (a)--(c), revise the first take in the exit line, and turn in the sheet.
  questions_to_ask:
  - Which number or visible feature supports your claim?
  - Why does the other claim go beyond that evidence?
  - What would you tell someone who chose the other claim?
  adult_role: Circulate and ask students to connect their choice to evidence. Score part (c) using
    the three required reasoning elements; do not require dropped extension work.
  watch_for:
  - A choice with copied numbers but no explanation of how they support it.
  - Treating a model or average as a guaranteed individual outcome.
  first_take_note: Not graded. Route B's very fast outcomes may attract some students before deadline
    risk is made explicit.
