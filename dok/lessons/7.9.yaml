# Topic 7.9 — Carrying Out a Test for the Difference of Two Population Means
topic: "7.9"
ced2026: { unit: 4, topic: "4.10", label: "Carrying Out a Test (difference of two means)" }
title: "What Does This Test Support?"
minutes: { first_take: 5, video_worksheet: 28, finish: 10, turn_in: 2 }
essential_question: "How can one test support a mean difference without settling size, individuals, or cause?"
worksheet: "u7_lesson9_live.html"

rules_callout:
  title: "CARRY OUT THE TEST, THEN BOUND THE CONCLUSION (keep on the page)"
  body: |
    For independent samples, $SE=\sqrt{s_1^2/n_1+s_2^2/n_2}$ and
    $t=((\bar x_1-\bar x_2)-0)/SE$. A $p$-value is the probability, assuming $H_0$,
    of a statistic at least as extreme in the direction of $H_a$. If $p\leq\alpha$, reject
    $H_0$ and state evidence for $H_a$ in context. Significance against 0 does not establish
    practical size or an individual guarantee. Random sampling supports population scope;
    random assignment, not self-selection, supports causation.

