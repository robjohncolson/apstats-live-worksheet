# Topic 7.3 — Justifying a Claim About a Population Mean Based on a Confidence Interval (B: 2027-01-15)
topic: "7.3"
ced2026: { unit: 4, topic: "4.3", label: "Justifying a Claim Based on a Confidence Interval for a Population Mean" }
title: "One Interval, Two Cutoffs"
minutes: { first_take: 5, video_worksheet: 28, finish: 10, turn_in: 2 }
essential_question: "How can one confidence interval support a bounded claim while leaving a stronger claim unresolved?"
worksheet: "u7_lesson3_live.html"

rules_callout:
  title: "LET THE ENTIRE INTERVAL GOVERN THE CLAIM (keep on the page)"
  body: |
    A $C\%$ confidence interval estimates a population mean, not the spread of individual observations.
    We are $C\%$ confident that the interval captures the population mean represented by the random sample;
    the fixed interval either contains that mean or it does not. A value inside the interval remains plausible.
    To support $\mu<c$, the entire interval must lie below $c$; an endpoint merely falling below $c$ is not enough.
    With other features held fixed, a larger sample tends to narrow a mean interval, while a higher confidence
    level widens it.

