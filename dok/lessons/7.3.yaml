  teacher_does:
    - "Board slide up at the bell. Ask which interval feature evaluates each cutoff."
    - "Begin the 7.3 video follow-along at minute 5."
    - "Return at minute 33. Require separate decisions for the two cutoffs and the individual-time claim."
    - "Collect at the door. Score part (c) only, E/P/I."
  students_do:
    - "Commit to one approach and cite an endpoint or the parameter."
    - "Complete the follow-along, finish (a)--(c), revise, and turn in."
  questions_to_ask:
    - "Why does 44.877 settle the 45-second claim but not the 42-second claim?"
    - "Does this interval describe a population mean or 95 percent of individual transactions?"
    - "Which population can the random sample represent?"
  adult_role: "Solo teacher. Test each cutoff against the interval, then separate the mean from individual times."
  watch_for:
    - "Using only the lower endpoint to support a less-than claim."
    - "Treating 95 percent confidence as a probability that the fixed population mean is in this realized interval."
    - "Claiming that 95 percent of individual setup times fall between the confidence-interval endpoints."
  first_take_note: "Not graded. Students should identify the parameter and an interval feature before deciding."

