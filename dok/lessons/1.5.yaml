topic: "1.5"
ced2026:
  unit: 1
  topic: '1.5'
  label: Representing a Quantitative Variable with Graphs
title: Same Data, Different Bins
minutes:
  first_take: 5
  video_worksheet: 28
  finish: 10
  turn_in: 2
essential_question: How can the same quantitative data tell a different visual story when the histogram
  bins change?
worksheet: u1_lesson5_live.html
rules_callout:
  title: READING HISTOGRAMS (keep on the page)
  body: A histogram groups observations into intervals; each bar gives the count in its interval. Values
    at a boundary go in the interval that starts there. Changing interval widths changes the appearance,
    not the observations. Narrow intervals can reveal separated groups and empty intervals; wide intervals
    summarize broad counts. A histogram does not show each exact value or attach a group label to each
    observation.
focus: aps-1.5-d3-1
reinforcement: []
exit_reflection: 'One thing the video changed about my first take: \hrulefill'
space:
  first_take: 0.9in
  a: 0.7in
  b: 1.4in
  c: 2.0in
teacher:
  phase_tag: Do Now (first take) $\rightarrow$ Explore (video + follow-along) $\rightarrow$ Exit (finish
    + turn in)
  teacher_does:
  - Board slide up at the bell. Read Priya's and Leo's claims once; do not endorse either.
  - Start the video follow-along at minute 5.
  - Return to the board slide at minute 33. Circulate and press for a graph feature plus a limit on the
    conclusion.
  - Collect at the door. Score part (c) only, E/P/I.
  students_do:
  - Commit to F or C and name one visible feature before instruction.
  - Complete the video follow-along on quantitative displays and histogram construction.
  - Finish (a)--(c), complete the exit line, and turn in the sheet.
  questions_to_ask:
  - Which observations changed when the bin width changed?
  - Point to the feature Leo can see in F that Priya cannot see in C.
  - Where in either histogram is the school-day label stored?
  - Name a question for which adding five narrow-bin counts is less useful than reading one broad bar.
  adult_role: Solo teacher. Circulate about five pairs. Ask students to separate what the graph suggests
    from what the unlabeled graph establishes; do not confirm F until both are addressed.
  watch_for:
  - Treating the two histograms as different samples rather than two bin choices for the same 30 days.
  - Assigning the lower cluster to school days and the upper cluster to weekends without checking date
    labels.
  - Claiming that narrow bins are automatically more honest for every question.
  first_take_note: Not graded. Expect a split between visual simplicity and retained detail.
