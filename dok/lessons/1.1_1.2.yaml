teacher:
  questions_to_ask:
  - What does each numeric column represent?
  - Which records belong to the original question?
  - What changes besides the qualifying count when records are omitted?
  watch_for:
  - Reporting a percentage without identifying tiles and the thickness threshold.
  - Treating stage codes or ZIP codes as measured amounts.
  - Changing only the numerator after removing records.
  - Confusing differing measured thicknesses with an established cause of variation.
