essential_question: When does a changed percentage answer a different question?
rules_callout:
  title: 'NOTES: CONTEXT, LABELS, AND PERCENTS'
  body: Individuals are the objects described by the data; variables are recorded characteristics. Quantitative
    variables measure amounts with units. Categorical variables identify groups; numeric codes may label ordered
    stages or places without measuring amounts. Variation means that a variable takes different values across individuals.\par
    A contextual report names the individuals, variable, units, and question. A percentage is $100\times\text{qualifying
    count}/\text{total count}$; percentage-point change is new percent minus old percent. State the denominator
    and disclose omitted records. A reporting decision should address the stated question and inclusion rule.
