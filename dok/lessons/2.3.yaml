topic: "2.3"
ced2026:
  unit: 2
  topic: '2.2'
  label: 'Two Categorical Variables: Summary Statistics'
title: Which Pass Rate Answers Which Question?
essential_question: How do the denominator and study design limit what a percentage can say?
worksheet: u2_lesson3_live.html
rules_callout:
  title: NAME THE DENOMINATOR, THEN THE CLAIM (keep on the page)
  body: 'A \textbf{marginal relative frequency} uses a row or column total divided by the table total.
    A

    \textbf{conditional relative frequency} uses a cell count divided by the total for the named
    group.

    To decide whether two categorical variables are associated, compare the same response''s conditional

    percentage across the groups. Different conditional distributions show association. They do not
    show cause

    when people choose their own groups; a fair causal comparison requires random assignment.

    '
focus: aps-2.3-d3-1
reinforcement: []
space:
  first_take: 0.9in
  a: 0.7in
  b: 1.4in
  c: 2.0in
teacher:
  questions_to_ask:
  - Which number or visible feature supports your claim?
  - Why does the other claim go beyond that evidence?
  - What would you tell someone who chose the other claim?
  watch_for:
  - A choice with copied numbers but no explanation of how they support it.
  - Treating a model or average as a guaranteed individual outcome.
  first_take_note: Not graded. Expect some students to believe two different pass rates cannot both
    be correct until their denominators are named.
