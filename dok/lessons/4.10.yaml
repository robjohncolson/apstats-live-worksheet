topic: "4.10"
ced2026:
  unit: 2
  topic: '2.10'
  label: The Binomial Distribution
title: Rare Is Not Never
minutes:
  first_take: 5
  video_worksheet: 28
  finish: 10
  turn_in: 2
essential_question: When does a low binomial probability count against a familiar chance model without
  proving it false?
worksheet: u4_lesson10-12_live.html
rules_callout:
  title: BINS BEFORE BINOMIAL (keep on the page)
  body: 'A binomial count uses Binary outcomes, Independent trials, a fixed Number of trials, and
    the Same success chance. Define $X$, $n$, and $p$. For exactly $x$ successes, $P(X=x)=\binom{n}{x}p^x(1-p)^{n-x}$.
    A cumulative probability adds the included counts. A small probability means unusual under the
    model, not impossible; it does not identify a cause.

    '
focus: aps-4.10-d3-1
reinforcement: []
exit_reflection: 'One thing the video changed about my first take: \hrulefill'
space:
  first_take: 0.9in
  a: 0.8in
  b: 1.3in
  c: 2.0in
teacher:
  phase_tag: Do Now (first take) $\rightarrow$ Explore (video + follow-along) $\rightarrow$ Exit
    (finish + turn in)
  teacher_does:
  - Show the board at the bell and collect a one-sentence first take without confirming a claim.
  - Run the named video follow-along, then allow about 10 minutes for parts (a)--(c).
  - Ask for evidence linked to a claim. Collect the sheet and hand-score part (c) with E/P/I.
  students_do:
  - Commit to one claim or neither and cite the result or graph before the lesson.
  - Complete the follow-along about BINS and exact versus cumulative binomial probability.
  - Finish (a)--(c), revise the first take in the exit line, and turn in the sheet.
  questions_to_ask:
  - Which number or visible feature supports your claim?
  - Why does the other claim go beyond that evidence?
  - What would you tell someone who chose the other claim?
  adult_role: Circulate and ask students to connect their choice to evidence. Score part (c) using
    the three required reasoning elements; do not require dropped extension work.
  watch_for:
  - A choice with copied numbers but no explanation of how they support it.
  - Treating a model or average as a guaranteed individual outcome.
  first_take_note: Not graded. Preserve the possibility of neither claim; both statements intentionally
    overreach in different directions.
