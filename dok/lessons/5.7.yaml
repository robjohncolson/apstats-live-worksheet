# Topic 5.7 — Sampling Distributions for Sample Means (B: 2027-01-11)
topic: "5.7"
ced2026: { unit: 4, topic: "4.1", label: "Sampling Distributions for Sample Means" }
title: "Two Production Lines, Two Sampling Plans"
minutes: { first_take: 5, video_worksheet: 28, finish: 10, turn_in: 2 }
essential_question: "How do population shape, sample size, and sampling variability determine whether a normal probability for a sample mean is trustworthy?"
worksheet: "u5_lesson7_live.html"

rules_callout:
  title: "MODEL SAMPLE MEANS, NOT INDIVIDUAL VALUES (keep on the page)"
  body: |
    For an SRS of size $n$, $\mu_{\bar X}=\mu$ and $\sigma_{\bar X}=\sigma/\sqrt n$ when
    $n\leq0.10N$ for sampling without replacement. The sampling distribution of $\bar X$ is
    approximately normal if the population is approximately normal (for any $n$)
    \textbf{or} if the population is not normal but $n\geq30$ (Central Limit Theorem).
    A normal tail probability describes the mean of an entire random sample, not one individual value.

