  watch_for:
    - "Using the observed interior count as its own expected count."
    - "Rounding an expected count of exactly 5 upward before checking the condition."
    - "Combining categories solely to make the condition pass without considering meaning."
  first_take_note: "Not graded. The observed cells were chosen to pass a tempting but incorrect checklist while one expected cell lands exactly on the boundary."

