# Topic 4.6 --- Independent Events and Unions of Events
topic: "4.6"
ced2026: { unit: 2, topic: "2.7", label: "Independent Events & Unions" }
title: "Overlap Does Not Decide Independence"
minutes: { first_take: 5, video_worksheet: 28, finish: 10, turn_in: 2 }
essential_question: "Which probability comparison determines independence, and how is that different from checking overlap?"
worksheet: "u4_lesson6_live.html"

rules_callout:
  title: "INDEPENDENCE, INTERSECTION, AND UNION (keep on the page)"
  body: |
    Events $A$ and $B$ are \textbf{independent} exactly when knowing one does not change the probability of the other:
    $P(A\mid B)=P(A)$. Equivalently, $P(A\cap B)=P(A)P(B)$. Establish independence before using that product.
    \textbf{Mutually exclusive} events have no overlap, so $P(A\cap B)=0$; this is a different relationship.
    For any two events, $P(A\cup B)=P(A)+P(B)-P(A\cap B)$.

