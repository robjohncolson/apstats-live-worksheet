teacher:
  phase_tag: "Do Now (first take) $\\rightarrow$ Explore (video + follow-along) $\\rightarrow$ Exit (finish + turn in)"
  teacher_does:
    - "Board slide up at the bell. Ask what evidence measures a cell's effect on the statistic."
    - "Begin the 8.6 video follow-along at minute 5."
    - "Return at minute 33. Require a two-cell comparison and a bounded inference conclusion."
    - "Collect at the door. Score part (c) only, E/P/I."
  students_do:
    - "Commit to one account and name the evidence needed to evaluate it."
    - "Complete the follow-along, finish (a)--(c), revise, and turn in."
  questions_to_ask:
    - "Why can a 12.75 gap contribute more than a 13.75 gap?"
    - "Which expected count scales each disputed gap?"
    - "What does the upper-tail probability say under no association?"
    - "Which design feature permits population generalization, and which missing feature blocks causation?"
  adult_role: "Solo teacher. Require cell contributions, the p-value, population scope, and a causal limit."
  watch_for:
    - "Selecting a driver from the largest raw observed-minus-expected gap without dividing by its expected count."
    - "Turning the upper-tail p-value into the probability that the null hypothesis is true."
    - "Treating an SRS of cardholders as random assignment of their chosen notification methods."
  first_take_note: "Not graded. Students should identify both numerical and design evidence still needed."

