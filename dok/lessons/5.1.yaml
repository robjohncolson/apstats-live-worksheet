# Topic 5.1 — Introducing Statistics: Why Is My Sample Not Like Yours? (B: 2026-11-12)
topic: "5.1"
ced2026: { unit: 2, topic: "2.12", label: "Sampling Distributions & the CLT" }
title: "One Sample Far From the Others"
essential_question: "When is an unusual sample statistic evidence of an error, and when is it ordinary sampling variability?"
worksheet: "u5_lesson1-2_live.html"

rules_callout:
  title: "PARAMETER FIXED, STATISTIC VARIABLE (keep on the page)"
  body: |
    A \textbf{population parameter}, such as $\mu$, describes the entire population and stays fixed.
    A \textbf{sample statistic}, such as $\bar{x}$, is computed from one sample.
    \textbf{Sampling variability} is the natural variation in statistics from different random samples of the same size from one population.
    A graph shows the recorded results; details of data collection help us investigate possible mistakes.

focus: aps-5.1-d3-1
reinforcement: []
space: { first_take: 0.9in, a: 0.7in, b: 1.4in, c: 2.0in }

teacher:
  questions_to_ask:
    - "Which number belongs to the whole population, and which belongs to Elena's ten packages?"
    - "Do the other 19 sample means match one another exactly?"
    - "What evidence about the sampling procedure would you need before calling 520 an error?"
    - "Would more repetitions or more packages per sample shrink the distribution itself?"
  watch_for:
    - "Treating the population mean as the required result of every random sample."
    - "Calling the 12-gram gap proof of a recording mistake."
    - "Saying more simulated repetitions shrink variability when each sample remains n equals 10."
  first_take_note: "Not graded. Expect students to distrust the isolated value; the finish should preserve unusualness while removing the unsupported error claim."

