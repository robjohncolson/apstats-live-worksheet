# Topic 1.7 --- Summary Statistics for a Quantitative Variable
topic: "1.7"
ced2026: { unit: 1, topic: "1.7", label: "Summary Statistics for a Quantitative Variable" }
title: "Which Summary Tells the Story?"
minutes: { first_take: 5, video_worksheet: 28, finish: 10, turn_in: 2 }
essential_question: "How can a statistic be calculated correctly but still be the wrong summary to report?"
worksheet: "u1_lesson7_live.html"

rules_callout:
  title: "CENTER, SPREAD, AND OUTLIERS (keep on the page)"
  body: |
    $\bar{x}=\dfrac{\sum x_i}{n}$ \textperiodcentered\
    $s_x=\sqrt{\dfrac{\sum(x_i-\bar{x})^2}{n-1}}$ \textperiodcentered\
    $\mathrm{IQR}=Q_3-Q_1$. For odd $n$, use the ordered values \textbf{before the overall median's position} for $Q_1$
    and those \textbf{after its position} for $Q_3$; do not include the overall median itself in either half.\\
    Outlier fences: $Q_1-1.5(\mathrm{IQR})$ and $Q_3+1.5(\mathrm{IQR})$. Mean and SD are
    \textbf{nonresistant}; median and IQR are \textbf{resistant}. Match the pair to the distribution.

focus: aps-1.7-d3-1
reinforcement: []
