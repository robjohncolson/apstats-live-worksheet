# Topic 6.11 — Carrying Out a Test for the Difference of Two Population Proportions
topic: "6.11"
ced2026: { unit: 3, topic: "3.13", label: "Carrying Out a Test (difference of two proportions)" }
title: "One Result, Two Claims"
essential_question: "What does a significant test against zero establish, and what practical claim remains untested?"
worksheet: "u6_lesson11_live.html"

rules_callout:
  title: "CALCULATE, INTERPRET, THEN BOUND THE CLAIM (keep on the page)"
  body: |
    For $H_0:p_1-p_2=0$, pool $\hat p_c=(x_1+x_2)/(n_1+n_2)$ and use
    $z=\dfrac{(\hat p_1-\hat p_2)-0}{\sqrt{\hat p_c(1-\hat p_c)(1/n_1+1/n_2)}}$.
    A two-sided test uses $P(|Z|\ge |z|)$. The $p$-value assumes $H_0$ is true and measures
    how often random chance would produce a difference at least as extreme. If the $p$-value is at most $\alpha$, reject
    $H_0$; otherwise fail to reject it. A test against zero addresses whether a difference exists;
    it does not by itself establish that the difference exceeds a separate practical threshold.
    Printed normal table: $P(Z\leq2.0412)=0.979387$. A right-tail area is 1 minus the left area; the two-sided area is twice that tail.

focus: aps-6.11-d3-1
reinforcement: []
space: { first_take: 0.9in, a: 0.7in, b: 1.4in, c: 2.0in }

teacher:
  questions_to_ask:
    - "Which null difference did this test actually use?"
    - "What does 0.041 describe under that null model?"
    - "How does the observed two-point gap compare with the five-point deployment standard?"
    - "What additional interval or test would address the five-point claim directly?"
  watch_for:
    - "Using unpooled standard errors in a null test of equal proportions."
    - "Interpreting the p-value as the probability that the population proportions are equal."
    - "Concluding that rejection of zero proves an improvement of at least five percentage points."
  first_take_note: "Not graded. The large samples make a two-point difference statistically detectable; students must decide what the specified deployment rule still requires."

