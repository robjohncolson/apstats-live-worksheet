topic: "4.7"
ced2026:
  unit: 2
  topic: '2.8'
  label: Introduction to Random Variables
title: Average Payoff, Typical Ticket
minutes:
  first_take: 5
  video_worksheet: 28
  finish: 10
  turn_in: 2
essential_question: How can an average payout and the most common outcome describe different parts
  of the same distribution?
worksheet: u4_lesson7-8_live.html
rules_callout:
  title: DISTRIBUTIONS AND ONE OUTCOME (keep on the page)
  body: 'A discrete random variable assigns a number to each random outcome. Its distribution lists
    every possible value with a probability between 0 and 1; all probabilities add to 1. Add the
    probabilities of the outcomes in an event. Net profit is prize minus ticket cost. An average
    can differ from the most common outcome; large prizes can raise it, and it does not promise one
    buyer''s result.

    '
focus: aps-4.7-d3-1
reinforcement: []
exit_reflection: 'One thing the video changed about my first take: \hrulefill'
space:
  first_take: 0.9in
  a: 0.7in
  b: 1.4in
  c: 2.0in
teacher:
  phase_tag: Do Now (first take) $\rightarrow$ Explore (video + follow-along) $\rightarrow$ Exit
    (finish + turn in)
  teacher_does:
  - Show the board at the bell and collect a one-sentence first take without confirming a claim.
  - Run the named video follow-along, then allow about 10 minutes for parts (a)--(c).
  - Ask for evidence linked to a claim. Collect the sheet and hand-score part (c) with E/P/I.
  students_do:
  - Compare the given average with the ticket distribution, finish (a)--(c), and turn in the sheet.
  questions_to_ask:
  - Which number or visible feature supports your claim?
  - Why does the other claim go beyond that evidence?
  - What would you tell someone who chose the other claim?
  adult_role: Circulate and ask students to connect their choice to evidence. Score part (c) using
    the three required reasoning elements; do not require dropped extension work.
  watch_for:
  - A choice with copied numbers but no explanation of how they support it.
  - Treating a model or average as a guaranteed individual outcome.
  first_take_note: Not graded. Students may focus on the top prize or on the 175 losing tickets;
    the distribution should connect those views.
