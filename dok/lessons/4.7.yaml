    rows: ["Top prize", "Second prize", "Small prize", "No prize"]
    cells:
      - ["$98$", "$1/200$"]
      - ["$23$", "$4/200$"]
      - ["$3$", "$20/200$"]
      - ["$-2$", "$175/200$"]
