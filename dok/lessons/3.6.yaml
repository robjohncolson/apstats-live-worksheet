topic: "3.6"
ced2026:
  unit: 1
  topic: '1.13'
  label: Experimental Design
title: Fertilizer in Two Greenhouses
essential_question: When does blocking reveal a treatment effect more clearly than complete randomization?
worksheet: u3_lesson6-7_live.html
rules_callout:
  title: BLOCK, RANDOMIZE, THEN INFER (keep on the page)
  body: 'In a \textbf{completely randomized design}, treatments are assigned across all units. In a

    \textbf{randomized block design}, first group units that are similar on a relevant variable, then
    randomly

    assign treatments \emph{within each block}. Blocking separates natural block-to-block variability
    from the

    treatment comparison. Random assignment supports cause only when the observed difference is too large
    for

    chance alone; generalization also requires units that represent the target population.

    '
focus: aps-3.6-d3-1
reinforcement: []
space:
  first_take: 0.9in
  a: 0.8in
  b: 1.4in
  c: 2.0in
teacher:
  questions_to_ask:
  - Which comparison estimates fertilizer effect without mixing greenhouses?
  - 'Which is larger: the greenhouse gap or the treatment gap?'
  - How could complete randomization accidentally pair treatment with shade?
  - What does random assignment permit, what does significance add, and what would broader generalization
    need?
  watch_for:
  - Calling greenhouse a treatment rather than the blocking variable.
  - Saying complete randomization is invalid instead of less precise for this setting.
  - Treating the displayed means alone as proof of statistical significance or broad generalizability.
  first_take_note: Not graded. Accept either design initially if the student identifies a real tradeoff;
    the calculations should sharpen the revision.
