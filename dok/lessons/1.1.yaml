# Topic 1.1 --- Introducing Statistics: What Can We Learn from Data?
topic: "1.1"
ced2026: { unit: 1, topic: "1.1", label: "Introducing Statistics: What Can We Learn from Data?" }
title: "What Can These Data Support?"
minutes: { first_take: 5, video_worksheet: 28, finish: 10, turn_in: 2 }
essential_question: "How do the data collected limit what we can honestly claim?"
worksheet: "u1_lesson1_live.html"

rules_callout:
  title: "CLAIMS NEED CONTEXT AND EVIDENCE (keep on the page)"
  body: |
    A number or pattern is meaningful only in \textbf{context}: who or what was measured, what variable was recorded,
    when it was recorded, and its units. A statement that says \emph{tended to} allows exceptions.\\
    A pattern can describe the individuals measured. To generalize to a larger group, the people measured must
    represent that group. To claim \textbf{cause}, look for an assigned comparison in an experiment; an observed
    pattern alone leaves other explanations possible.

focus: aps-1.1-d3-1
reinforcement: []
exit_reflection: "One thing the video changed about my first take: \\hrulefill"

space: { first_take: 0.9in, a: 0.7in, b: 1.4in, c: 2.0in }

teacher:
  phase_tag: "Do Now (first take) $\\rightarrow$ Explore (video + follow-along) $\\rightarrow$ Exit (finish + turn in)"
  teacher_does:
    - "Board slide up at the bell. Read both newspaper claims once without endorsing either."
    - "Begin the video follow-along at minute 5; leave first takes ungraded."
    - "Return to the board slide at minute 33. Circulate and ask students to separate pattern, scope, and cause."
    - "Collect at the door. Score part (c) only, E/P/I."
  students_do:
    - "Commit to one claim, neither claim, or both in a one-sentence first take."
    - "Complete the video follow-along about questions, variation, and context."
    - "Finish (a)--(c), revise the first take in the exit line, and turn in the sheet."
  questions_to_ask:
    - "Which paired values make the words 'tended to' reasonable even with Leo in the table?"
    - "Which words in Claim 2 change the scope, and which word makes it causal?"
    - "What does 'surveyed' tell you that 'randomly assigned' would not?"
    - "Would a random school sample establish cause? Would random assignment in this one class represent the school?"
  adult_role: "Solo teacher. Circulate ~5 pairs. Ask students to point to the table or collection description before accepting a claim; do not supply the words 'scope' or 'cause' first."
  watch_for:
    - "Using Leo to erase the overall tendency instead of treating him as one exception."
    - "Saying only '12 is too small' without explaining who the 12 students represent."
    - "Treating a random sample as proof of cause, or random assignment in one class as proof about the whole school."
  first_take_note: "Not graded. Expect Claim 2; the revision should become more bounded."

# Topic 1.1 has no tutor artifact. These two lines are copied from apstat_1_framework.md.
tether:
