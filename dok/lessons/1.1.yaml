topic: "1.1"
ced2026:
  unit: 1
  topic: '1.1'
  label: 'Introducing Statistics: What Can We Learn from Data?'
title: What Can These Data Support?
minutes:
  first_take: 5
  video_worksheet: 28
  finish: 10
  turn_in: 2
essential_question: How can leaving out valid data change the answer to a question?
worksheet: u1_lesson1_live.html
rules_callout:
  title: USE DATA IN CONTEXT (keep on the page)
  body: A variable is a characteristic recorded for each individual. Variation means the values differ.
    A threshold is a cutoff used to decide whether action is needed. $\text{Percent}=100\times\dfrac{\text{count
    meeting the condition}}{\text{total count}}$. When observations are removed, count the remaining observations
    and use the remaining total. Interpret the result in the original context.
focus: aps-1.1-d3-1
reinforcement: []
exit_reflection: 'One thing the video changed about my first take: \hrulefill'
space:
  first_take: 0.9in
  a: 0.7in
  b: 1.4in
  c: 2.0in
teacher:
  phase_tag: Do Now (first take) $\rightarrow$ Explore (video + follow-along) $\rightarrow$ Exit (finish
    + turn in)
  teacher_does:
  - Board slide up at the bell. Read both newspaper claims once without endorsing either.
  - Begin the video follow-along at minute 5; leave first takes ungraded.
  - Return to the board at minute 33. Ask students to connect each percent to the group it describes.
  - Collect at the door. Score part (c) only, E/P/I.
  students_do:
  - Commit to one claim, neither claim, or both in a one-sentence first take.
  - Complete the video follow-along about questions, variation, and context.
  - Finish (a)--(c), revise the first take in the exit line, and turn in the sheet.
  questions_to_ask:
  - Who is included in each percent?
  - Why does the total change when two observations are removed?
  - Were the removed values recording errors?
  - Which conclusion answers the original question about all 12 students?
  adult_role: Solo teacher. Ask which students each fraction includes; let students decide whether omission
    is justified.
  watch_for:
  - Dividing by 12 after removing two students
  - Calling the shortened percent an arithmetic error rather than a changed data set
  - Treating a valid low value as permission to omit it
  first_take_note: Not graded. Students can choose using the sleep values and the printed threshold before
    formal vocabulary.
tether:
- \textbf{VAR-1.A} Identify questions to be answered, based on variation in one-variable data. \textbf{[Skill
  1.A]}
- \textbf{VAR-1.A.1} Numbers may convey meaningful information, when placed in context.
