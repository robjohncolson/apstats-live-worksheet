# Topic 4.11 — Parameters for a Binomial Distribution
topic: "4.11"
ced2026: { unit: 2, topic: "2.10", label: "The Binomial Distribution" }
title: "Unusual Does Not Mean Impossible"
minutes: { first_take: 5, video_worksheet: 28, finish: 10, turn_in: 2 }
essential_question: "How do binomial parameters help distinguish an unusual count from an impossible one?"
worksheet: "u4_lesson10-12_live.html"

rules_callout:
  title: "CENTER, SPREAD, AND UNUSUAL COUNTS (keep on the page)"
  body: |
    For $X\sim\mathrm{Bin}(n,p)$, $\mu_X=np$ and $\sigma_X=\sqrt{np(1-p)}$; both use count units.
    Standardize with $z=\dfrac{x-\mu_X}{\sigma_X}$. A normal approximation is reasonable when both
    $np\geq10$ and $n(1-p)\geq10$. A count far from the mean may be unusual, but every value from 0 through
    $n$ still has positive binomial probability when $0<p<1$.

