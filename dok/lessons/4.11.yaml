topic: "4.11"
ced2026:
  unit: 2
  topic: '2.10'
  label: The Binomial Distribution
title: Unusual Does Not Mean Impossible
minutes:
  first_take: 5
  video_worksheet: 28
  finish: 10
  turn_in: 2
essential_question: How do binomial parameters help distinguish an unusual count from an impossible
  one?
worksheet: u4_lesson10-12_live.html
rules_callout:
  title: CENTER, SPREAD, AND UNUSUAL COUNTS (keep on the page)
  body: 'For a binomial count, $\mu_X=np$ and $\sigma_X=\sqrt{np(1-p)}$, both in count units. The
    mean is an average over many comparable sets of trials. The standard deviation describes a typical
    distance from that mean. A result far from the mean may be unusual, but a small positive probability
    does not mean impossible or prove that the model changed.

    '
focus: aps-4.11-d3-1
reinforcement: []
exit_reflection: 'One thing the video changed about my first take: \hrulefill'
space:
  first_take: 0.9in
  a: 0.8in
  b: 1.3in
  c: 2.0in
teacher:
  phase_tag: Do Now (first take) $\rightarrow$ Explore (video + follow-along) $\rightarrow$ Exit
    (finish + turn in)
  teacher_does:
  - Show the board at the bell and collect a one-sentence first take without confirming a claim.
  - Run the named video follow-along, then allow about 10 minutes for parts (a)--(c).
  - Ask for evidence linked to a claim. Collect the sheet and hand-score part (c) with E/P/I.
  students_do:
  - Choose the coach or analyst and name one quantity to check before the lesson.
  - Complete the follow-along about binomial mean, standard deviation, and interpretation.
  - Finish (a)--(c), revise the first take in the exit line, and turn in the sheet.
  questions_to_ask:
  - Which number or visible feature supports your claim?
  - Why does the other claim go beyond that evidence?
  - What would you tell someone who chose the other claim?
  adult_role: Circulate and ask students to connect their choice to evidence. Score part (c) using
    the three required reasoning elements; do not require dropped extension work.
  watch_for:
  - A choice with copied numbers but no explanation of how they support it.
  - Treating a model or average as a guaranteed individual outcome.
  first_take_note: Not graded. Listen for whether students use impossible to mean unlikely; the calculation
    should sharpen that language.
