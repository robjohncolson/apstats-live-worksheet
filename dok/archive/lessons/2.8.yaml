topic: "2.8"
ced2026:
  unit: 5
  topic: '5.5'
  label: Least-Squares Regression
title: Which Regression Line Fits?
essential_question: How do several regression properties distinguish lines that share the same mean
  point?
worksheet: u2_lesson8_live.html
rules_callout:
  title: MAKE THE REGRESSION PROPERTIES AGREE (keep on the page)
  body: 'The least-squares regression line (LSRL) minimizes the sum of squared residuals and contains

    $(\bar x,\bar y)$. Its slope is $b=r(s_y/s_x)$, its intercept is

    $a=\bar y-b\bar x$, and $r^2$ is the proportion of response variation explained by the

    linear model. Interpret slope as a predicted response change per unit of $x$. The intercept

    predicts at $x=0$, which may be outside the observed range and unsupported in context.

    '
focus: aps-2.8-d3-1
reinforcement: []
space:
  first_take: 0.65in
  a: 0.55in
  b: 1.0in
  c: 1.45in
teacher:
  questions_to_ask:
  - Which number or visible feature supports your claim?
  - Why does the other claim go beyond that evidence?
  - What would you tell someone who chose the other claim?
  watch_for:
  - A choice with copied numbers but no explanation of how they support it.
  - Treating a model or average as a guaranteed individual outcome.
  first_take_note: Not graded. Credit a committed clause-level comparison supported by one property.
