  topic: '5.1'
  label: Graphical Representations (two quantitative variables)
title: One Plot, Two Reporting Strategies
essential_question: How should several scatterplot features be weighed when descriptions conflict?
worksheet: u2_lesson4_live.html
rules_callout:
  title: BUILD A COMPLETE SCATTERPLOT DESCRIPTION (keep on the page)
  body: 'Put the explanatory variable on the $x$-axis and the response on the $y$-axis.

    Describe direction, form, strength, and unusual features in context. Linear form has

    an approximately constant rate; nonlinear form may curve or change rate. Report an

    unusual point without letting that one point erase the pattern followed by the rest.

    '
focus: aps-2.4-d3-1
reinforcement: []
space:
  first_take: 0.85in
  a: 0.55in
  b: 1.1in
  c: 1.7in
teacher:
  questions_to_ask:
  - Which number or visible feature supports your claim?
  - Why does the other claim go beyond that evidence?
  - What would you tell someone who chose the other claim?
  watch_for:
  - A choice with copied numbers but no explanation of how they support it.
  - Treating a model or average as a guaranteed individual outcome.
  first_take_note: Not graded; students revise after coordinating all features.
