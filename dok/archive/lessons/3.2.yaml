topic: "3.2"
ced2026:
  unit: 1
  topic: '1.10'
  label: Investigative Question & Data Collection
title: What Can Each Study Claim?
essential_question: How do selection and assignment determine the conclusions a study can support?
worksheet: u3_lesson2_live.html
rules_callout:
  title: SELECTION, ASSIGNMENT, AND SCOPE (keep on the page)
  body: An \textbf{observational study} records data without imposing treatments. An \textbf{experiment}
    assigns treatments. A confounding factor is an outside factor related to both the groups and the outcome.
    Random assignment tends to balance such factors between treatments. Random selection or other evidence
    of representativeness supports generalization to the population selected from. Observational comparisons
    alone cannot establish cause.
focus: aps-3.2-d3-1
reinforcement: []
space:
  first_take: 0.9in
  a: 0.8in
  b: 1.4in
  c: 2.0in
teacher:
  questions_to_ask:
  - Who decides whether a student receives tutoring in each plan?
  - How could motivation affect both the group a student joins and the score later measured?
  - What does the coin flip balance, and among whom?
  - Were the volunteers selected by chance from all students? What conclusion does that limit?
  watch_for:
  - Calling any comparison of two groups an experiment.
  - Naming a lurking variable without linking it to both explanatory and response variables.
  - Assuming random assignment also makes volunteers representative of all students.
  first_take_note: Not graded. Listen for students who say Plan B is stronger merely because it is random
    without naming what is randomized.
