title: One Commute, Two Questions
worksheets: ["u1_lesson4_live.html", "u1_lesson5_live.html"]
essential_question: Which questions can each display answer, and which connection is lost?
rules_callout:
  title: TWO TOPICS, ONE DATA STORY
  body: '1.4: Bar charts compare categorical counts or proportions; a zero baseline keeps heights proportional.\\
    1.5: Histograms group quantitative values into ordered intervals; bin width affects detail.\\ Neither
    pooled graph preserves the link between each student\textquotesingle s mode and travel time.'
focus: aps-1.4_1.5-d3-1
reinforcement: []
space:
  first_take: 0.8in
  a: 0.6in
  b: 1.3in
  c: 2.1in
teacher:
  questions_to_ask:
  - Which feature settles that claim?
  - What information would your chosen display hide?
  watch_for:
  - Calling Bus the unique winner despite the tie.
  - Treating a histogram interval as one exact travel time.
  - Assigning long trips to bus riders without linked observations.
  first_take_note: Ungraded commitment; accept any evidence-based first impression.
