topic: "4.1"
ced2026:
  unit: 2
  topic: '2.3'
  label: Estimating Probabilities Using Simulation
title: Can Chance Make a Streak?
essential_question: How can simulation distinguish a surprising-looking random pattern from evidence
  against a chance model?
worksheet: u4_lesson1-2_live.html
rules_callout:
  title: MODEL THE PATTERN, NOT THE STORY (keep on the page)
  body: 'A random process can produce streaks. A simulation uses chance to imitate a process; each
    trial must match the original number of independent flips and the stated chance of heads. Record
    the outcome of each trial and calculate $\text{successful trials}/\text{total trials}$. Many
    trials reduce chance variation in this estimate. A simulation result is evidence about a model,
    not proof that a real coin is fair.

    '
focus: aps-4.1-d3-1
reinforcement: []
space:
  first_take: 0.9in
  a: 0.7in
  b: 1.3in
  c: 2.0in
teacher:
  questions_to_ask:
  - Which number or visible feature supports your claim?
  - Why does the other claim go beyond that evidence?
  - What would you tell someone who chose the other claim?
  watch_for:
  - A choice with copied numbers but no explanation of how they support it.
  - Treating a model or average as a guaranteed individual outcome.
  first_take_note: Not graded. Preserve surprise; the key move is replacing visual intuition with
    a matched chance model.
tether:
- \textbf{VAR-1.F} Identify questions suggested by patterns in data. \textbf{[Skill 1.A]}
- \textbf{VAR-1.F.1} Patterns in data do not necessarily mean that variation is not random.
