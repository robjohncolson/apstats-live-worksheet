<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AP Statistics — Topic Calendar</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f8fafc;
    color: #1e293b;
    line-height: 1.5;
  }

  /* Header */
  .header {
    background: #1e293b;
    color: #f8fafc;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header h1 {
    font-size: 1.25rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .period-toggle {
    display: flex;
    gap: 4px;
    background: #334155;
    border-radius: 8px;
    padding: 3px;
  }
  .period-btn {
    border: none;
    background: transparent;
    color: #94a3b8;
    font-size: 0.875rem;
    font-weight: 600;
    padding: 6px 18px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .period-btn:hover { color: #e2e8f0; }
  .period-btn.active {
    background: #3b82f6;
    color: #fff;
  }

  /* Status bar / banner */
  .banner {
    padding: 12px 24px;
    text-align: center;
    font-size: 0.875rem;
    font-weight: 500;
  }
  .banner.loading { background: #e0f2fe; color: #0369a1; }
  .banner.error   { background: #fee2e2; color: #b91c1c; }

  /* Legend */
  .legend {
    display: flex;
    gap: 20px;
    padding: 12px 24px;
    border-bottom: 1px solid #e2e8f0;
    background: #fff;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.8rem;
    color: #64748b;
  }
  .legend-swatch {
    width: 14px;
    height: 14px;
    border-radius: 3px;
    border-left: 4px solid;
    background: #fff;
  }
  .legend-swatch.scheduled { border-color: #e2e8f0; }
  .legend-swatch.posted    { border-color: #3b82f6; }
  .legend-swatch.taught    { border-color: #22c55e; }

  /* Grid container */
  .calendar { padding: 16px 24px 48px; }

  /* Day-of-week header */
  .dow-header {
    display: grid;
    grid-template-columns: 120px repeat(5, 1fr);
    gap: 1px;
    margin-bottom: 1px;
  }
  .dow-header .label {
    padding: 8px 10px;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #64748b;
    background: #fff;
    text-align: center;
    border-bottom: 2px solid #e2e8f0;
  }
  .dow-header .label:first-child { text-align: left; }

  /* Week row */
  .week-row {
    display: grid;
    grid-template-columns: 120px repeat(5, 1fr);
    gap: 1px;
    margin-bottom: 1px;
  }

  /* Week label */
  .week-label {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 10px 12px;
    background: #fff;
    border-right: 2px solid #e2e8f0;
    min-height: 80px;
  }
  .week-label .wnum {
    font-size: 0.85rem;
    font-weight: 700;
    color: #1e293b;
  }
  .week-label .qtr {
    font-size: 0.7rem;
    color: #94a3b8;
    font-weight: 500;
  }

  /* Day cell */
  .day-cell {
    background: #fff;
    border: 1px solid #f1f5f9;
    padding: 8px 10px;
    min-height: 80px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    transition: background 0.15s;
  }
  .day-cell.today {
    background: #fef9c3;
    border-color: #fde047;
  }
  .day-cell.empty {
    background: #fafafa;
  }
  .day-date {
    font-size: 0.75rem;
    font-weight: 600;
    color: #94a3b8;
  }
  .day-cell.today .day-date { color: #854d0e; }

  /* Topic card */
  .topic-card {
    border-left: 4px solid #e2e8f0;
    border-radius: 4px;
    padding: 5px 8px;
    background: #f8fafc;
    font-size: 0.8rem;
    line-height: 1.35;
  }
  .topic-card.status-posted    { border-left-color: #3b82f6; }
  .topic-card.status-taught    { border-left-color: #22c55e; }
  .topic-card.status-scheduled { border-left-color: #e2e8f0; }
  .topic-card .topic-id {
    font-weight: 700;
    color: #1e293b;
  }
  .topic-card .topic-title {
    color: #64748b;
    font-size: 0.75rem;
  }

  /* Current-week marker */
  .week-row.current-week .week-label {
    border-right-color: #3b82f6;
  }
  .week-row.current-week .week-label .wnum {
    color: #3b82f6;
  }

  /* Responsive: stack on narrow screens */
  @media (max-width: 700px) {
    .dow-header { display: none; }
    .week-row {
      grid-template-columns: 1fr;
      margin-bottom: 12px;
    }
    .week-label {
      border-right: none;
      border-bottom: 2px solid #e2e8f0;
      flex-direction: row;
      gap: 8px;
      align-items: baseline;
      min-height: unset;
      padding: 8px 10px;
    }
    .day-cell { min-height: 50px; }
    .day-cell::before {
      content: attr(data-dow);
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #94a3b8;
      letter-spacing: 0.04em;
    }
    .day-cell.empty.no-topics { display: none; }
    .header { padding: 12px 16px; }
    .calendar { padding: 12px 16px 40px; }
    .legend { padding: 10px 16px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>AP Statistics &mdash; Topic Calendar</h1>
  <div class="period-toggle">
    <button class="period-btn" data-period="B">B</button>
    <button class="period-btn" data-period="E">E</button>
  </div>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-swatch scheduled"></div> Scheduled</div>
  <div class="legend-item"><div class="legend-swatch posted"></div> Posted</div>
  <div class="legend-item"><div class="legend-swatch taught"></div> Taught</div>
</div>

<div id="status-banner" class="banner loading" style="display:none;"></div>

<div id="calendar" class="calendar"></div>

<script>
(function () {
  // ── Config ──
  const SUPABASE_URL = 'https://hgvnytaqmuybzbotosyj.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhndm55dGFxbXV5Ynpib3Rvc3lqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUxNTE5MTMsImV4cCI6MjA4MDcyNzkxM30.-LcH_zly4pXoX_2Vra-RbH9twPvUj6xAJp66xPi02tU';

  // ── Week calculation ──
  const ANCHOR_MONDAY = new Date(2026, 2, 2); // March 2, 2026
  const ANCHOR_WEEK = 23;

  function determineSchoolWeek(dateStr) {
    var parts = dateStr.split('-').map(Number);
    var target = new Date(parts[0], parts[1] - 1, parts[2]);
    var dow = target.getDay();
    var targetMonday = new Date(target);
    targetMonday.setDate(target.getDate() - ((dow + 6) % 7));
    var msDiff = targetMonday.getTime() - ANCHOR_MONDAY.getTime();
    var weekDiff = Math.round(msDiff / (7 * 24 * 60 * 60 * 1000));
    var weekNum = ANCHOR_WEEK + weekDiff;
    var quarter;
    if (weekNum <= 20) quarter = 'S2';
    else if (weekNum <= 30) quarter = 'Q3';
    else quarter = 'Q4';
    return { quarter: quarter, weekNum: weekNum };
  }

  // ── Date helpers ──
  var DOW_NAMES = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];

  function toDateStr(d) {
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }

  function parseDate(s) {
    var p = s.split('-').map(Number);
    return new Date(p[0], p[1] - 1, p[2]);
  }

  function formatShort(dateStr) {
    var d = parseDate(dateStr);
    return (d.getMonth() + 1) + '/' + d.getDate();
  }

  function getMondayOfDate(dateStr) {
    var d = parseDate(dateStr);
    var dow = d.getDay();
    var mon = new Date(d);
    mon.setDate(d.getDate() - ((dow + 6) % 7));
    return mon;
  }

  function todayStr() {
    var n = new Date();
    return toDateStr(n);
  }

  // ── DOM refs ──
  var calendarEl = document.getElementById('calendar');
  var bannerEl = document.getElementById('status-banner');
  var periodBtns = document.querySelectorAll('.period-btn');

  // ── State ──
  var currentPeriod = 'B';

  // ── URL params ──
  function readPeriodFromURL() {
    var params = new URLSearchParams(window.location.search);
    var p = (params.get('period') || 'B').toUpperCase();
    return (p === 'E') ? 'E' : 'B';
  }

  function setPeriodURL(period) {
    var url = new URL(window.location);
    url.searchParams.set('period', period);
    window.history.replaceState(null, '', url);
  }

  function updateToggleUI() {
    periodBtns.forEach(function (btn) {
      btn.classList.toggle('active', btn.getAttribute('data-period') === currentPeriod);
    });
  }

  // ── Fetch ──
  function fetchSchedule(period) {
    var url = SUPABASE_URL + '/rest/v1/topic_schedule?period=eq.' + period +
      '&select=topic,date,title,status,schoology_folder_id&order=date.asc';
    return fetch(url, {
      headers: { 'apikey': SUPABASE_ANON_KEY }
    }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    });
  }

  // ── Banner ──
  function showBanner(msg, type) {
    bannerEl.textContent = msg;
    bannerEl.className = 'banner ' + type;
    bannerEl.style.display = '';
  }
  function hideBanner() { bannerEl.style.display = 'none'; }

  // ── Render ──
  function render(rows) {
    calendarEl.innerHTML = '';
    if (!rows || rows.length === 0) {
      calendarEl.innerHTML = '<p style="padding:24px;color:#94a3b8;">No topics found for Period ' + currentPeriod + '.</p>';
      return;
    }

    // Group topics by date
    var byDate = {};
    rows.forEach(function (r) {
      if (!r.date) return;
      if (!byDate[r.date]) byDate[r.date] = [];
      byDate[r.date].push(r);
    });

    // Determine date range — earliest to latest, expanded to full weeks
    var allDates = Object.keys(byDate).sort();
    var firstMonday = getMondayOfDate(allDates[0]);
    var lastDate = parseDate(allDates[allDates.length - 1]);
    var lastDow = lastDate.getDay();
    var lastFriday = new Date(lastDate);
    // Move to Friday of that week
    var daysToFri = (5 - (lastDow === 0 ? 7 : lastDow));
    if (daysToFri < 0) daysToFri += 7;
    lastFriday.setDate(lastDate.getDate() + daysToFri);

    // Build array of weeks (each week = array of 5 date strings, Mon-Fri)
    var weeks = [];
    var cursor = new Date(firstMonday);
    while (cursor <= lastFriday) {
      var week = [];
      for (var d = 0; d < 5; d++) {
        week.push(toDateStr(cursor));
        cursor.setDate(cursor.getDate() + 1);
      }
      weeks.push(week);
      // Skip weekend
      cursor.setDate(cursor.getDate() + 2);
    }

    var today = todayStr();

    // Determine current week number for scroll target
    var currentWeekInfo = determineSchoolWeek(today);
    var scrollTarget = null;

    // Day-of-week header row
    var dowHeader = document.createElement('div');
    dowHeader.className = 'dow-header';
    var corner = document.createElement('div');
    corner.className = 'label';
    corner.textContent = '';
    dowHeader.appendChild(corner);
    DOW_NAMES.forEach(function (name) {
      var lbl = document.createElement('div');
      lbl.className = 'label';
      lbl.textContent = name;
      dowHeader.appendChild(lbl);
    });
    calendarEl.appendChild(dowHeader);

    // Render each week
    weeks.forEach(function (weekDates) {
      var wInfo = determineSchoolWeek(weekDates[0]);
      var row = document.createElement('div');
      row.className = 'week-row';
      if (wInfo.weekNum === currentWeekInfo.weekNum) {
        row.className += ' current-week';
        scrollTarget = row;
      }

      // Week label
      var label = document.createElement('div');
      label.className = 'week-label';
      var wnum = document.createElement('span');
      wnum.className = 'wnum';
      wnum.textContent = 'Week ' + wInfo.weekNum;
      var qtr = document.createElement('span');
      qtr.className = 'qtr';
      qtr.textContent = wInfo.quarter;
      label.appendChild(wnum);
      label.appendChild(qtr);
      row.appendChild(label);

      // Day cells
      weekDates.forEach(function (dateStr, idx) {
        var cell = document.createElement('div');
        cell.className = 'day-cell';
        cell.setAttribute('data-dow', DOW_NAMES[idx]);
        if (dateStr === today) cell.classList.add('today');

        var topics = byDate[dateStr] || [];
        if (topics.length === 0) {
          cell.classList.add('empty');
          cell.classList.add('no-topics');
        }

        // Date label
        var dateLabel = document.createElement('div');
        dateLabel.className = 'day-date';
        dateLabel.textContent = formatShort(dateStr);
        cell.appendChild(dateLabel);

        // Topic cards
        topics.forEach(function (t) {
          var card = document.createElement('div');
          var status = (t.status || 'scheduled').toLowerCase();
          card.className = 'topic-card status-' + status;
          var idSpan = document.createElement('div');
          idSpan.className = 'topic-id';
          idSpan.textContent = 'Topic ' + t.topic;
          card.appendChild(idSpan);
          if (t.title) {
            var titleSpan = document.createElement('div');
            titleSpan.className = 'topic-title';
            titleSpan.textContent = t.title;
            card.appendChild(titleSpan);
          }
          cell.appendChild(card);
        });

        row.appendChild(cell);
      });

      calendarEl.appendChild(row);
    });

    // Auto-scroll to current week
    if (scrollTarget) {
      setTimeout(function () {
        scrollTarget.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 100);
    }
  }

  // ── Load ──
  function load() {
    showBanner('Loading...', 'loading');
    fetchSchedule(currentPeriod).then(function (rows) {
      hideBanner();
      render(rows);
    }).catch(function () {
      showBanner('Could not load schedule. Check your connection.', 'error');
      calendarEl.innerHTML = '';
    });
  }

  // ── Period toggle handlers ──
  periodBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      var p = btn.getAttribute('data-period');
      if (p === currentPeriod) return;
      currentPeriod = p;
      updateToggleUI();
      setPeriodURL(p);
      load();
    });
  });

  // ── Init ──
  currentPeriod = readPeriodFromURL();
  updateToggleUI();
  load();
})();
</script>
</body>
</html>
