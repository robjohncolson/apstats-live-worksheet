// secure-key-store — Capacitor Android plugin: biometric-gated, hardware-wrapped
// storage for the teacher's Ed25519 signing-key JWK (ANDROID Phase 4 §3B).
// Discovered by `cap sync` via package.json capacitor.android.src; reads the app
// root's ext.* SDK versions (android-app/android/variables.gradle).
ext {
    biometricVersion = project.hasProperty('biometricVersion') ? rootProject.ext.biometricVersion : '1.1.0'
    appCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.6.1'
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
    }
}

apply plugin: 'com.android.library'

android {
    namespace "com.robcolson.apstats.securekey"
    compileSdk rootProject.ext.has('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 35
    defaultConfig {
        minSdkVersion rootProject.ext.has('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        targetSdkVersion rootProject.ext.has('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 35
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lintOptions {
        abortOnError false
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
    implementation "androidx.biometric:biometric:$biometricVersion"
    // BiometricPrompt needs a FragmentActivity; Capacitor's getActivity() returns an
    // AppCompatActivity. capacitor-android exposes appcompat only as `implementation`
    // (not on our compile classpath), so declare it explicitly to resolve the type.
    implementation "androidx.appcompat:appcompat:$appCompatVersion"
}
