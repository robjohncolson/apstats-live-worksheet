<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AP Statistics</title>
<!-- Mobile-first lesson launcher for the Android packet app (ANDROID_PACKET_APP_SPEC §2).
     Pure navigation: units → lessons → [▶ video] [✍ worksheet] [❓ quiz]. Data is the
     build-time lessons-index.json. The Desk stays the desktop home; this is the phone home. -->
<style>
  :root { --blue:#0b5cad; --ink:#1a1a1a; --bg:#f2f4f7; --card:#fff; --line:#dfe3e8; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; }
  body { font-family:-apple-system,Roboto,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
  header { position:sticky; top:0; background:var(--blue); color:#fff; z-index:5;
           padding:calc(12px + env(safe-area-inset-top,0)) 16px 12px; box-shadow:0 2px 6px rgba(0,0,0,.15); }
  header h1 { margin:0; font-size:19px; font-weight:700; }
  header .who { font-size:12px; opacity:.9; margin-top:3px; }
  header .hdr-row { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  header .hdr-btn { background:rgba(255,255,255,.16); color:#fff; border:1px solid rgba(255,255,255,.35);
           border-radius:8px; padding:9px 14px; font-size:13px; font-weight:600; -webkit-tap-highlight-color:transparent; }
  header .hdr-btn:active { background:rgba(255,255,255,.28); }
  header #vhint { margin-top:6px; }
  main { padding:10px 12px 48px; max-width:680px; margin:0 auto; }
  details.unit { margin:0 0 8px; }
  details.unit > summary { list-style:none; cursor:pointer; padding:12px 14px; background:#e7edf5;
           border:1px solid var(--line); border-radius:10px; font-weight:700; font-size:15px; display:flex; align-items:center; gap:8px; }
  details.unit > summary::-webkit-details-marker { display:none; }
  details.unit > summary .caret { margin-left:auto; opacity:.55; transition:transform .15s; }
  details.unit[open] > summary .caret { transform:rotate(90deg); }
  .lesson { background:var(--card); border:1px solid var(--line); border-top:none; padding:10px 12px; }
  .lesson:first-of-type { border-top:1px solid var(--line); margin-top:6px; border-radius:10px 10px 0 0; }
  .lesson:last-of-type { border-radius:0 0 10px 10px; }
  .lesson .title { font-weight:600; font-size:14px; margin-bottom:8px; }
  .btns { display:flex; gap:8px; flex-wrap:wrap; }
  .btn { flex:1 1 auto; min-width:84px; text-align:center; padding:12px 8px; border-radius:9px;
         border:1px solid var(--line); background:#f7f9fb; font-size:13px; font-weight:600; color:var(--ink);
         text-decoration:none; cursor:pointer; }
  .btn:active { background:#e9eef4; }
  .btn.video { background:#fff3e0; border-color:#ffd9a3; }
  .btn.ws { background:#e8f1ff; border-color:#bcd6ff; }
  .btn.quiz { background:#e9f9ec; border-color:#b6e6c0; }
  .btn.bloo { background:#f3e8ff; border-color:#d9bcff; }
  .btn.fc { background:#fff0f5; border-color:#ffc4dd; }
  .btn[disabled] { opacity:.4; pointer-events:none; }
  header #gradepill { display:inline-block; margin-top:8px; background:rgba(255,255,255,.16);
           border:1px solid rgba(255,255,255,.35); border-radius:999px; padding:5px 12px; font-size:13px; font-weight:700; }
  .lesson .title { display:flex; align-items:center; gap:8px; }
  .lesson .done-badge { margin-left:auto; font-size:11px; font-weight:700; color:#1a7f37;
           background:#e9f9ec; border:1px solid #b6e6c0; border-radius:999px; padding:1px 8px; white-space:nowrap; }
  #vo { position:fixed; inset:0; background:#000; display:none; z-index:50; flex-direction:column; }
  #vo.show { display:flex; }
  #vo video { flex:1; width:100%; background:#000; min-height:0; }
  #vo .bar { display:flex; gap:10px; align-items:center; background:#111; color:#fff;
             padding:10px 14px calc(10px + env(safe-area-inset-bottom,0)); }
  #vo .bar button { background:#333; color:#fff; border:0; padding:10px 16px; border-radius:8px; font-size:14px; }
  #vo .bar .vtitle { font-size:13px; opacity:.85; margin-left:auto; }
  .empty { text-align:center; color:#778; padding:40px 20px; }

  /* Native flashcards overlay — same fixed-sheet pattern as #vo, mobile palette. */
  #fco { position:fixed; inset:0; background:var(--bg); display:none; z-index:60; flex-direction:column; }
  #fco.show { display:flex; }
  #fco .fc-bar { display:flex; gap:10px; align-items:center; background:var(--blue); color:#fff;
             padding:calc(12px + env(safe-area-inset-top,0)) 16px 12px; }
  #fco .fc-bar .fc-title { font-size:14px; font-weight:700; }
  #fco .fc-bar .fc-prog { font-size:12px; opacity:.9; margin-left:auto; }
  #fco .fc-bar button { background:rgba(255,255,255,.16); color:#fff; border:1px solid rgba(255,255,255,.35);
             border-radius:8px; padding:8px 12px; font-size:13px; font-weight:600; }
  #fco .fc-body { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:16px; max-width:680px;
             width:100%; margin:0 auto; display:flex; flex-direction:column; }
  #fco .fc-timer { height:5px; background:#dfe3e8; border-radius:3px; overflow:hidden; margin-bottom:14px; display:none; }
  #fco.timed .fc-timer { display:block; }
  #fco .fc-timer > i { display:block; height:100%; width:100%; background:var(--blue); transition:width .95s linear; }
  #fco .fc-q { font-size:17px; font-weight:600; line-height:1.4; margin-bottom:16px; }
  #fco .fc-choice { display:block; width:100%; text-align:left; padding:14px 16px; margin-bottom:10px; border-radius:10px;
             border:1px solid var(--line); background:var(--card); font-size:15px; color:var(--ink); font-weight:500; }
  #fco .fc-choice:active { background:#e9eef4; }
  #fco .fc-choice.right { background:#e9f9ec; border-color:#57b26b; color:#0f7a2e; font-weight:700; }
  #fco .fc-choice.wrong { background:#fdecec; border-color:#e39a9a; color:#b00020; }
  #fco .fc-choice[disabled] { pointer-events:none; }
  #fco .fc-feedback { min-height:22px; margin-top:6px; font-size:14px; font-weight:600; }
  #fco .fc-next { margin-top:auto; padding:14px; border-radius:10px; border:0; background:var(--blue); color:#fff;
             font-size:15px; font-weight:700; display:none; }
  #fco .fc-next.show { display:block; }
  /* Mode picker + result panels reuse .fc-body; big beveled choices. */
  #fco .fc-pick, #fco .fc-result { text-align:center; margin:auto 0; }
  #fco .fc-pick h2, #fco .fc-result h2 { font-size:20px; margin:0 0 6px; }
  #fco .fc-pick p, #fco .fc-result p { color:#556; font-size:14px; margin:0 0 20px; line-height:1.4; }
  #fco .fc-mode { display:block; width:100%; padding:18px; margin-bottom:12px; border-radius:12px; border:1px solid var(--line);
             background:var(--card); font-size:16px; font-weight:700; color:var(--ink); }
  #fco .fc-mode small { display:block; font-weight:500; font-size:12px; color:#667; margin-top:4px; }
  #fco .fc-mode:active { background:#e9eef4; }
  #fco .fc-mode.quick { background:#fff0f5; border-color:#ffc4dd; }
  #fco .fc-mode.full { background:#e8f1ff; border-color:#bcd6ff; }
  #fco .fc-score { font-size:44px; font-weight:800; margin:8px 0; }
  #fco .fc-score.pass { color:#1a7f37; } #fco .fc-score.fail { color:#b00020; }
</style>
</head>
<body>
<header>
  <h1>📊 AP Statistics <a href="teacher-app.html" style="float:right;color:#fff;opacity:.85;font-size:12px;font-weight:400;text-decoration:none;margin-top:3px">🔑 Teacher</a></h1>
  <div class="who" id="who">Not signed in.</div>
  <div class="hdr-row">
    <button id="signin-btn" class="hdr-btn" onclick="openNameFinder()">👤 Sign in</button>
    <button id="sync-nearby" class="hdr-btn" onclick="syncNearby()">📡 Sync Nearby</button>
  </div>
  <div id="gradepill" style="display:none"></div>
  <div class="who" id="vhint"></div>
</header>
<main id="main"><div class="empty">Loading lessons…</div></main>

<div id="vo" role="dialog" aria-label="Video player">
  <video id="vplayer" controls playsinline></video>
  <div class="bar"><button onclick="closeVideo()">✕ Close</button><span class="vtitle" id="vtitle"></span></div>
</div>

<div id="fco" role="dialog" aria-label="Flashcards">
  <div class="fc-bar">
    <span class="fc-title" id="fc-title">🃏 Flashcards</span>
    <span class="fc-prog" id="fc-prog"></span>
    <button type="button" onclick="closeFlashcards()">✕ Close</button>
  </div>
  <div class="fc-body" id="fc-body"><!-- mode picker / cards / result injected here --></div>
</div>

<!-- offline-config.js is GENERATED into the pack; it sets window.OFFLINE_MODE and,
     in a --play build, window.PLAY_BUILD + window.MEDIA_BASE_URL. mobile-home isn't in
     ROOT_FILES (build-android copies it in separately), so it must load this itself.
     Must be FIRST. On the web it 404s harmlessly (mobile-home is the APK home). -->
<script src="offline-config.js" onerror=""></script>
<script src="roster_config.js" onerror=""></script>
<script src="roster-client.js" onerror=""></script>
<!-- ANDROID Phase 5 — Google Play on-demand video (inert unless window.PLAY_BUILD,
     which offline-config.js sets for a --play build). -->
<script src="video-ondemand.js" onerror=""></script>
<script src="video-store.js" onerror=""></script>
<!-- ANDROID Phase 3 — P2P gossip ("Sync Nearby" on the phone home). Inert on the web
     (nearby-transport.js only registers window.GossipTransport inside the APK). -->
<script src="receipt-verify.js" onerror=""></script>
<script src="ledger-store.js" onerror=""></script>
<script src="ledger-gossip.js" onerror=""></script>
<script src="nearby-transport.js" onerror=""></script>
<!-- OFFLINE GRADING MESH Phase 1-2 — the student's device signing key + the
     submissions lane (self-sign raw work, gossip it beside grades). Inert on the
     web: SecureKeyStore only exists inside the APK. -->
<script src="receipt-sign.js" onerror=""></script>
<script src="secure-key.js" onerror=""></script>
<script src="student-key.js" onerror=""></script>
<script src="submission-store.js" onerror=""></script>
<script src="submission-capture.js" onerror=""></script>
<!-- FLASHCARDS (native) — the shared pure Blooket-flashcard engine + the gradebook
     ledger feeder, so the launcher runs flashcards IN-APP instead of deep-linking to
     the Desk. flashcards.js is byte-pinned to the Desk's inline engine by
     tests/flashcards-engine.test.js. offline-queue.js lets a finished deck queue its
     grade row when offline; gradebook-client.js is the same feeder the Desk uses. -->
<script src="flashcards.js" onerror=""></script>
<script src="offline-queue.js" onerror=""></script>
<script src="gradebook-client.js" onerror=""></script>
<script>
(function () {
  var main = document.getElementById('main');
  var UNIT_NAMES = {
    1:'Unit 1 · Exploring One-Variable Data', 2:'Unit 2 · Exploring Two-Variable Data',
    3:'Unit 3 · Collecting Data', 4:'Unit 4 · Probability, Random Variables & Distributions',
    5:'Unit 5 · Sampling Distributions', 6:'Unit 6 · Inference for Proportions',
    7:'Unit 7 · Inference for Means', 8:'Unit 8 · Inference for Categorical Data (Chi-Square)',
    9:'Unit 9 · Inference for Quantitative Data (Slopes)'
  };
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  // Identity line + Sign-in button reflect the shared roster session (the same
  // localStorage session every bundled page uses). refreshIdentity() is re-run after
  // a sign-in so the student's name appears without a reload.
  function refreshIdentity() {
    var who = (window.rosterClient && rosterClient.current && rosterClient.current()) || null;
    var w = document.getElementById('who');
    var b = document.getElementById('signin-btn');
    if (who) {
      if (w) w.textContent = '👤 Signed in as ' + (who.realName || who.username || 'student');
      if (b) b.textContent = '⇄ Switch student';
    } else {
      if (w) w.textContent = 'Not signed in — sign in so your work counts toward your grade.';
      if (b) b.textContent = '👤 Sign in';
    }
  }
  window.refreshIdentity = refreshIdentity;
  try { refreshIdentity(); } catch (e) {}

  function openVideo(file, title) {
    var v = document.getElementById('vplayer');
    v.src = file; document.getElementById('vtitle').textContent = title || '';
    document.getElementById('vo').classList.add('show');
    try { v.play(); } catch (e) {}
  }
  window.closeVideo = function () {
    var v = document.getElementById('vplayer'); try { v.pause(); } catch (e) {}
    v.removeAttribute('src'); v.load();
    document.getElementById('vo').classList.remove('show');
  };
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeVideo(); });

  // ANDROID Phase 5 — Play build: video isn't bundled; resolve via VideoOnDemand and
  // download-on-demand the first time. Sideload build (no PLAY_BUILD) plays the bundled
  // file directly, unchanged.
  var _dlbar = null;
  function dlMsg(msg) {
    if (!_dlbar) {
      _dlbar = document.createElement('div');
      _dlbar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;background:#0b5cad;color:#fff;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0));font-size:13px;text-align:center;z-index:55';
      document.body.appendChild(_dlbar);
    }
    _dlbar.textContent = msg; _dlbar.style.display = 'block';
  }
  function dlHide() { if (_dlbar) _dlbar.style.display = 'none'; }

  function playVideo(ref, label) {
    if (!window.PLAY_BUILD || !window.VideoOnDemand) { openVideo(ref, label); return; }
    window.VideoOnDemand.resolve(ref).then(function (r) {
      if (r && r.playUri) { openVideo(r.playUri, label); return; }
      if (r && r.state === 'remote') {
        if (!r.downloadUrl) { dlMsg('Video host not set yet — worksheets + quiz still work.'); setTimeout(dlHide, 2500); return; }
        var mb = r.bytes ? ' (' + Math.round(r.bytes / 1e6) + ' MB)' : '';
        dlMsg('⬇ Downloading ' + (label || 'video') + mb + '…');
        window.VideoOnDemand.download(ref, function (loaded, total) {
          if (total) dlMsg('⬇ ' + (label || 'video') + ' — ' + Math.round(100 * loaded / total) + '%');
        }).then(function (uri) { dlHide(); openVideo(uri, label); })
          .catch(function (e) { dlMsg('Download failed: ' + (e && e.message || e)); setTimeout(dlHide, 3000); });
        return;
      }
      dlMsg('Video not available.'); setTimeout(dlHide, 2000);
    }).catch(function () { openVideo(ref, label); });
  }

  // Load the on-demand catalog (Play build only; inert otherwise).
  if (window.PLAY_BUILD && window.VideoOnDemand) {
    try { window.VideoOnDemand.loadCatalog('video-catalog.json'); } catch (e) {}
    // Its own line — must NOT clobber #who (the identity line), which was the bug that
    // hid the signed-in student's name on the launcher.
    try { var vh = document.getElementById('vhint'); if (vh) vh.textContent = 'Videos download on first tap. Worksheets + quiz work offline.'; } catch (e) {}
  }

  // ── ANDROID Phase 3 — Sync Nearby (P2P ledger gossip) ─────────────────────────
  function svcUrl() {
    var u = (typeof window.ROSTER_SERVICE_URL === 'string' && window.ROSTER_SERVICE_URL)
      || (typeof window.RAILWAY_ROSTER_URL === 'string' && window.RAILWAY_ROSTER_URL)
      || (typeof window.ROSTER_SERVER_URL === 'string' && window.ROSTER_SERVER_URL) || '';
    return String(u).replace(/\/$/, '');
  }
  function verifyRow(row) {
    // Verify-on-ingest for gossiped/QR'd rows: the shared BINDING verifier
    // (receipt-verify.js) — the signature must cover THIS row's grade fields, not just
    // "some bytes", or a harvested signature could be re-stapled to a forged score.
    try {
      if (!window.ReceiptVerify || typeof ReceiptVerify.verifyLedgerRow !== 'function') return Promise.resolve(false);
      return Promise.resolve(ReceiptVerify.verifyLedgerRow(row)).catch(function () { return false; });
    } catch (_) { return Promise.resolve(false); }
  }
  var _issuerReg = false;
  function registerIssuer(base) {
    if (_issuerReg || !window.ReceiptVerify || !Array.isArray(ReceiptVerify.ISSUERS) || !base || typeof fetch !== 'function') return Promise.resolve();
    return fetch(base + '/receipts/issuer').then(function (r) { return r && r.ok ? r.json() : null; }).then(function (j) {
      if (!j || !j.enabled) return;
      var keys = (j.pubkeys && j.pubkeys.length) ? j.pubkeys : (j.pubkey ? [j.pubkey] : []);
      // registerIssuerKeys refuses any pubkey already bound to a student (§0.1c
      // disjointness) — falls back to a raw push if the guarded API isn't present.
      if (typeof ReceiptVerify.registerIssuerKeys === 'function') {
        ReceiptVerify.registerIssuerKeys(keys, { name: 'Roster', kind: 'roster' });
      } else {
        keys.forEach(function (pk) { if (pk && !ReceiptVerify.ISSUERS.some(function (i) { return i.pubkey === pk; })) ReceiptVerify.ISSUERS.push({ name: 'Roster', pubkey: pk, kind: 'roster' }); });
      }
      _issuerReg = true;
    }).catch(function () {});
  }

  // OFFLINE GRADING MESH Phase 1 — get-or-generate this student's device key,
  // register it (authenticated), and sync the class student trust set so gossiped
  // submissions can be verified. Inert on the web (StudentKey.available()===false).
  // Fire-and-forget; never blocks navigation or sign-in.
  function meshKeyBoot() {
    if (!window.StudentKey || !window.rosterClient) return Promise.resolve();
    var base = svcUrl();
    var token = null;
    try { token = rosterClient.token && rosterClient.token(); } catch (_) {}
    var p = StudentKey.available() ? StudentKey.ensure(window.rosterClient, base) : Promise.resolve();
    return p.then(function () { return token ? StudentKey.syncTrustSet(base, token) : null; }).catch(function () {});
  }
  window.meshKeyBoot = meshKeyBoot;

  // The submissions-lane verifier (student trust set). Fail-closed like verifyRow.
  function verifySubRow(row) {
    try {
      if (!window.ReceiptVerify || typeof ReceiptVerify.verifySubmissionRow !== 'function') return Promise.resolve(false);
      return Promise.resolve(ReceiptVerify.verifySubmissionRow(row)).catch(function () { return false; });
    } catch (_) { return Promise.resolve(false); }
  }
  // The submissions lane is live only when the whole mesh-P2 stack is present
  // (APK: SubmissionStore + verifySubmissionRow + at least one student key synced).
  function subsLaneReady() {
    return !!(window.SubmissionStore && window.ReceiptVerify
      && typeof ReceiptVerify.verifySubmissionRow === 'function'
      && typeof LedgerGossip.runLanes === 'function');
  }

  window.syncNearby = function () {
    if (!window.GossipTransport || !window.LedgerGossip || !window.LedgerStore) {
      dlMsg('📡 Nearby sync needs the app + Bluetooth on.'); setTimeout(dlHide, 3000); return;
    }
    dlMsg('📡 Looking for nearby devices…');
    var base = svcUrl();
    registerIssuer(base)
      .then(function () { return meshKeyBoot(); })
      .then(function () { return (window.rosterClient && LedgerStore.pull) ? LedgerStore.pull(window.rosterClient, { serverUrl: base }).catch(function () {}) : null; })
      // Snapshot the grades G-Set ONCE for §0.7 suppression (monotone → a snapshot
      // is safe). Used for BOTH the offer side (exclude covered) and the ingest
      // side (reject covered) so the two never disagree within a round.
      .then(function () { return subsLaneReady() ? LedgerStore.all().catch(function () { return []; }) : Promise.resolve(null); })
      .then(function (gradesSnapshot) {
        var gradesLane = {
          lane: 'grades',
          getRows: function () { return LedgerStore.all(); },
          verify: verifyRow,
          store: LedgerStore
        };
        // Two lanes over one Nearby discovery when the submissions stack is live;
        // else the byte-identical grades-only round (unchanged behavior).
        if (gradesSnapshot !== null) {
          var covered = SubmissionStore.coveredKeys(gradesSnapshot);
          return LedgerGossip.runLanes(window.GossipTransport, {
            lanes: [gradesLane, {
              lane: 'subs',
              getRows: function () {
                return SubmissionStore.all().then(function (rows) {
                  return rows.filter(function (r) { return !SubmissionStore.isCovered(r, covered); });
                });
              },
              // §0.7 suppression + §0.4/§5 flood cap, composed per round (one stateful
              // budget instance): reject covered submissions, bound per-student/-item/-total.
              verify: SubmissionStore.floodCapVerify(SubmissionStore.suppressingVerify(verifySubRow, covered)),
              store: SubmissionStore
            }],
            durationMs: 45000,
            onPeer: function () { dlMsg('📡 Connected — syncing…'); }
          });
        }
        return LedgerGossip.runRound(window.GossipTransport, {
          getRows: gradesLane.getRows,
          verify: verifyRow,
          store: LedgerStore,
          durationMs: 45000,
          onPeer: function () { dlMsg('📡 Connected — syncing…'); }
        });
      })
      .then(function (r) {
        if (!r || !r.available) dlMsg('📡 Nearby sync unavailable on this device.');
        else if (!r.peers) dlMsg('No nearby devices found. Tap Sync on both phones + allow Bluetooth/Nearby.');
        else dlMsg('✅ Synced with ' + r.peers + ' device' + (r.peers === 1 ? '' : 's') + ' · +' + r.received + ' record' + (r.received === 1 ? '' : 's'));
        setTimeout(dlHide, 6000);
      })
      .catch(function (e) { dlMsg('Sync failed: ' + (e && e.message || e)); setTimeout(dlHide, 4000); });
  };

  // ── Sign-in: diamond-dial name finder (ported from the Desk) ──────────────────
  // Same 4-way narrowing pick as ap_stats_roadmap_square_mode.html's _nf* wall: fetch
  // the class roster (section PeriodX), sort by name, and let the student "turn the
  // dial" (↑ ← → ↓) down to their own name — never typing a username — then just their
  // password. Success flows into rosterClient, so every signed grade receipt they earn
  // carries their `sid`. First sign-in needs the network; the session then persists.
  var ROSTER_CACHE_TTL_MS = 60 * 60 * 1000;

  function _periodToSection(period) {
    if (typeof period !== 'string' || !period) return 'PeriodX';
    if (/^Period/.test(period)) return period;
    if (/^[A-Za-z]$/.test(period)) return 'Period' + period.toUpperCase();
    return 'PeriodX';
  }
  function _fetchSectionRoster(section, opts) {
    if (!section) return Promise.resolve([]);
    var fresh = !!(opts && opts.fresh);
    var cacheKey = 'apstats_desk_roster_cache_' + section;
    if (!fresh) { try {
      var raw = localStorage.getItem(cacheKey);
      if (raw) {
        var cached = JSON.parse(raw);
        if (cached && cached.ts && (Date.now() - cached.ts < ROSTER_CACHE_TTL_MS)) return Promise.resolve(cached.roster || []);
      }
    } catch (_) {} }
    var base = svcUrl();
    if (!base) return Promise.resolve([]);
    return fetch(base + '/roster/section/' + encodeURIComponent(section), fresh ? { cache: 'no-store' } : undefined)
      .then(function (res) { return res && res.ok ? res.json() : null; })
      .then(function (data) {
        var students = (data && data.ok && Array.isArray(data.students)) ? data.students : [];
        students.sort(function (a, b) { return (a.realName || '').localeCompare(b.realName || ''); });

  function _fetchPeriodRoster(period, opts) {
    var primary = _periodToSection(period);

  function _nfEsc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
  function _nfFriendly(r) {
    var nm = (r && r.realName || '').trim();

    var p = nm.split(/\s+/);

  function _nfRangeKey(r) {
    var nm = ((r && (r.realName || r.username)) || '').trim();

  // Split [lo,hi] into up to 4 contiguous buckets. <=4 names -> one leaf per name.
  function _nfBuckets(lo, hi) {
    var n = hi - lo + 1, out = [];
    if (n <= 0) return out;
    if (n <= 4) { for (var i = lo; i <= hi; i++) out.push({ lo: i, hi: i, leaf: true }); return out; }
    var bs = Math.ceil(n / 4), start = lo;
    for (var b = 0; b < 4 && start <= hi; b++) {
      var end = (b === 3) ? hi : Math.min(start + bs - 1, hi);
      out.push({ lo: start, hi: end, leaf: false });
      start = end + 1;
    }
    return out;
  }

  function _nfRenderDial() {
    _nfState = 'dial';

    if (n <= 1) { _nfSelectName(_nfRoster[_nfLo]); return; }   // singleton: auto-pick
    var buckets = _nfBuckets(_nfLo, _nfHi);
    var arrows = ['↑', '←', '→', '↓'];
    var arrowName = ['up', 'left', 'right', 'down'];
    function tile(b, i) {
      if (!b) return '<div class="nf-tile" style="visibility:hidden"></div>';
      var label, sub, aria;
      if (b.leaf) {
        var r = _nfRoster[b.lo];
        label = _nfEsc(_nfFriendly(r)); sub = '';
        aria = 'Press ' + arrowName[i] + ': select ' + _nfFriendly(r);
      } else {
        var first = _nfRoster[b.lo], last = _nfRoster[b.hi], c = b.hi - b.lo + 1;
        label = _nfEsc(_nfRangeKey(first)) + '–' + _nfEsc(_nfRangeKey(last));
        sub = _nfEsc(_nfFriendly(first)) + ' … ' + _nfEsc(_nfFriendly(last)) + ' (' + c + ')';
        aria = 'Press ' + arrowName[i] + ': ' + _nfFriendly(first) + ' to ' + _nfFriendly(last) + ', ' + c + ' names';
      }
      return '<button class="nf-tile" aria-label="' + _nfEsc(aria) + '" onclick="_nfPick(' + i + ')">'
        + '<div class="nf-arrow">' + arrows[i] + '</div>'
        + '<div class="nf-label">' + label + '</div>'
        + (sub ? '<div class="nf-sub">' + sub + '</div>' : '')
        + '</button>';

    host.innerHTML =
      '<div class="nf-title">🔒 Find your name</div>'
      + '<div class="nf-count" aria-live="polite">' + n + ' classmates left · turn the dial to you</div>'
      + '<div class="nf-diamond">'
      + '<div class="nf-row">' + tile(buckets[0], 0) + '</div>'
      + '<div class="nf-row">' + tile(buckets[1], 1) + tile(buckets[2], 2) + '</div>'
      + '<div class="nf-row">' + tile(buckets[3], 3) + '</div>'

  function _nfSubmitSignup() {
    if (_nfSubmitSignup._pending) return;
    var name = document.getElementById('nf-su-name');
    var pinEl = document.getElementById('nf-su-pin');
    var err = document.getElementById('nf-su-error');
    var okBtn = document.getElementById('nf-su-ok');
    var realName = (name && name.value || '').trim();
    var pin = (pinEl && pinEl.value || '').trim();
    if (err) err.textContent = '';
    if (!realName) { if (err) err.textContent = 'Enter your real name.'; return; }
    if (!/^\d{4}$/.test(pin)) { if (err) err.textContent = 'Your PIN must be exactly 4 digits.'; return; }
    if (!window.rosterClient || !window.rosterClient.claim) { if (err) err.textContent = 'Signup unavailable — connect to Wi-Fi and try again.'; return; }
    _nfSubmitSignup._pending = true;
    if (okBtn) okBtn.disabled = true;
    if (err) err.textContent = 'Creating your account…';

    // Retry a taken username by re-rolling (bounded), mirroring the Desk.
    function attempt(triesLeft) {
      return window.rosterClient.claim({ realName: realName, section: _suSection, username: _suUsername, pin: pin })
        .catch(function (e) { return { ok: false, error: (e && e.message) || 'Network error' }; })
        .then(function (result) {
          if (result && result.ok) return result;
          if (result && result.code === 'username-taken' && triesLeft > 0) { _suSpin(); return attempt(triesLeft - 1); }
          return result || { ok: false, error: 'Signup failed' };
        });
    }
    attempt(5)
      .then(function (result) {
        if (!result || !result.ok) { if (err) err.textContent = (result && result.error) || 'Signup failed.'; return; }
        var who = (window.rosterClient.current && window.rosterClient.current()) || {};

        try { if (window.meshKeyBoot) meshKeyBoot(); } catch (_) {}

      .catch(function () { _nfSubmitSignup._pending = false; if (okBtn) okBtn.disabled = false; });

  function _nfKeydown(e) {

  function render(lessons) {
    if (!lessons || !lessons.length) { main.innerHTML = '<div class="empty">No lessons found.</div>'; return; }
    var byUnit = {};
    lessons.forEach(function (l) { (byUnit[l.unit] = byUnit[l.unit] || []).push(l); });
    var units = Object.keys(byUnit).map(Number).sort(function (a, b) { return a - b; });
    main.innerHTML = '';
    units.forEach(function (u, ui) {
      var det = document.createElement('details'); det.className = 'unit'; if (ui === 0) det.open = true;
      var sum = document.createElement('summary');
      sum.innerHTML = esc(UNIT_NAMES[u] || ('Unit ' + u)) + '<span class="caret">▶</span>';
      det.appendChild(sum);
      byUnit[u].forEach(function (l) {
        var card = document.createElement('div'); card.className = 'lesson';
        var t = document.createElement('div'); t.className = 'title';
        var tlabel = document.createElement('span'); tlabel.textContent = l.label || ('Topic ' + l.id);
        t.appendChild(tlabel);
        // Done badge from the offline-cached grade (best-effort; hidden if no grade for this topic).
        var g = _gradeByTopic[_normTopic(l.id)];
        if (g && g.lessonGrade != null && isFinite(g.lessonGrade)) {
          var badge = document.createElement('span'); badge.className = 'done-badge';
          badge.textContent = '✓ ' + Math.round(g.lessonGrade) + '%';
          t.appendChild(badge);
        }
        card.appendChild(t);
        var btns = document.createElement('div'); btns.className = 'btns';
        (l.videos || []).forEach(function (file, i) {
          var b = document.createElement('button'); b.className = 'btn video';
          b.textContent = (l.videos.length > 1 ? '▶ Video ' + (i + 1) : '▶ Video');
          b.onclick = function () { playVideo(file, l.label); };
          btns.appendChild(b);
        });
        var w = document.createElement('a'); w.className = 'btn ws'; w.textContent = '✍ Worksheet';
        if (l.worksheet) w.href = l.worksheet; else w.setAttribute('disabled', '');
        btns.appendChild(w);
        var q = document.createElement('a'); q.className = 'btn quiz'; q.textContent = '❓ Quiz';
        if (l.quiz) q.href = l.quiz; else q.setAttribute('disabled', '');
        btns.appendChild(q);
        // Blooket (external game) + the in-app Flashcards deck for the same topic.
        if (l.blooket) {
          var bl = document.createElement('a'); bl.className = 'btn bloo'; bl.textContent = '🎯 Blooket';
          bl.href = l.blooket; bl.target = '_blank'; bl.rel = 'noopener';
          btns.appendChild(bl);
          // Flashcards run NATIVELY here (shared flashcards.js engine + the gradebook
          // feeder) — no longer a deep-link into the Desk. Same deck, same scoring, same
          // BL-…-DESK_DONE grade row.
          var fc = document.createElement('button'); fc.className = 'btn fc'; fc.textContent = '🃏 Flashcards';
          fc.onclick = function () { openFlashcards(l); };
          btns.appendChild(fc);
        }
        card.appendChild(btns);
        det.appendChild(card);
      });
      main.appendChild(det);
    });
  }

  // ── Grade + per-lesson completion ────────────────────────────────────────────
  // Offline-cached: show the last-fetched grade immediately (so it works with no
  // network), then refresh from GET /grade when signed in + online. The grade is
  // computed server-side (authoritative) from the same ledger the app already pulls.
  var GRADE_KEY = 'apstats_mobile_grade_v1';
  var _gradeByTopic = {}, _lastLessons = [];
  function _normTopic(s) { s = String(s == null ? '' : s); var m = s.match(/U?(\d+)[.\-_ ]?L?(\d+)/i); return m ? (m[1] + '.' + m[2]) : s; }

  // Populate the per-topic lesson-grade map + the header pill from a /grade payload.
  // repaint=true re-renders the tiles so their ✓ badges appear.
  function _applyGradeData(g, repaint) {
    if (!g) return;
    _gradeByTopic = {};
    var ls = Array.isArray(g.lessons) ? g.lessons
      : (g.lessons && typeof g.lessons === 'object') ? Object.keys(g.lessons).map(function (k) { var e = g.lessons[k] || {}; if (e.topic == null && e.topicKey == null) e.topic = k; return e; })
      : [];
    ls.forEach(function (e) { if (!e) return; var key = _normTopic(e.lessonKey || e.topic || e.topicKey || e.id || e.lesson || ''); if (key) _gradeByTopic[key] = e; });
    // Current grade = the last quarter carrying a numeric quarterGrade.
    var qs = Array.isArray(g.quarters) ? g.quarters
      : (g.quarters && typeof g.quarters === 'object') ? Object.keys(g.quarters).map(function (k) { var e = g.quarters[k] || {}; if (e.quarter == null && e.label == null && e.key == null) e.key = k; return e; })
      : [];
    var best = null;
    qs.forEach(function (q) { if (q && typeof q.quarterGrade === 'number' && isFinite(q.quarterGrade)) best = q; });
    var pill = document.getElementById('gradepill');
    if (pill) {
      if (best) { var ql = best.quarter || best.label || best.key || ''; pill.textContent = '📊 Current grade: ' + Math.round(best.quarterGrade) + '%' + (ql ? (' · ' + ql) : ''); pill.style.display = ''; }
      else { pill.style.display = 'none'; }
    }
    if (repaint && _lastLessons.length) render(_lastLessons);
  }

  // Returns a promise so callers can await a fresh floor before recording (see the
  // flashcards commit). Resolves (never rejects) even when offline / not signed in.
  function loadGrade() {
    if (!window.rosterClient || !rosterClient.current || !rosterClient.current()) return Promise.resolve(false);
    var base = svcUrl(); if (!base) return Promise.resolve(false);
    var token = (rosterClient.token && rosterClient.token()) || null; if (!token) return Promise.resolve(false);
    return fetch(base + '/grade?token=' + encodeURIComponent(token))
      .then(function (r) { return r && r.ok ? r.json() : null; })
      .then(function (g) {
        if (!g || !g.ok) return false;
        try { localStorage.setItem(GRADE_KEY, JSON.stringify({ lessons: g.lessons, quarters: g.quarters })); } catch (_) {}
        _applyGradeData(g, true);
        return true;
      })
      .catch(function () { return false; });
  }
  window.loadGrade = loadGrade;

  // ── Native flashcards (shared flashcards.js engine + the gradebook feeder) ────
  // Runs the Blooket deck IN-APP: mode picker → cards → the BL-…-DESK_DONE grade
  // row. Scoring + item-id come from window.Flashcards, byte-pinned to the Desk's
  // inline engine by tests/flashcards-engine.test.js so they can't drift. The grade
  // write is the same fire-and-forget gradebookClient.record the Desk uses; the
  // best-wins floor here means a weaker re-run never lowers a recorded score.
  var FC = window.Flashcards || null;
  var _fcTags = null, _fc = null;
  function fcoEl() { return document.getElementById('fco'); }
  function fcBody() { return document.getElementById('fc-body'); }
  function _fcSetProg(t) { var p = document.getElementById('fc-prog'); if (p) p.textContent = t || ''; }
  function _fcTimerStop() { if (_fc && _fc.timer) { clearInterval(_fc.timer); _fc.timer = null; } }

  function closeFlashcards() {
    _fcTimerStop(); _fc = null;
    var el = fcoEl(); if (el) el.classList.remove('show', 'timed');
  }
  window.closeFlashcards = closeFlashcards;

  // Worksheet URL → deck CSV; fall back to the topic id (U.key → u{U}_l{key}_blooket.csv).
  function _fcCsvPath(lesson) {
    if (!FC) return null;
    var p = lesson && lesson.worksheet ? FC.csvPathFromWorksheet(lesson.worksheet) : null;
    if (p) return p;
    var m = /^(\d+)\.([\d-]+)$/.exec(String((lesson && lesson.id) || ''));
    return m ? ('u' + m[1] + '_l' + m[2].replace(/-/g, '_l') + '_blooket.csv') : null;
  }
  function _fcLoadTags() {
    if (_fcTags) return Promise.resolve(_fcTags);
    return fetch('data/blooket-difficulty.json', { cache: 'no-store' })
      .then(function (r) { return r && r.ok ? r.json() : null; })
      .then(function (j) { _fcTags = (j && j.tags) || {}; return _fcTags; })
      .catch(function () { _fcTags = {}; return _fcTags; });
  }
  function _fcLoadDeck(csvPath) {
    return fetch(csvPath, { cache: 'no-store' })
      .then(function (r) { if (!r || !r.ok) throw new Error('deck ' + (r && r.status)); return r.text(); })
      .then(function (txt) { return FC.rowsToDeck(FC.parseCsv(txt)); });
  }
  function _fcBodyHtml(html) { var b = fcBody(); if (b) b.innerHTML = html; }

  function openFlashcards(lesson) {
    if (!FC) { _fcBodyHtml('<div class="fc-result"><h2>Unavailable</h2><p>Flashcards engine not loaded.</p></div>'); fcoEl() && fcoEl().classList.add('show'); return; }
    var el = fcoEl(); if (!el) return;
    _fcTimerStop(); _fc = null; el.classList.remove('timed');
    document.getElementById('fc-title').textContent = '🃏 ' + esc((lesson && lesson.label) || ('Topic ' + (lesson && lesson.id)));
    _fcSetProg(''); el.classList.add('show');
    _fcBodyHtml(
      '<div class="fc-pick">' +
        '<h2>Choose a mode</h2>' +
        '<p>Quick check tops out at 80% — enough to unlock. Full deck goes to 100%.</p>' +
        '<button class="fc-mode quick" id="fc-mode-quick">⚡ Quick check<small>Top 10 cards · pass at 80%</small></button>' +
        '<button class="fc-mode full" id="fc-mode-full">🎯 Full deck<small>Every card · 40s each · up to 100%</small></button>' +
      '</div>');
    document.getElementById('fc-mode-quick').onclick = function () { _fcStart(lesson, 'quick'); };
    document.getElementById('fc-mode-full').onclick = function () { _fcStart(lesson, 'full'); };
  }
  window.openFlashcards = openFlashcards;

  function _fcStart(lesson, mode) {
    var csv = _fcCsvPath(lesson);
    if (!csv) { _fcBodyHtml('<div class="fc-result"><h2>No deck</h2><p>This lesson has no flashcard deck.</p></div>'); return; }
    _fcBodyHtml('<div class="fc-result"><h2>Loading deck…</h2></div>');
    var tagsP = (mode === 'quick') ? _fcLoadTags() : Promise.resolve({});
    Promise.all([_fcLoadDeck(csv), tagsP]).then(function (res) {
      var deck = res[0], tags = res[1] || {};
      if (!deck || !deck.length) { _fcBodyHtml('<div class="fc-result"><h2>Empty deck</h2><p>Could not read cards for this lesson.</p></div>'); return; }
      if (mode === 'quick') {
        var top = FC.selectTop10(deck, tags[csv] || {});
        _fc = { mode: 'quick', lesson: lesson, deck: FC.shuffle(top), idx: 0, correct: 0, need: FC.quickPassCount(top.length), answered: false, timer: null };
        fcoEl().classList.remove('timed');
      } else {
        _fc = { mode: 'full', lesson: lesson, round: FC.createRound(FC.shuffle(deck)), answered: false, timer: null };
        fcoEl().classList.add('timed');
      }
      _fcRender();
    }).catch(function (e) {
      _fcBodyHtml('<div class="fc-result"><h2>Couldn’t load deck</h2><p>' + esc(String(e && e.message || e)) + '</p></div>');
    });
  }

  function _fcCurrentCard() {
    if (!_fc) return null;
    if (_fc.mode === 'quick') return _fc.deck[_fc.idx] || null;
    var i = FC.currentIdx(_fc.round);
    return i >= 0 ? _fc.round.deck[i] : null;
  }

  function _fcRender() {
    _fcTimerStop();
    var card = _fcCurrentCard();
    if (!card) { _fcFinish(); return; }
    _fc.answered = false;
    if (_fc.mode === 'quick') _fcSetProg((_fc.idx + 1) + ' / ' + _fc.deck.length + ' · ' + _fc.correct + '✓');
    else _fcSetProg(_fc.round.order.length + ' left · ' + _fc.round.total + ' cards');
    var html = '<div class="fc-timer"><i id="fc-timer-bar"></i></div>' +
      '<div class="fc-q">' + esc(card.q) + '</div><div id="fc-choices">';
    card.choices.forEach(function (ch, i) { html += '<button class="fc-choice" data-i="' + i + '">' + esc(ch) + '</button>'; });
    html += '</div><div class="fc-feedback" id="fc-feedback"></div><button class="fc-next" id="fc-next">Next →</button>';
    var b = fcBody(); b.innerHTML = html; b.scrollTop = 0;
    Array.prototype.forEach.call(b.querySelectorAll('.fc-choice'), function (btn) {
      btn.onclick = function () { _fcAnswer(parseInt(btn.getAttribute('data-i'), 10)); };
    });
    document.getElementById('fc-next').onclick = function () { _fcNext(); };
    _fc.cardStart = Date.now();
    if (_fc.mode === 'full') _fcStartTimer(card);
  }

  function _fcStartTimer(card) {
    var total = FC.FULLDECK_SECONDS, left = total;
    var bar = document.getElementById('fc-timer-bar');
    if (bar) bar.style.width = '100%';
    _fc.timer = setInterval(function () {
      left -= 1;
      if (bar) bar.style.width = Math.max(0, (left / total) * 100) + '%';
      if (left <= 0) { _fcTimerStop(); _fcResolve('timeout', card, -1); }
    }, 1000);
  }

  function _fcAnswer(choiceIdx) {
    if (!_fc || _fc.answered) return;
    var card = _fcCurrentCard(); if (!card) return;
    _fcTimerStop();
    _fcResolve(choiceIdx === card.correctIdx ? 'correct' : 'wrong', card, choiceIdx);
  }

  function _fcResolve(outcome, card, choiceIdx) {
    if (!_fc || _fc.answered) return;
    _fc.answered = true;
    var latency = _fc.cardStart ? (Date.now() - _fc.cardStart) : 0;
    var b = fcBody();
    Array.prototype.forEach.call(b.querySelectorAll('.fc-choice'), function (btn) {
      var i = parseInt(btn.getAttribute('data-i'), 10);
      btn.setAttribute('disabled', '');
      if (i === card.correctIdx) btn.classList.add('right');
      else if (i === choiceIdx) btn.classList.add('wrong');
    });
    var correct = (outcome === 'correct');
    var fb = document.getElementById('fc-feedback');
    if (fb) { fb.textContent = correct ? '✓ Correct' : (outcome === 'timeout' ? '⏱ Time’s up — answer shown' : '✗ Not quite'); fb.style.color = correct ? '#1a7f37' : '#b00020'; }
    if (_fc.mode === 'quick') {
      if (correct) _fc.correct += 1;
      if (_fc.correct >= _fc.need) { setTimeout(function () { _fcFinish(); }, 700); return; }   // early-stop caps at 80%
    } else {
      FC.recordOutcome(_fc.round, outcome, latency);
    }
    var nx = document.getElementById('fc-next'); if (nx) nx.classList.add('show');
  }

  function _fcNext() {
    if (!_fc) return;
    if (_fc.mode === 'quick') _fc.idx += 1;
    _fcRender();
  }

  // The LOCAL-BEST half of the best-wins floor. Lives OUTSIDE _gradeByTopic because
  // _applyGradeData rebuilds that map from every /grade payload — a stale response
  // (the fire-and-forget refresh racing this run's own record POST) would wipe an
  // in-map bump, and a later run whose pre-commit refresh FAILS (offline / server
  // hiccup) could then emit a weaker score that the server's last-write-wins upsert
  // records over the better one. localStorage-backed so it also survives a reload
  // while the higher score is still queued. Scoped PER STUDENT (v2): the synced half
  // of the floor is the signed-in student's /grade, so on a shared classroom device
  // a device-global local best would let student A's 90 suppress student B's
  // legitimate 60. A signed-out run never persists a bump — it can't be keyed and
  // its write is dropped by gradebook-client anyway. Guarded by
  // tests/feeder-bestwins-invariants.property.test.js (prop 12b).
  var FC_BEST_KEY = 'apstats_mobile_fcbest_v2';   // { username: { topicKey: score } }
  function _fcStudent() {
    try {
      var u = window.rosterClient && rosterClient.current && rosterClient.current();
      var name = u && u.username;
      return (typeof name === 'string' && name) ? name : null;
    } catch (_) { return null; }
  }
  function _fcLoadLocalBest() {
    try {
      localStorage.removeItem('apstats_mobile_fcbest_v1');   // v1 was device-global (shared-device leak)
      var s = localStorage.getItem(FC_BEST_KEY);
      var m = s ? JSON.parse(s) : null;
      return (m && typeof m === 'object') ? m : {};
    } catch (_) { return {}; }
  }
  var _fcLocalBest = _fcLoadLocalBest();

  function _fcBlooketFloor(topic) {
    var key = _normTopic(topic);
    var e = _gradeByTopic[key];
    var v = e && (typeof e.blooket === 'number' ? e.blooket : (e.blooket && e.blooket.score));
    var synced = (typeof v === 'number' && isFinite(v)) ? v : -1;
    var who = _fcStudent();
    var mine = who && _fcLocalBest[who];
    var b = mine && mine[key];
    var local = (typeof b === 'number' && isFinite(b)) ? b : -1;
    return synced > local ? synced : local;
  }
  function _fcBumpLocalBlooket(topic, score) {
    var key = _normTopic(topic);
    var who = _fcStudent();
    if (who && typeof score === 'number' && isFinite(score)) {
      var mine = _fcLocalBest[who] || (_fcLocalBest[who] = {});
      var best = (typeof mine[key] === 'number') ? mine[key] : -1;
      if (score > best) {
        mine[key] = score;
        try { localStorage.setItem(FC_BEST_KEY, JSON.stringify(_fcLocalBest)); } catch (_) {}
      }
    }
    var e = _gradeByTopic[key] || (_gradeByTopic[key] = {});
    var cur = (typeof e.blooket === 'number') ? e.blooket : -1;
    if (score > cur) e.blooket = score;
  }

  // best-wins: never downgrade a recorded score; record the same ledger row the Desk
  // does (source 'worksheet' + BL-…-DESK_DONE → the server's Blooket track).
  function _fcCommit(topic, score) {
    var floor = _fcBlooketFloor(topic);
    if (!(score > floor)) return { skipped: true, floor: floor };
    var built = FC.blooketItemId(topic);
    var res = { ok: false, reason: 'no-client' };
    try {
      if (window.gradebookClient && window.gradebookClient.record) {
        res = window.gradebookClient.record({
          source: 'worksheet', itemId: built.itemId, unit: built.unit, topic: topic,
          response: { selfAttest: 'blooket' }, score: score, attempt: 1
        }) || res;
      }
    } catch (e) { res = { ok: false, reason: 'error' }; }
    _fcBumpLocalBlooket(topic, score);
    try { loadGrade(); } catch (_) {}   // refresh the pill/badges with the new record
    return res;
  }

  function _fcFinish() {
    _fcTimerStop();
    if (!_fc) return;
    var lesson = _fc.lesson, topic = String(lesson.id);
    var score, passed;
    if (_fc.mode === 'quick') { score = FC.quickScorePct(_fc.correct, _fc.deck.length); passed = FC.quickPassed(_fc.correct, _fc.deck.length); }
    else { score = FC.fullScorePct(_fc.round); passed = score >= (FC.PASS_THRESHOLD * 100); }
    // Quick records only on pass (Desk behavior); the full deck always records its score.
    var doCommit = (_fc.mode === 'quick') ? passed : true;
    fcoEl().classList.remove('timed');
    _fc = null;

    function finishCommit() {
      var committed = doCommit ? _fcCommit(topic, score) : { skipped: true };
      _fcRenderResult(lesson, score, passed, committed);
    }
    // Desk parity: refresh /grade FIRST so the best-wins floor reflects any higher
    // score recorded on another device, THEN commit (a cold session can't downgrade).
    Promise.resolve(loadGrade()).then(finishCommit, finishCommit);
  }

  function _fcRenderResult(lesson, score, passed, committed) {
    var note;
    if (committed && committed.skipped && !passed && score < 80) note = 'Reach 80% to unlock — your grade wasn’t lowered.';
    else if (committed && committed.skipped) note = 'Kept your best score — a higher one is already recorded.';
    else if (committed && committed.queued) note = 'Saved offline — it’ll sync when you reconnect.';
    else if (committed && committed.ok === false) note = (committed.reason === 'no-identity' || committed.reason === 'no-client') ? 'Sign in to save this to your grade.' : 'Couldn’t save right now — try again when online.';
    else note = passed ? '🎯 Recorded — lesson unlocked.' : 'Score recorded. Reach 80% to unlock this lesson.';
    _fcBodyHtml(
      '<div class="fc-result">' +
        '<h2>' + (passed ? '🎉 Passed!' : 'Keep going') + '</h2>' +
        '<div class="fc-score ' + (passed ? 'pass' : 'fail') + '">' + (Math.round(score * 10) / 10) + '%</div>' +
        '<p>' + esc(note) + '</p>' +
        '<button class="fc-mode quick" id="fc-again">↻ Try again</button>' +
        '<button class="fc-mode full" id="fc-done">✓ Done</button>' +
      '</div>');
    document.getElementById('fc-again').onclick = function () { openFlashcards(lesson); };
    document.getElementById('fc-done').onclick = function () { closeFlashcards(); };
    _fcSetProg('');
  }

  // Keyboard (desktop testers): Esc closes, 1-4 answers, Enter/Space advances.
  document.addEventListener('keydown', function (e) {
    var el = fcoEl(); if (!el || !el.classList.contains('show')) return;
    if (e.key === 'Escape') { closeFlashcards(); return; }
    if (!_fc) return;
    if (!_fc.answered && /^[1-4]$/.test(e.key)) {
      var card = _fcCurrentCard(); var i = parseInt(e.key, 10) - 1;
      if (card && i < card.choices.length) _fcAnswer(i);
    } else if (_fc.answered && (e.key === 'Enter' || e.key === ' ')) {
      var nx = document.getElementById('fc-next');
      if (nx && nx.classList.contains('show')) { e.preventDefault(); _fcNext(); }
    }
  });

  // Cached grade → first paint has the pill + ✓ badges even offline.
  try { var _cg = localStorage.getItem(GRADE_KEY); if (_cg) _applyGradeData(JSON.parse(_cg), false); } catch (_) {}

  // Web / GH-Pages fallback: lessons-index.json is an APK BUILD ARTIFACT (local
  // bundled quiz + media/video paths) and isn't published to Pages, so on a laptop it
  // 404s. roadmap-data.json IS tracked/published and carries the real published URLs,
  // so the web launcher builds its list from that — worksheets, quiz, Blooket, and
  // flashcards all work; videos are APK-only (media isn't hosted on Pages).
  // Strip this repo's GH-Pages base so worksheet links are ORIGIN-RELATIVE — they then
  // resolve against whatever host serves this page (GH Pages OR a Vercel mirror), so the
  // launcher is self-sufficient on either. quiz (separate curriculum_render site) and
  // blooket (external) stay absolute.
  var _WS_BASE = 'https://robjohncolson.github.io/apstats-live-worksheet/';
  function _relWs(u) { return (typeof u === 'string' && u.indexOf(_WS_BASE) === 0) ? u.slice(_WS_BASE.length) : (u || null); }
  function _lessonsFromRoadmap(roadmap) {
    var L = (roadmap && roadmap.lessons) || {};
    var out = Object.keys(L).map(function (id) {
      var u = (L[id] && L[id].urls) || {};
      return {
        id: id, unit: parseInt(id, 10) || 0, label: (L[id] && L[id].topic) || ('Topic ' + id),
        worksheet: _relWs(u.worksheet), quiz: u.quiz || null, blooket: u.blooket || null, videos: []
      };
    });
    out.sort(function (a, b) {
      if (a.unit !== b.unit) return a.unit - b.unit;
      return ((parseInt(String(a.id).split('.')[1], 10) || 0) - (parseInt(String(b.id).split('.')[1], 10) || 0));
    });
    return out;
  }
  function _bootLessons(lessons) { _lastLessons = lessons || []; render(_lastLessons); loadGrade(); }

  // Primary: the bundled lessons-index.json (APK — has local video paths).
  // Fallback: the published roadmap-data.json (the laptop / GH-Pages launcher).
  fetch('lessons-index.json', { cache: 'no-store' })
    .then(function (r) { if (!r || !r.ok) throw new Error('lessons-index ' + (r && r.status)); return r.json(); })
    .then(function (d) { _bootLessons((d && d.lessons) || []); })
    .catch(function () {
      fetch('roadmap-data.json', { cache: 'no-store' })
        .then(function (r) { if (!r || !r.ok) throw new Error('roadmap ' + (r && r.status)); return r.json(); })
        .then(function (rm) { var ls = _lessonsFromRoadmap(rm); if (!ls.length) throw new Error('empty'); _bootLessons(ls); })
        .catch(function () { main.innerHTML = '<div class="empty">Could not load the lesson list.</div>'; });
    });
})();
</script>
</body>
</html>
