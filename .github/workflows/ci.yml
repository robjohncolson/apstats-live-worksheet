name: CI

# TYPECHECK_HARDENING_SPEC.md — run the tests (blocking) + the typecheck (BLOCKING
# as of P4: both allowlists are clean and annotated). Separate from pages.yml so a
# test/type failure never blocks a deploy, and vice-versa — tsc --noEmit is never
# on the Railway/Pages/Vercel path.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Issue #2 (2026-10-22): least-privilege token, one run per ref, npm cache, job timeouts,
# and the apstat-park node tests (package.json test:park) which vitest never includes.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # C4 (FABLE_SPRINT_2026_10_22C): the 10k-test root suite runs as three vitest shards
  # so a push gets its verdict in a few minutes instead of ten; park + roster-server
  # run in their own job so a failure is attributable at a glance.
  root:
    name: root tests (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      # Full history: frq-rubric-transparency reads an older worksheet with `git show <sha>:...`.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The quiz repo (public): misconception-maps reads its data/curriculum.js via CURRICULUM_JS.
      - uses: actions/checkout@v4
        with:
          repository: robjohncolson/curriculum_render
          path: curriculum_render
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            roster-server/package-lock.json
      - name: Install root deps
        run: npm ci
      # Before the root tests: tests/doge-payout-agent imports roster-server/payout.js,
      # which needs roster-server's own @supabase/supabase-js.
      - name: Install roster-server deps
        working-directory: roster-server
        run: npm ci
      # Some root tests read the relay's copies of shared modules from the sibling path.
      - name: Link curriculum_render as a sibling
        run: ln -sfn "$GITHUB_WORKSPACE/curriculum_render" "$GITHUB_WORKSPACE/../curriculum_render"
      # --retry=2 absorbs the known signup-claim brute-force-lockout timeout, which is a
      # parallel-load timing flake (passes in isolation), not a logic failure.
      - name: Root tests
        env:
          CURRICULUM_JS: ${{ github.workspace }}/curriculum_render/data/curriculum.js
        run: npm test -- --shard=${{ matrix.shard }}/3 --retry=2

  park-and-roster:
    name: apstat-park + roster-server tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: robjohncolson/curriculum_render
          path: curriculum_render
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            roster-server/package-lock.json
      - name: Install root deps
        run: npm ci
      - name: Install roster-server deps
        working-directory: roster-server
        run: npm ci
      # The park tests import the relay's copies of the shared modules (and its ws
      # package) from a SIBLING checkout, ../curriculum_render, the way the local
      # tree is laid out. actions/checkout cannot leave the workspace, so link the
      # in-workspace checkout to the sibling path and install the relay's deps
      # (railway-server has no lockfile, hence npm install, not ci).
      - name: Link curriculum_render as a sibling + install relay deps
        run: |
          ln -sfn "$GITHUB_WORKSPACE/curriculum_render" "$GITHUB_WORKSPACE/../curriculum_render"
          cd curriculum_render/railway-server && npm install --no-audit --no-fund
      - name: apstat-park tests
        run: npm run test:park
      - name: roster-server tests
        working-directory: roster-server
        run: npm test -- --retry=2

  typecheck:
    name: typecheck — grade engine + mesh/receipts + feeder (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # BLOCKING as of P4 (was advisory in P1-P3): a type error on the allowlist now
    # fails CI. It still never blocks a deploy — pages.yml is a separate workflow.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            roster-server/package-lock.json
      - name: Install roster-server deps
        working-directory: roster-server
        run: npm ci
      - name: tsc --noEmit (P1 allowlist)
        working-directory: roster-server
        run: npm run typecheck
      - name: Install root deps
        run: npm ci
      - name: tsc --noEmit (P2 mesh/receipts allowlist)
        run: npm run typecheck
