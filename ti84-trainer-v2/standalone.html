<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TI-84 Procedural Trainer V2</title>
  <style>
:root {
  --platinum: #c7c7c7;
  --window: #d8d8d8;
  --paper: #ffffff;
  --ink: #000000;
  --stripe: #8c8c8c;
  --bevel-light: #ffffff;
  --bevel-mid: #dfdfdf;
  --bevel-dark: #7a7a7a;
  --bevel-deep: #444444;
  --accent: #2256a6;
  --accent-soft: #dbe8ff;
  --good: #2f7a31;
  --bad: #a32b21;
  --warn: #8b5c12;
  --canvas-frame: #404040;
  --screen-bg: #adc699;
  --screen-ink: #20321d;
  --shadow: 3px 3px 0 rgba(0, 0, 0, 0.25);
  --radius: 0;
  --font-ui: "Chicago", "Geneva", "Helvetica Neue", sans-serif;
  --font-body: "Geneva", "Helvetica Neue", sans-serif;
  --font-mono: "Courier New", monospace;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  background:
    radial-gradient(circle at top left, rgba(255, 255, 255, 0.35), transparent 18%),
    linear-gradient(180deg, #bcbcbc 0%, #9f9f9f 100%);
  color: var(--ink);
  font-family: var(--font-body);
  line-height: 1.35;
}

button,
select,
input {
  font: inherit;
}

#app {
  padding: 24px;
}

.trainer-window {
  max-width: 1440px;
  margin: 0 auto;
  border: 1px solid var(--ink);
  background: var(--window);
  box-shadow: var(--shadow);
}

.window-titlebar,
.dialog-titlebar {
  display: grid;
  grid-template-columns: 20px 1fr auto;
  align-items: center;
  gap: 12px;
  padding: 8px 10px;
  border-bottom: 1px solid var(--ink);
  background:
    repeating-linear-gradient(
      180deg,
      var(--bevel-light) 0 2px,
      var(--stripe) 2px 4px
    );
  font-family: var(--font-ui);
}

.window-titlebar strong,
.dialog-titlebar strong {
  justify-self: center;
  font-size: 0.95rem;
}

.close-box {
  display: inline-block;
  width: 14px;
  height: 14px;
  border: 1px solid var(--ink);
  background: var(--platinum);
  box-shadow:
    inset 1px 1px 0 var(--bevel-light),
    inset -1px -1px 0 var(--bevel-dark);
}

.titlebar-button,
.mac-button,
select,
input[type="file"] {
  border: 1px solid var(--ink);
  background: var(--platinum);
  color: var(--ink);
  box-shadow:
    inset 1px 1px 0 var(--bevel-light),
    inset -1px -1px 0 var(--bevel-dark);
}

.titlebar-button,
.mac-button {
  padding: 6px 10px;
  min-height: 30px;
}

.titlebar-button:active,
.mac-button:active,
.choice-button:active,
.key:active {
  box-shadow:
    inset -1px -1px 0 var(--bevel-light),
    inset 1px 1px 0 var(--bevel-dark);
}

.mac-button.primary {
  background: var(--accent-soft);
}

.mac-button:disabled,
.choice-button:disabled,
.key:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

.banner-row {
  padding: 12px 16px;
  border-bottom: 1px solid var(--ink);
  background: #efefef;
  font-size: 0.95rem;
}

.workspace {
  display: grid;
  grid-template-columns: minmax(360px, 0.95fr) minmax(440px, 1.1fr);
  gap: 16px;
  padding: 16px;
}

.panel,
.dashboard-card,
.dialog-window {
  border: 1px solid var(--ink);
  background: var(--paper);
  box-shadow:
    inset 1px 1px 0 var(--bevel-light),
    inset -1px -1px 0 var(--bevel-dark);
}

.panel {
  padding: 16px;
}

.problem-panel,
.calc-panel {
  min-height: 100%;
}

.panel-kicker {
  margin: 0 0 6px;
  font-family: var(--font-ui);
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

h2 {
  margin: 0 0 12px;
  font-family: var(--font-ui);
  font-size: 1.2rem;
}

.problem-stem {
  margin: 0 0 14px;
  font-size: 0.98rem;
}

.problem-stem.minimized {
  padding: 10px;
  border: 1px solid var(--ink);
  background: #f4f4f4;
}

.panel-note,
.dialog-note {
  margin: 12px 0 0;
  font-size: 0.9rem;
  color: #2d2d2d;
}

.choice-list {
  display: grid;
  gap: 10px;
}

.choice-button {
  width: 100%;
  padding: 12px 14px;
  text-align: left;
  border: 1px solid var(--ink);
  background: var(--platinum);
  box-shadow:
    inset 1px 1px 0 var(--bevel-light),
    inset -1px -1px 0 var(--bevel-dark);
}

.choice-button.removed {
  background: #dfdfdf;
  color: #606060;
  text-decoration: line-through;
}

.contrast-card,
.walkthrough-copy,
.keypad-empty {
  padding: 12px;
  border: 1px solid var(--ink);
  background: #f6f6f6;
}

.contrast-label {
  margin: 0 0 8px;
  font-family: var(--font-ui);
}

.button-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 14px;
}

.button-row.compact {
  margin-top: 0;
}

.compact-problem-bar,
.calc-top,
.narration-bar {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.mode-badge-row,
.status-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.mode-badge,
.status-pill,
.chip {
  display: inline-flex;
  gap: 6px;
  align-items: center;
  padding: 4px 8px;
  border: 1px solid var(--ink);
  background: #ededed;
  font-size: 0.86rem;
  box-shadow:
    inset 1px 1px 0 var(--bevel-light),
    inset -1px -1px 0 var(--bevel-dark);
}

.mode-badge.subtle,
.status-pill.subtle {
  background: #f5f5f5;
}

.status-ready {
  background: #d5f0d0;
}

.status-loading-wasm,
.status-booting {
  background: #f3edcc;
}

.status-needs-rom,
.status-mock {
  background: #f4dfc7;
}

.chip-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
}

.calc-top {
  margin-bottom: 12px;
}

.screen-frame {
  position: relative;
  padding: 18px;
  border: 1px solid var(--ink);
  background: linear-gradient(180deg, #666666 0%, #4a4a4a 100%);
  box-shadow:
    inset 1px 1px 0 rgba(255, 255, 255, 0.2),
    inset -1px -1px 0 rgba(0, 0, 0, 0.45);
}

.calc-canvas {
  display: block;
  width: 100%;
  max-width: 640px;
  aspect-ratio: 4 / 3;
  margin: 0 auto;
  border: 10px solid var(--canvas-frame);
  background: var(--screen-bg);
  image-rendering: pixelated;
}

.screen-overlay {
  position: absolute;
  top: 10px;
  right: 14px;
}

.screen-meta {
  display: inline-flex;
  gap: 8px;
  align-items: center;
  padding: 4px 8px;
  border: 1px solid var(--ink);
  background: rgba(255, 255, 255, 0.86);
  font-size: 0.82rem;
}

.calc-placeholder-copy {
  margin: 0;
  padding: 4px 8px;
  border: 1px solid var(--ink);
  background: rgba(255, 255, 255, 0.86);
  font-size: 0.82rem;
}

.narration-bar {
  margin-top: 12px;
  padding: 12px;
  border: 1px solid var(--ink);
  background: var(--platinum);
  box-shadow:
    inset 1px 1px 0 var(--bevel-light),
    inset -1px -1px 0 var(--bevel-dark);
}

.narration-copy {
  display: grid;
  gap: 4px;
}

.narration-copy strong {
  font-size: 0.95rem;
}

.narration-copy span {
  font-size: 0.86rem;
}

.keypad-shell {
  margin-top: 16px;
  padding: 16px;
  border: 1px solid var(--ink);
  background: #d7d7d7;
}

.keypad-empty {
  margin-top: 16px;
}

.keypad-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(58px, 1fr));
  grid-auto-rows: 58px;
  gap: 8px;
}

.key-gap {
  min-height: 58px;
}

.key {
  position: relative;
  display: grid;
  place-items: center;
  gap: 2px;
  padding: 4px;
  border: 1px solid var(--ink);
  background: #d0d0d0;
  color: var(--ink);
  box-shadow:
    inset 1px 1px 0 var(--bevel-light),
    inset -1px -1px 0 var(--bevel-dark);
}

.key.tall {
  min-height: 124px;
}

.key-blue {
  background: #c9d8ef;
}

.key-yellow {
  background: #f3e08c;
}

.key-green {
  background: #c9e3b6;
}

.key-black {
  background: #8a8a8a;
  color: #fff;
}

.key-gray {
  background: #d7d7d7;
}

.key-white {
  background: #f5f5f5;
}

.key-secondary,
.key-alpha {
  position: absolute;
  top: 4px;
  font-size: 0.58rem;
}

.key-secondary {
  left: 6px;
}

.key-alpha {
  right: 6px;
}

.key-label {
  text-align: center;
  font-family: var(--font-ui);
  font-size: 0.82rem;
}

.key.suggested {
  outline: 2px solid var(--accent);
  outline-offset: -2px;
}

.key.dimmed {
  opacity: 0.45;
}

.key.flash-correct {
  background: #ccecc8;
}

.key.flash-wrong {
  background: #f1c4bb;
}

.dashboard-row {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  padding: 0 16px 16px;
}

.dashboard-card {
  display: grid;
  gap: 4px;
  padding: 12px;
  background: #f7f7f7;
}

.dashboard-card strong {
  font-family: var(--font-ui);
  font-size: 1.3rem;
}

.dashboard-control label {
  font-size: 0.86rem;
}

select {
  width: 100%;
  padding: 6px 8px;
  background: #fff;
}

.dialog-backdrop {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 20px;
  background: rgba(0, 0, 0, 0.24);
}

.dialog-window {
  width: min(560px, 100%);
  background: var(--window);
}

.dialog-body {
  padding: 16px;
}

input[type="file"] {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  background: #fff;
}

code {
  font-family: var(--font-mono);
}

@media (max-width: 960px) {
  #app {
    padding: 14px;
  }

  .workspace {
    grid-template-columns: 1fr;
  }

  .dashboard-row {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 768px) {
  .keypad-grid {
    grid-template-columns: repeat(5, minmax(44px, 1fr));
    grid-auto-rows: 52px;
  }

  .calc-canvas {
    max-width: 100%;
  }

  .dashboard-row {
    grid-template-columns: 1fr;
  }

  .window-titlebar,
  .dialog-titlebar {
    grid-template-columns: 20px 1fr;
  }

  .titlebar-button {
    grid-column: 1 / -1;
    justify-self: start;
  }
}

  </style>
</head>

le mean","sampling distribution","confidence interval","hypothesis","binomial","trials"],"frameworkSkills":["VAR-2.B","VAR-6.A"],"unit":1},"invnorm":{"dataType":"quantitative","parameterType":"percentile","questionType":"calculation","sampleStructure":"n/a","distributionFamily":"normal","keywords":["percentile","cutoff","top","bottom","what value","find the score","boundary","lowest","highest"],"antiKeywords":["probability","proportion of","how likely","sampling distribution","binomial"],"frameworkSkills":["VAR-2.B","VAR-6.B"],"unit":1},"binompdf":{"dataType":"categorical","parameterType":"probability","questionType":"calculation","sampleStructure":"n/a","distributionFamily":"binomial","keywords":["exactly","probability of exactly","n trials","success","failure","independent trials","fixed number"],"antiKeywords":["at most","at least","fewer than","more than","first success","geometric","normal distribution"],"frameworkSkills":["UNC-3.A","UNC-3.B"],"unit":4},"binomcdf":{"dataType":"categorical","parameterType":"probability","questionType":"calculation","sampleStructure":"n/a","distributionFamily":"binomial","keywords":["at most","at least","fewer than","more than","no more than","cumulative","n trials","success","failure"],"antiKeywords":["exactly","first success","geometric","normal distribution"],"frameworkSkills":["UNC-3.A","UNC-3.B"],"unit":4},"geometpdf":{"dataType":"categorical","parameterType":"probability","questionType":"calculation","sampleStructure":"n/a","distributionFamily":"geometric","keywords":["first success","first time","on the","trial","attempt","exactly the"],"antiKeywords":["at most","at least","within","fixed number of trials","n trials","normal distribution"],"frameworkSkills":["UNC-3.E"],"unit":4},"geometcdf":{"dataType":"categorical","parameterType":"probability","questionType":"calculation","sampleStructure":"n/a","distributionFamily":"geometric","keywords":["within","by the","at most","no more than","first success within","takes at most"],"antiKeywords":["exactly on","fixed number of trials","n trials","normal distribution"],"frameworkSkills":["UNC-3.E"],"unit":4},"normalcdf-sampling":{"dataType":"quantitative","parameterType":"probability","questionType":"calculation","sampleStructure":"n/a","distributionFamily":"normal","keywords":["sample mean","sampling distribution","random sample of size","probability that the sample mean","standard error"],"antiKeywords":["individual","one randomly selected","percentile","cutoff","binomial"],"frameworkSkills":["UNC-3.Q","UNC-3.R","UNC-3.S"],"unit":5},"invnorm-sampling":{"dataType":"quantitative","parameterType":"percentile","questionType":"calculation","sampleStructure":"n/a","distributionFamily":"normal","keywords":["sample mean","sampling distribution","cutoff","percentile of sample means","what sample mean","top","bottom"],"antiKeywords":["individual","one randomly selected","probability","proportion of","binomial"],"frameworkSkills":["UNC-3.Q","UNC-3.R","UNC-3.S"],"unit":5},"one-var-stats":{"dataType":"quantitative","parameterType":"descriptive","questionType":"calculation","sampleStructure":"one-sample","distributionFamily":null,"keywords":["summary statistics","mean","standard deviation","five-number summary","quartiles","median","describe the distribution"],"antiKeywords":["hypothesis","confidence interval","test","claim","regression","slope"],"frameworkSkills":["UNC-1.D","UNC-1.E","UNC-1.F","UNC-1.G"],"unit":1},"linreg-a-plus-bx":{"dataType":"quantitative","parameterType":"regression","questionType":"calculation","sampleStructure":"paired","distributionFamily":null,"keywords":["regression equation","least-squares","predict","line of best fit","correlation","r-squared","slope","y-intercept"],"antiKeywords":["hypothesis","confidence interval","significance","p-value","test the slope"],"frameworkSkills":["DAT-1.D","DAT-1.G","DAT-1.H"],"unit":2},"histogram":{"dataType":"quantitative","parameterType":"graphical","questionType":"display","sampleStructure":"one-sample","distributionFamily":null,"keywords":["histogram","shape","distribution","frequency","display the data","graph the data"],"antiKeywords":["boxplot","scatterplot","regression","two variables"],"frameworkSkills":["UNC-1.H","UNC-1.I"],"unit":1},"modified-boxplot":{"dataType":"quantitative","parameterType":"graphical","questionType":"display","sampleStructure":"one-sample","distributionFamily":null,"keywords":["boxplot","box-and-whisker","five-number summary","outliers","quartiles","IQR"],"antiKeywords":["histogram","scatterplot","regression","two variables"],"frameworkSkills":["UNC-1.H","UNC-1.L"],"unit":1},"scatterplot":{"dataType":"quantitative","parameterType":"graphical","questionType":"display","sampleStructure":"paired","distributionFamily":null,"keywords":["scatterplot","two variables","relationship","explanatory","response","bivariate"],"antiKeywords":["histogram","boxplot","one variable","residual"],"frameworkSkills":["UNC-1.S","DAT-1.A"],"unit":2},"residual-plot":{"dataType":"quantitative","parameterType":"graphical","questionType":"display","sampleStructure":"paired","distributionFamily":null,"keywords":["residual","residual plot","appropriateness","linear model","pattern in residuals"],"antiKeywords":["scatterplot","histogram","boxplot","one variable"],"frameworkSkills":["DAT-1.E","DAT-1.F"],"unit":2},"matrix-entry":{"dataType":"categorical","parameterType":"utility","questionType":"setup","sampleStructure":"n/a","distributionFamily":null,"keywords":["matrix","two-way table","enter data","rows","columns","observed counts"],"antiKeywords":[],"frameworkSkills":[],"unit":8}},"confusionMatrix":[{"a":"one-propztest","b":"one-propzint","type":"test-vs-interval","contrast":"Your problem tests a specific claim about a proportion -- there is a hypothesized value like 'more than 60%.' A confidence interval estimates a plausible range for the proportion when there is no specific claim to test. Look for words like 'test,' 'claim,' or 'hypothesize' (test) versus 'estimate' or 'how large' (interval)."},{"a":"t-test-stats","b":"t-interval-stats","type":"test-vs-interval","contrast":"Your problem makes a specific claim about a population mean and asks you to evaluate it -- that is a hypothesis test. A confidence interval estimates a range of plausible values for the mean without testing a particular claim. Check: is there a number being challenged, or are you estimating?"},{"a":"two-samp-ttest","b":"two-samp-tint","type":"test-vs-interval","contrast":"Your problem compares two group means and asks whether there is a significant difference -- that calls for a two-sample t-test. A two-sample t-interval estimates how large the difference might be. If the problem says 'is there a difference,' use a test. If it says 'estimate the difference,' use an interval."},{"a":"linreg-ttest","b":"linreg-tint","type":"test-vs-interval","contrast":"Your problem asks whether there is convincing evidence of a linear relationship between two variables -- that is a test for the slope. A confidence interval for the slope estimates the range of plausible values for the true slope. If the question says 'is there a relationship,' test. If it says 'estimate the slope,' build an interval."},{"a":"one-propztest","b":"t-test-stats","type":"proportion-vs-mean","contrast":"Look at the data type. Your problem involves counts or percentages ('102 out of 150 said yes') -- that is categorical data about a proportion. A t-test is for quantitative measurements like heights, weights, or scores where you have a sample mean and standard deviation. Proportions use z; means use t."},{"a":"one-propzint","b":"t-interval-stats","type":"proportion-vs-mean","contrast":"Check whether the data is categorical (yes/no, success/failure counts) or quantitative (measurements with a mean and SD). Proportions come from counting successes out of a total. Means come from measuring a quantity. If you see x and n, it is a proportion interval. If you see x-bar and s, it is a t-interval."},{"a":"t-test-stats","b":"linreg-ttest","type":"mean-vs-slope","contrast":"Both use the t-distribution, but they answer different questions. A t-test asks about one population mean (or a mean difference). A LinRegTTest asks whether the slope of a regression line is significantly different from zero -- that is, whether two quantitative variables have a linear relationship. If you have paired (x, y) data and a scatterplot, think regression."},{"a":"one-propztest","b":"chi-square-gof-test","type":"single-proportion-vs-distribution","contrast":"A 1-PropZTest checks one proportion against a claimed value ('Is the proportion of defectives more than 5%?'). A chi-square goodness-of-fit test checks an entire distribution across multiple categories ('Do the colors appear in the claimed ratio of 3:2:1?'). If there are only two outcomes (success/failure), use 1-PropZTest. If there are three or more categories, use chi-square GOF."},{"a":"t-test-stats","b":"two-samp-ttest","type":"one-sample-vs-two-sample","contrast":"Count the number of groups. A one-sample t-test compares a single sample mean to a claimed value (like 'the manufacturer says the mean is 500g'). A two-sample t-test compares the means of two independent groups ('is there a difference between Group A and Group B?'). One group versus a number: one-sample. Two groups versus each other: two-sample."},{"a":"t-interval-stats","b":"two-samp-tint","type":"one-sample-vs-two-sample","contrast":"A one-sample t-interval estimates a single population mean. A two-sample t-interval estimates the difference between two population means. Ask: am I estimating one number, or the gap between two numbers?"},{"a":"chi-square-test","b":"chi-square-gof-test","type":"independence-vs-gof","contrast":"Both are chi-square tests, but they handle different situations. A goodness-of-fit test has ONE categorical variable and checks if its distribution matches a claimed set of proportions. A chi-square test for independence or homogeneity has TWO categorical variables in a two-way table and checks whether they are related. One variable: GOF. Two variables in a table: independence/homogeneity."},{"a":"normalcdf","b":"invnorm","type":"forward-vs-inverse","contrast":"These are opposite directions. normalcdf starts with boundary values and finds a probability (area): 'What proportion of values fall between 60 and 80?' invNorm starts with a probability and finds the boundary value: 'What score separates the top 10%?' If you know the boundaries and want the probability, use normalcdf. If you know the probability and want the boundary, use invNorm."},{"a":"binompdf","b":"binomcdf","type":"exact-vs-cumulative","contrast":"binompdf gives the probability of exactly one outcome: 'P(X = 3).' binomcdf gives the cumulative probability up to a value: 'P(X <= 3).' If the problem says 'exactly,' use pdf. If it says 'at most,' 'no more than,' or 'fewer than,' use cdf. For 'at least,' use 1 minus binomcdf."},{"a":"geometpdf","b":"geometcdf","type":"exact-vs-cumulative","contrast":"geometpdf gives the probability that the first success occurs on exactly one specific trial: 'P(first success on trial 5).' geometcdf gives the probability that the first success occurs within a certain number of trials: 'P(first success by trial 5).' Exact trial: pdf. Within the first k trials: cdf."},{"a":"normalcdf","b":"binomcdf","type":"continuous-vs-discrete","contrast":"normalcdf is for continuous data that follows a normal (bell-shaped) distribution -- measurements like heights, times, or temperatures. binomcdf is for counting successes in a fixed number of independent trials with the same probability of success. If the variable is measured on a continuous scale, think normalcdf. If it counts successes out of n trials, think binomial."},{"a":"binompdf","b":"geometpdf","type":"fixed-trials-vs-first-success","contrast":"Both involve independent trials with two outcomes, but they count different things. Binomial has a FIXED number of trials (n) and counts how many are successes. Geometric has NO fixed number of trials and counts how many trials it takes to get the FIRST success. Fixed n and counting successes: binomial. Waiting for the first success: geometric."},{"a":"normalcdf","b":"normalcdf-sampling","type":"population-vs-sampling","contrast":"Both use normalcdf on the calculator, but the inputs differ. For an individual value from a population, use the population mean and SD directly. For a sample mean from a sampling distribution, you must use the standard error (sigma / sqrt(n)) instead of sigma. Ask: is this about one individual, or about the average of a sample of n?"},{"a":"one-propztest","b":"chi-square-gof-test","type":"proportion-claim-vs-distribution-fit","contrast":"If the problem tests a claim about a single proportion with two outcomes (yes/no, success/failure), use 1-PropZTest. If the problem tests whether a categorical variable with three or more categories follows a specific distribution, use chi-square GOF. Two categories: proportion test. Multiple categories: GOF test."},{"a":"linreg-a-plus-bx","b":"linreg-ttest","type":"descriptive-vs-inferential","contrast":"LinReg(a+bx) simply calculates the equation of the least-squares regression line from data -- it is descriptive. LinRegTTest does that AND runs a significance test to determine whether the slope is significantly different from zero. If you just need the equation, use LinReg. If you need a p-value to test whether the relationship is real, use LinRegTTest."},{"a":"one-var-stats","b":"t-test-stats","type":"descriptive-vs-inferential","contrast":"1-Var Stats calculates summary statistics (mean, SD, quartiles) to describe a data set. A t-test uses those statistics to make an inference about a population mean. If the question asks you to describe or summarize the data, use 1-Var Stats. If it asks you to test a claim or draw a conclusion about a population, use a t-test."},{"a":"invnorm","b":"invnorm-sampling","type":"population-vs-sampling","contrast":"Both find a cutoff value using invNorm, but the standard deviation input differs. For an individual from a population, use sigma. For a sample mean from a sampling distribution of size n, use the standard error sigma / sqrt(n). The question will tell you: is it about one randomly selected individual, or about the mean of a random sample?"},{"a":"t-test-stats","b":"t-test-data","type":"input-mode","contrast":"These run the exact same test. The only difference is input format. Use Stats mode when the problem gives you summary statistics (x-bar, s, n). Use Data mode when the problem gives you a list of raw data values that you have entered into L1. Same test, different starting point."}],"canonicalProblems":{"one-propztest":[{"stem":"A company claims that at least 70% of its customers are satisfied with their service. In a random sample of 200 customers, 126 reported satisfaction. Test the company's claim at the alpha = 0.05 significance level.","values":{"p0":0.7,"x":126,"n":200,"direction":"<"},"frameworkSkill":"VAR-6.G","unit":6},{"stem":"A botanist believes that fewer than 90% of seeds from a certain supplier will germinate. She plants a random sample of 120 seeds and observes that 100 germinate. Is there convincing evidence at alpha = 0.05 to support the botanist's belief?","values":{"p0":0.9,"x":100,"n":120,"direction":"<"},"frameworkSkill":"DAT-3.B","unit":6},{"stem":"Approximately 38% of people in Region W have blood type O positive. A random sample of 100 people from Region X reveals that 45 have blood type O positive. Is there evidence that the proportion in Region X differs from Region W?","values":{"p0":0.38,"x":45,"n":100,"direction":"!="},"frameworkSkill":"VAR-6.D","unit":6}],"one-propzint":[{"stem":"A random sample of 80 adults was selected, and 22 indicated they would support eliminating the penny from circulation. Construct a 99% confidence interval for the true proportion of adults who support this idea.","values":{"x":22,"n":80,"cLevel":0.99},"frameworkSkill":"UNC-4.D","unit":6},{"stem":"In a random sample of 500 registered voters, 235 said they plan to vote for Candidate A. Construct a 95% confidence interval to estimate the true proportion of voters who support Candidate A.","values":{"x":235,"n":500,"cLevel":0.95},"frameworkSkill":"UNC-4.C","unit":6},{"stem":"A school librarian sampled 50 students from senior English classes, and 35 had read a certain book. Construct a 90% confidence interval for the proportion of all seniors who have read the book.","values":{"x":35,"n":50,"cLevel":0.9},"frameworkSkill":"UNC-4.D","unit":6}],"t-test-stats":[{"stem":"A cereal manufacturer claims that boxes contain a mean of 500 grams of cereal. A quality inspector takes a random sample of 36 boxes and finds a sample mean of 494 grams with a standard deviation of 18 grams. Is there evidence at alpha = 0.05 that the true mean is less than 500 grams?","values":{"mu0":500,"xbar":494,"sx":18,"n":36,"direction":"<"},"frameworkSkill":"VAR-7.E","unit":7},{"stem":"A physical therapist claims that a new stretching routine reduces recovery time to less than 10 days. In a random sample of 25 patients, the mean recovery time was 8.9 days with a standard deviation of 3.2 days. Test this claim at alpha = 0.01.","values":{"mu0":10,"xbar":8.9,"sx":3.2,"n":25,"direction":"<"},"frameworkSkill":"DAT-3.F","unit":7},{"stem":"The FAA mandates that airline pilot response time to a warning signal must average no more than 4.5 seconds. A random sample of 40 pilots had a mean response time of 4.8 seconds with s = 1.1 seconds. At alpha = 0.05, is there evidence the mean exceeds the mandate?","values":{"mu0":4.5,"xbar":4.8,"sx":1.1,"n":40,"direction":">"},"frameworkSkill":"DAT-3.E","unit":7}],"t-test-data":[{"stem":"A teacher claims the mean score on a standardized test for her class is higher than the national average of 72. She records the following scores from her 12 randomly selected students: 68, 74, 79, 71, 85, 77, 82, 73, ];

function createState(screenId = 'home', options = {}) {
  const screen = SCREENS[screenId];

  if (!screen) {
    throw new Error(`Unknown TI-84 screen: ${screenId}`);
  }

  const state = deepClone(screen);

  state.secondActive = options.secondActive ?? screenId === 'home-second';
  state.routeId = options.routeId ?? null;
  state.routeIndex = options.routeIndex ?? 0;
  state.returnScreen = options.returnScreen ?? null;
  state.returnFieldIndex = options.returnFieldIndex ?? null;
  state.zoomTarget = options.zoomTarget ?? defaultZoomTarget(screenId);
  state.homeCommandType = options.homeCommandType ?? null;
  state.selectorMode = options.selectorMode ?? null;
  state.traceMode = options.traceMode ?? screenId.endsWith('-trace');
  state.traceIndex = options.traceIndex ?? 0;
  state.inputMode = options.inputMode ?? defaultInputMode(screenId);

  if (screen.items) {
    state.cursorIndex = options.cursorIndex ?? screen.cursor ?? 0;
    state.cursor = state.cursorIndex;
  }

  if (screen.fields) {
    const initialValues = options.fieldValues ?? [];

    state.fields = screen.fields.map((field, index) => {
      const normalized = normalizeField(field);
      const overrideValue = initialValues[index];

      if (overrideValue !== undefined) {
        normalized.value = overrideValue;
      }

      return normalized;
    });

    state.activeField = options.activeField ?? 0;
  }

  if (screen.columns) {
    state.editorColumn = options.editorColumn ?? 0;
    state.editorRow = options.editorRow ?? 0;
    state.onHeader = options.onHeader ?? false;
  }

  if (screenId === 'matrix-editor-a-dims') {
    state.matrixDimensions = {
      rows: options.rows ?? '',
      cols: options.cols ?? '',
    };
  }

  if (screenId === 'matrix-editor-a-values') {
    state.matrixCursor = {
      row: options.matrixRow ?? 0,
      col: options.matrixCol ?? 0,
    };
  }

  return state;
}

function createRouteState(routeId) {
  const route = ROUTES.get(routeId);

  if (!route) {
    throw new Error(`Unknown TI-84 route: ${routeId}`);
  }

  return createState(route.startScreen, { routeId });
}

function transition(state, key) {
  const currentState = normalizeStateInput(state);
  const structuralNext = structuralTransition(currentState, key);
  const routeStep = getNextRouteStep(currentState);

  if (routeStep && routeStep.key === key) {
    if (structuralNext && structuralNext.id === routeStep.screen) {
      return advanceRoute(structuralNext, currentState);
    }

    return advanceRoute(
      fallbackGuidedState(currentState, routeStep),
      currentState,
    );
  }

  return structuralNext;
}

function validKeys(state) {
  const currentState = normalizeStateInput(state);
  const keys = new Set();

  for (const key of VALIDATION_KEYS) {
    if (transition(currentState, key)) {
      keys.add(key);
    }
  }

  const parameterKey = suggestedParameterKey(currentState);

  if (parameterKey && transition(currentState, parameterKey)) {
    keys.add(parameterKey);
  }

  return [...keys];
}

function structuralTransition(state, key) {
  if (COMPOUND_KEYS[key]) {
    return moveToScreen(state, COMPOUND_KEYS[key], { secondActive: false });
  }

  if (key === '2ND_LIST') {
    return moveToScreen(state, 'list-names-menu', {
      secondActive: false,
      returnScreen: state.id,
      returnFieldIndex: state.activeField ?? null,
    });
  }

  if (key === '2ND_QUIT') {
    return moveToScreen(state, 'home', {
      secondActive: false,
      homeCommandType: null,
      selectorMode: null,
      traceMode: false,
    });
  }

  if (key === 'CLEAR') {
    return handleClear(state);
  }

  if (key === '2ND') {
    return handleSecond(state);
  }

  if (state.id === 'home-second') {
    return handleHomeSecond(state, key);
  }

  if (state.secondActive) {
    const comboResult = handleSecondCombo(state, key);

    if (comboResult) {
      return comboResult;
    }
  }

  switch (state.type) {
    case 'home':
      return handleHome(state, key);
    case 'menu':
      return handleMenu(state, key);
    case 'wizard':
      return handleWizard(state, key);
    case 'editor':
      return handleEditor(state, key);
    case 'result':
      return handleResult(state, key);
    case 'graph':
      return handleGraph(state, key);
    default:
      return null;
  }
}

function handleClear(state) {
  if (state.id === 'list-names-menu' && state.returnScreen) {
    return moveToScreen(state, state.returnScreen, {
      secondActive: false,
      returnScreen: null,
      returnFieldIndex: null,
    });
  }

  if (state.type === 'menu') {
    return moveToScreen(state, 'home', {
      secondActive: false,
      homeCommandType: null,
    });
  }

  if (state.id === 'home-second') {
    return moveToScreen(state, 'home', {
      secondActive: false,
      homeCommandType: state.homeCommandType,
    });
  }

  if (state.type === 'wizard' || state.type === 'result' || state.type === 'graph') {
    return moveToScreen(state, 'home', {
      secondActive: false,
      homeCommandType: null,
      traceMode: false,
    });
  }

  if (state.id === 'stat-edit-lists' || state.id === 'residual-list-editor') {
    if (state.onHeader) {
      return cloneOnSameScreen(state, {
        secondActive: false,
      });
    }

    return moveToScreen(state, 'home', {
      secondActive: false,
      homeCommandType: null,
    });
  }

  if (isFieldInputScreen(state) && getActiveField(state)) {
    const nextState = cloneOnSameScreen(state, { secondActive: false });

    nextState.fields[nextState.activeField].value = '';
    return nextState;
  }

  return null;
}

function handleSecond(state) {
  if (state.id === 'home') {
    return moveToScreen(state, 'home-second', {
      secondActive: true,
      homeCommandType: state.homeCommandType,
    });
  }

  if (state.id === 'home-second') {
    return moveToScreen(state, 'home', {
      secondActive: false,
      homeCommandType: state.homeCommandType,
    });
  }

  return cloneOnSameScreen(state, { secondActive: true });
}

function handleHome(state, key) {
  if (key === 'STAT') {
    return moveToScreen(state, 'stat-menu', { secondActive: false });
  }

  if (key === 'ZOOM') {
    return moveToScreen(state, 'zoom-menu', {
      secondActive: false,
      zoomTarget: 'scatterplot-graph',
    });
  }

  if (key === 'ENTER' && state.homeCommandType === 'distribution') {
    return moveToScreen(state, 'distribution-home-result', {
      secondActive: false,
      homeCommandType: null,
    });
  }

  if (key === 'ENTER' && state.homeCommandType === 'catalog') {
    return moveToScreen(state, 'home', {
      secondActive: false,
      homeCommandType: null,
    });
  }

  return null;
}

function handleHomeSecond(state, key) {
  if (key === 'Y=') {
    return moveToScreen(state, 'stat-plot-menu', { secondActive: false });
  }

  if (key === 'VARS') {
    return moveToScreen(state, 'distr-menu', { secondActive: false });
  }

  if (key === 'X_INVERSE') {
    return moveToScreen(state, 'matrix-menu-names', { secondActive: false });
  }

  if (key === '0') {
    return moveToScreen(state, 'catalog-top', { secondActive: false });
  }

  if (key === 'STAT') {
    return moveToScreen(state, 'list-names-menu', {
      secondActive: false,
      returnScreen: 'home',
    });
  }

  return null;
}

function handleSecondCombo(state, key) {
  const activeField = getActiveField(state);

  if (
    state.id === 'plot1-editor-resid' &&
    key === 'STAT'
  ) {
    return moveToScreen(state, 'list-names-menu', {
      secondActive: false,
      returnScreen: state.id,
      returnFieldIndex: state.activeField ?? null,
      cursorIndex: 0,
    });
  }

  if (activeField && isDigitKey(key)) {
    if (activeField.type === 'list-selector' && Number(key) >= 1 && Number(key) <= 6) {
      return setActiveFieldValue(state, `L${key}`, { secondActive: false });
    }

    if (activeField.type === 'matrix-selector' && Number(key) >= 1 && Number(key) <= 3) {
      return setActiveFieldValue(state, `[${String.fromCharCode(64 + Number(key))}]`, {
        secondActive: false,
      });
    }
  }

  return null;
}

function handleMenu(state, key) {
  if (state.id === 'catalog-top' && key === 'X_INVERSE') {
    return moveToScreen(state, 'catalog-d-section', { secondActive: false });
  }

  const tabTarget = TAB_SWITCHES[state.id]?.[key];

  if (tabTarget) {
    return moveToScreen(state, tabTarget, {
      secondActive: false,
      cursorIndex: 0,
    });
  }

  if (key === 'UP' || key === 'DOWN') {
    const delta = key === 'DOWN' ? 1 : -1;
    const itemCount = state.items.length;
    const nextCursor = wrapIndex(state.cursorIndex, itemCount, delta);

    return cloneOnSameScreen(state, {
      cursorIndex: nextCursor,
      secondActive: false,
    });
  }

  if (isDigitKey(key)) {
    const shortcutSelection = shortcutIndex(state.items, key);

    if (shortcutSelection !== null) {
      return selectMenuItem(state, shortcutSelection);
    }
  }

  if (key === 'ENTER') {
    return selectMenuItem(state, state.cursorIndex);
  }

  if (key === 'ZOOM') {
    return moveToScreen(state, 'zoom-menu', {
      secondActive: false,
      zoomTarget: state.zoomTarget ?? 'scatterplot-graph',
    });
  }

  return null;
}

function handleWizard(state, key) {
  if (isParameterKey(key) || (acceptsLiteralInput(state) && isLiteralInputKey(key))) {
    return setActiveFieldValue(state, normalizeInputKey(key), { secondActive: false });
  }

  if (key === 'UP' || key === 'DOWN') {
    const nextField = clampIndex(
      state.activeField + (key === 'DOWN' ? 1 : -1),
      0,
      state.fields.length - 1,
    );

    return cloneOnSameScreen(state, {
      activeField: nextField,
      secondActive: false,
      selectorMode: null,
    });
  }

  if (key === 'VARS' && getActiveField(state)?.type === 'equation-selector') {
    return cloneOnSameScreen(state, {
      secondActive: false,
      selectorMode: 'yvars',
    });
  }

  if (key === 'LEFT' || key === 'RIGHT') {
    const inputModeScreen = INPUT_MODE_SWITCHES[state.id]?.[key];

    if (inputModeScreen && state.activeField === 0) {
      return moveToScreen(state, inputModeScreen, {
        secondActive: false,
      });
    }

    if (
      state.id === 'two-samp-ttest-stats-wizard' &&
      state.activeField === 0
    ) {
      const nextMode = key === 'RIGHT' ? 'Stats' : 'Data';

      return cloneOnSameScreen(state, {
        secondActive: false,
        inputMode: nextMode,
      });
    }

    if (
      state.id === 'two-samp-tint-stats-wizard' &&
      state.activeField === 0
    ) {
      const nextMode = key === 'RIGHT' ? 'Stats' : 'Data';

      return cloneOnSameScreen(state, {
        secondActive: false,
        inputMode: nextMode,
      });
    }

    if (
      getActiveField(state)?.type === 'equation-selector' &&
      state.selectorMode === 'yvars' &&
      key === 'RIGHT'
    ) {
      return cloneOnSameScreen(state, {
        secondActive: false,
        selectorMode: 'function',
      });
    }

    const choiceResult = cycleChoiceField(state, key);

    if (choiceResult) {
      return choiceResult;
    }
  }

  if (key === 'ENTER') {
    if (getActiveField(state)?.type === 'equation-selector') {
      if (state.selectorMode === 'function') {
        return cloneOnSameScreen(state, {
          secondActive: false,
          selectorMode: 'selected-y1',
        });
      }

      if (state.selectorMode === 'selected-y1') {
        return setActiveFieldValue(state, 'Y1', {
          secondActive: false,
          selectorMode: null,
        });
      }
    }

    const actionTarget = actionTargetForState(state);

    if (actionTarget) {
      return actionTarget;
    }

    if (getActiveField(state)?.type === 'choice') {
      return cloneOnSameScreen(state, { secondActive: false });
    }
  }

  return null;
}

function handleEditor(state, key) {
  if (state.id === 'stat-edit-lists' || state.id === 'residual-list-editor') {
    return handleListEditor(state, key);
  }

  if (state.id === 'matrix-editor-a-values') {
    return handleMatrixValueEditor(state, key);
  }

  if (isParameterKey(key) || (acceptsLiteralInput(state) && isLiteralInputKey(key))) {
    return setActiveFieldValue(state, normalizeInputKey(key), { secondActive: false });
  }

  if (key === 'UP' || key === 'DOWN') {
    const nextField = clampIndex(
      state.activeField + (key === 'DOWN' ? 1 : -1),
      0,
      state.fields.length - 1,
    );

    return cloneOnSameScreen(state, {
      activeField: nextField,
      secondActive: false,
    });
  }

  if (key === 'LEFT' || key === 'RIGHT') {
    const typeRow = getActiveField(state)?.label.startsWith('Type');

    if (typeRow && key === 'RIGHT') {
      return cyclePlotEditor(state);
    }

    const choiceResult = cycleChoiceField(state, key);

    if (choiceResult) {
      return choiceResult;
    }
  }

  if (key === 'ENTER') {
    if (state.id === 'matrix-editor-a-dims') {
      if (state.activeField === 0) {
        return cloneOnSameScreen(state, {
          activeField: 1,
          secondActive: false,
        });
      }

      return moveToScreen(state, 'matrix-editor-a-values', {
        secondActive: false,
        rows: state.matrixDimensions?.rows ?? '',
        cols: state.matrixDimensions?.cols ?? '',
      });
    }

    return cloneOnSameScreen(state, { secondActive: false });
  }

  if (key === 'ZOOM') {
    return moveToScreen(state, 'zoom-menu', {
      secondActive: false,
      zoomTarget: GRAPH_FOR_PLOT_EDITOR[state.id] ?? state.zoomTarget,
    });
  }

  return null;
}

function handleListEditor(state, key) {
  if (isParameterKey(key) || isLiteralInputKey(key)) {
    return cloneOnSameScreen(state, { secondActive: false });
  }

  if (key === 'ENTER') {
    return cloneOnSameScreen(state, {
      editorRow: state.editorRow + 1,
      onHeader: false,
      secondActive: false,
    });
  }

  if (key === 'RIGHT') {
    return cloneOnSameScreen(state, {
      editorColumn: clampIndex(state.editorColumn + 1, 0, state.columns.length - 1),
      secondActive: false,
    });
  }

  if (key === 'LEFT') {
    return cloneOnSameScreen(state, {
      editorColumn: clampIndex(state.editorColumn - 1, 0, state.columns.length - 1),
      secondActive: false,
    });
  }

  if (key === 'UP') {
    if (state.onHeader) {
      return cloneOnSameScreen(state, { secondActive: false });
    }

    if (state.editorRow === 0) {
      return cloneOnSameScreen(state, {
        onHeader: true,
        secondActive: false,
      });
    }

    return cloneOnSameScreen(state, {
      editorRow: state.editorRow - 1,
      secondActive: false,
    });
  }

  if (key === 'DOWN') {
    if (state.onHeader) {
      return cloneOnSameScreen(state, {
        onHeader: false,
        editorRow: 0,
        secondActive: false,
      });
    }

    return cloneOnSameScreen(state, {
      editorRow: state.editorRow + 1,
      secondActive: false,
    });
  }

  return null;
}

function handleMatrixValueEditor(state, key) {
  if (isParameterKey(key) || isLiteralInputKey(key)) {
    return cloneOnSameScreen(state, { secondActive: false });
  }

  if (key === 'ENTER') {
    return cloneOnSameScreen(state, {
      matrixCol: state.matrixCursor.col + 1,
      secondActive: false,
    });
  }

  return null;
}

function handleResult(state, key) {
  const scrollTarget = RESULT_SCROLL_TARGETS[state.id]?.[key];

  if (scrollTarget) {
    return moveToScreen(state, scrollTarget, {
      secondActive: false,
    });
  }

  if (key === 'DOWN' && state.scrollable) {
    return cloneOnSameScreen(state, { secondActive: false });
  }

  return null;
}

function handleGraph(state, key) {
  if (key === 'TRACE') {
    const traceScreen = TRACE_SCREENS[state.id];

    if (traceScreen) {
      return moveToScreen(state, traceScreen, {
        secondActive: false,
        traceMode: true,
      });
    }

    return cloneOnSameScreen(state, {
      secondActive: false,
      traceMode: true,
    });
  }

  if ((key === 'LEFT' || key === 'RIGHT') && (state.traceMode || state.id.endsWith('-trace'))) {
    return cloneOnSameScreen(state, {
      traceIndex: Math.max(0, state.traceIndex + (key === 'RIGHT' ? 1 : -1)),
      secondActive: false,
      traceMode: true,
    });
  }

  if (key === 'ZOOM') {
    return moveToScreen(state, 'zoom-menu', {
      secondActive: false,
      zoomTarget: state.id.endsWith('-trace')
        ? graphScreenForTrace(state.id)
        : state.id,
    });
  }

  return null;
}

function selectMenuItem(state, selectionIndex) {
  const target = MENU_SELECTIONS[state.id]?.[selectionIndex];

  if (!target) {
    return null;
  }

  if (target === '__zoom_target__') {
    return moveToScreen(state, state.zoomTarget ?? 'scatterplot-graph', {
      secondActive: false,
    });
  }

  if (target === '__catalog_command__') {
    return moveToScreen(state, 'home', {
      secondActive: false,
      homeCommandType: 'catalog',
    });
  }

  if (target.startsWith('__list_')) {
    return resolveListNameSelection(state, target);
  }

  if (target === 'two-samp-ttest-stats-wizard') {
    return moveToScreen(state, target, {
      secondActive: false,
      inputMode: 'Data',
    });
  }

  if (target === 'two-samp-tint-stats-wizard') {
    return moveToScreen(state, target, {
      secondActive: false,
      inputMode: 'Data',
    });
  }

  return moveToScreen(state, target, { secondActive: false });
}

function resolveListNameSelection(state, token) {
  const listName = token.replace('__list_', '').replace('__', '');
  const targetScreen = state.returnScreen ?? 'plot1-editor-resid';

  if (targetScreen === 'home') {
    return moveToScreen(state, 'home', {
      secondActive: false,
    });
  }

  const nextState = moveToScreen(state, targetScreen, {
    secondActive: false,
    activeField: state.returnFieldIndex ?? 0,
    returnScreen: null,
    returnFieldIndex: null,
  });

  if (!nextState.fields || nextState.activeField == null) {
    return nextState;
  }

  nextState.fields[nextState.activeField].value = listName;
  return nextState;
}

function cycleChoiceField(state, key) {
  const activeField = getActiveField(state);

  if (!activeField) {
    return null;
  }

  const adjacentActionIndex = findAdjacentActionField(state, key);

  if (adjacentActionIndex !== null) {
    return cloneOnSameScreen(state, {
      activeField: adjacentActionIndex,
      secondActive: false,
    });
  }

  if (activeField.type !== 'choice') {
    return null;
  }

  const options = activeField.options ?? [];

  if (options.length === 0) {
    return null;

    app.sessionResult = null;
    app.busy = true;
    app.banner = 'Resetting the calculator to HOME before the walkthrough starts.';
    render();

    try {
      await app.bridge.prepareHome();
    } catch (error) {
      console.warn('Failed to prepare the calculator home screen.', error);
    }

    app.walkthrough.preparing = false;
    app.busy = false;
    app.banner = app.walkthrough.mode === 'guided'
      ? 'Follow the highlighted key. Wrong keys are blocked before they reach CEmu.'
      : 'Recall mode is live. Hints count as misses.';
    updateMockCanvas();
    render();
  }

  async function handleCorrectChoice() {
    const question = app.question;

    if (!question) {
      return;
    }

    await startWalkthrough(question.correctId, question.canonical, {
      sourceKind: 'question',
      sourceQuestion: question,
      branchCount: question.branchCount,
    });
  }

  function openBranchIntro(procedureId) {
    const question = app.question;

    if (!question) {
      return;
    }

    app.branchIntro = {
      wrongProcedureId: procedureId,
      sourceQuestion: question,
      canonical: pickRandom(patternsData.canonicalProblems[procedureId] ?? []),
      contrast: contrastFor(question.correctId, procedureId),
    };
    app.banner = `That answer would lead to ${PROCEDURE_BY_ID[procedureId].name}.`;
    render();
  }

  async function startBranchWalkthrough() {
    if (!app.branchIntro) {
      return;
    }

    await startWalkthrough(app.branchIntro.wrongProcedureId, app.branchIntro.canonical, {
      sourceKind: 'branch',
      sourceQuestion: app.branchIntro.sourceQuestion,
      branchProcedureId: app.branchIntro.wrongProcedureId,
      branchCount: app.branchIntro.sourceQuestion.branchCount + 1,
    });
  }

  function recallQuality(errors, hints) {
    if (hints >= 2) {
      return 0;
    }

    if (errors >= 3) {
      return 1;
    }

    if (errors >= 2 || hints === 1) {
      return 3;
    }

    if (errors === 1) {
      return 4;
    }

    return 5;
  }

  function sm2(quality, record) {
    if (quality >= 3) {
      if (record.repetitions === 0) {
        record.interval = 1;
      } else if (record.repetitions === 1) {
        record.interval = 6;
      } else {
        record.interval = Math.round(record.interval * record.easeFactor);
      }

      record.repetitions += 1;
    } else {
      record.repetitions = 0;
      record.interval = 1;
    }

    record.easeFactor = Math.max(
      1.3,
      record.easeFactor + 0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02),
    );
    record.nextReview = formatDate(addDays(startOfDay(new Date()), record.interval));
  }

  function applyTrack1Outcome(procedureId, quality) {
    const track1 = ensureProcedureRecord(procedureId).track1;
    track1.exposures += 1;
    track1.lastReview = todayIso();
    track1.lastQuality = quality;
    sm2(quality, track1);
  }

  function applyTrack2Outcome(walkthrough) {
    const track2 = ensureProcedureRecord(walkthrough.procedureId).track2;
    const reviewDate = todayIso();

    if (walkthrough.mode === 'guided') {
      track2.guidedPasses += 1;
      track2.lastReview = reviewDate;
      track2.nextReview = reviewDate;
      track2.lastQuality = 4;
      track2.mode = 'recall';
      track2.lastErrors = 0;
      track2.lastHints = 0;
      return {
        headline: `${PROCEDURE_BY_ID[walkthrough.procedureId].name} learned`,
        detail: 'Guided completion recorded. This route is promoted to recall.',
      };
    }

    const quality = recallQuality(walkthrough.errors, walkthrough.hints);
    sm2(quality, track2);
    track2.lastReview = reviewDate;
    track2.lastQuality = quality;
    track2.lastErrors = walkthrough.errors;
    track2.lastHints = walkthrough.hints;

    if (walkthrough.errors >= 3 || walkthrough.hints >= 2) {
      track2.mode = 'guided';
      track2.interval = 0;
      track2.nextReview = reviewDate;
      return {
        headline: `${PROCEDURE_BY_ID[walkthrough.procedureId].name} demoted`,
        detail: 'Recall was too shaky, so the next pass returns to guided mode.',
      };
    }

    track2.mode = 'recall';
    return {
      headline: `${PROCEDURE_BY_ID[walkthrough.procedureId].name} scheduled`,
      detail: `Recall complete. Next review is ${track2.nextReview}.`,
    };
  }

  function track1QualityForBranches(branchCount) {
    if (branchCount <= 0) {
      return 5;
    }

    if (branchCount === 1) {
      return 3;
    }

    if (branchCount === 2) {
      return 1;
    }

    return 0;
  }

  function completeWalkthrough() {
    const walkthrough = app.walkthrough;

    if (!walkthrough) {
      return;
    }

    const track2Summary = applyTrack2Outcome(walkthrough);

    if (walkthrough.sourceKind === 'branch') {
      applyTrack1Outcome(walkthrough.procedureId, 2);

      const question = walkthrough.sourceQuestion;
      question.branchCount += 1;
      question.branchHistory.push(walkthrough.procedureId);
      question.remainingChoices = question.remainingChoices.filter(
        (choice) => choice !== walkthrough.procedureId,
      );

      app.walkthrough = null;
      app.branchIntro = null;
      app.banner = `${PROCEDURE_BY_ID[walkthrough.procedureId].name} removed from the choices. Return to the original problem.`;
      app.sessionResult = {
        headline: 'Branch complete',
        detail: `${track2Summary.detail} The original problem is back with one fewer distractor.`,
        actionLabel: 'Return to question',
        action: 'return-question',
      };
      savePersisted();
      render();
      return;
    }

    const branchCount = walkthrough.sourceQuestion?.branchCount ?? 0;
    const track1Quality = track1QualityForBranches(branchCount);
    applyTrack1Outcome(walkthrough.procedureId, track1Quality);

    app.question = null;
    app.walkthrough = null;
    app.branchIntro = null;
    app.sessionResult = {
      headline: `${PROCEDURE_BY_ID[walkthrough.procedureId].name} complete`,
      detail: `${track2Summary.detail} Track 1 quality: ${track1Quality}.`,
      actionLabel: 'Next item',
      action: 'next-item',
    };
    app.banner = 'The walkthrough finished. Start the next scheduled item when ready.';
    savePersisted();
    render();
  }

  async function pressButton(buttonId) {
    if (!app.walkthrough || app.walkthrough.preparing || app.walkthrough.completion || app.busy) {
      return;
    }

    const step = currentStep();

    if (!step) {
      return;
    }

    const engineKey = BUTTON_TO_ENGINE[buttonId] ?? buttonId;
    const correct = stepIsParameter(step)
      ? PARAMETER_INPUT_KEYS.has(engineKey)
      : normalizeStepKey(step.key) === engineKey;

    if (!correct) {
      if (app.walkthrough.mode === 'recall') {
        app.walkthrough.errors += 1;
      }

      app.walkthrough.hintVisible = false;
      app.banner = wrongFeedback(step, buttonId);
      flashButton(buttonId, 'wrong');
      render();
      return;
    }

    app.busy = true;

    try {
      if (stepIsParameter(step)) {
        const token = step.key.slice(1, -1);
        const value = sampleValueForToken(token, app.walkthrough.problem?.values ?? {});
        await app.bridge.typeValue(value);
        app.banner = `Filled ${token} with ${value}.`;
      } else {
        await app.bridge.sendButton(buttonId);
        app.banner = app.walkthrough.mode === 'guided'
          ? 'Correct. Continue with the next step.'
          : 'Correct. Keep going from memory.';
      }

      app.walkthrough.routeState = nextRouteState(step);
      app.walkthrough.hintVisible = false;
      flashButton(buttonId, 'correct');

      if (app.walkthrough.routeState.routeIndex >= currentProcedure().steps.length) {
        completeWalkthrough();
        return;
      }
    } catch (error) {
      app.banner = error.message;
    } finally {
      app.busy = false;
      updateMockCanvas();
      render();
    }
  }

  function showHint() {
    if (!app.walkthrough || app.walkthrough.mode !== 'recall' || app.walkthrough.preparing) {
      return;
    }

    const step = currentStep();

    if (!step) {
      return;
    }

    app.walkthrough.hints += 1;
    app.walkthrough.errors += 1;
    app.walkthrough.hintVisible = true;

    if (stepIsParameter(step)) {
      const token = step.key.slice(1, -1);
      const value = sampleValueForToken(token, app.walkthrough.problem?.values ?? {});
      app.banner = `Hint: use the numeric cluster so the trainer can type ${value} into ${token}.`;
    } else {
      app.banner = `Hint: press [${displayKey(step.key)}].`;
    }

    render();
  }

  async function restartWalkthrough() {
    if (!app.walkthrough) {
      return;
    }

    const current = app.walkthrough;

    await startWalkthrough(current.procedureId, current.problem, {
      sourceKind: current.sourceKind,
      sourceQuestion: current.sourceQuestion,
      branchProcedureId: current.branchProcedureId,
      branchCount: current.sourceQuestion?.branchCount ?? 0,
    });
  }

    return PROCEDURE_BY_ID[procedureId]?.name ?? procedureId;

  function renderValueChips(values) {
    if (!values) {

    const entries = Object.entries(values).filter(
      ([key]) => key !== 'frameworkSkill' && key !== 'unit',

    if (!entries.length) {
      return '';
    }

    return `
      <div class="chip-row">
        ${entries
          .map(
            ([key, value]) => `
              <span class="chip">
                <strong>${key}</strong>
                <span>${formatCalculatorValue(value)}</span>
              </span>

          )

    `;
  }

    return `

        <p class="problem-stem">${question.canonical?.stem ?? 'No canonical problem was available.'}</p>

  function renderKeypad() {
    const step = currentStep();
    const suggestions = guidedSuggestions(step);
    const showAssist = app.walkthrough
      && (app.walkthrough.mode === 'guided' || app.walkthrough.hintVisible);

    return BUTTONS.map((row, rowIndex) =>
      row.map((buttonId, columnIndex) => {
        if (!buttonId) {
          return `<div class="key-gap" style="grid-row:${rowIndex + 1};grid-column:${columnIndex + 1};"></div>`;
        }

        const meta = BUTTON_META[buttonId];
        const suggested = showAssist && suggestions.has(buttonId);
        const dimmed = showAssist && suggestions.size && !suggested ? ' dimmed' : '';
        const flash = app.flashKeyId === buttonId ? ` flash-${app.flashKind}` : '';
        const tall = meta.tall ? ' tall' : '';
        const disabled = !app.walkthrough || app.walkthrough.preparing || app.busy ? ' disabled' : '';

        return `
          <button
            type="button"
            class="key key-${meta.color}${suggested ? ' suggested' : ''}${dimmed}${flash}${tall}"
            data-key="${buttonId}"
            style="grid-row:${rowIndex + 1}${meta.tall ? ' / span 2' : ''};grid-column:${columnIndex + 1};"
            ${disabled}
          >
            ${meta.secondary ? `<span class="key-secondary">${meta.secondary}</span>` : ''}
            ${meta.alpha ? `<span class="key-alpha">${meta.alpha}</span>` : ''}
            <span class="key-label">${meta.label}</span>
          </button>
        `;
      }).join('')).join('');
  }

      <section class="panel calc-panel">

            <button type="button" class="mac-button" data-action="restart-walkthrough" ${!walkthrough ? 'disabled' : ''}>Restart</button>
            <button type="button" class="mac-button" data-action="show-hint" ${!walkthrough || walkthrough.mode !== 'recall' ? 'disabled' : ''}>Hint</button>

  function screenLinesForMock() {
    const procedure = currentProcedure();
    const screen = currentScreen();
    const step = currentStep();

    if (!procedure || !screen) {
      return {
        lines: [
          'TI-84 Plus CE',
          'Pattern recognition first',
        ],
        footer: app.bridgeStatus.detail,
      };
    }

    const lines = [
      procedure.name,
      `Screen: ${screen.title || screen.id}`,
    ];

    if (screen.items?.length) {
      screen.items.slice(0, 4).forEach((item, index) => {
        const prefix = screen.cursor === index ? '>' : ' ';
        lines.push(`${prefix} ${item}`);
      });
    } else if (screen.fields?.length) {
      screen.fields.slice(0, 4).forEach((field) => {
        lines.push(`${field.label}: ${field.value ?? ''}`);
      });
    } else if (screen.layout?.content?.length) {
      screen.layout.content.slice(0, 4).forEach((line) => {
        lines.push(line.text ?? '');
      });
    } else if (step) {
      lines.push(step.narration);
    }

    return {
      lines,
      footer: step ? `Expect ${stepIsParameter(step) ? 'numeric entry' : displayKey(step.key)}` : procedure.description,
    };
  }

  function updateMockCanvas() {
    if (app.bridge.isRealEmulator()) {
      return;
    }

    const { lines, footer } = screenLinesForMock();
    app.bridge.setMockLines(lines, footer);
  }

  async function handleChoice(procedureId) {
    if (!app.question || app.busy) {
      return;
    }

    if (procedureId === app.question.correctId) {
      await handleCorrectChoice();
      return;
    }

    openBranchIntro(procedureId);
  }

  async function handleClick(event) {
    const button = event.target.closest('button');

    if (!button) {
      return;
    }

    const { action, key, procedureId } = button.dataset;

    if (key) {
      await pressButton(key);
      return;
    }

    if (!action) {
      return;
    }

    switch (action) {
      case 'start-session':
      case 'next-item':
        startNextQuestion();
        break;
      case 'choose-procedure':
        await handleChoice(procedureId);
        break;
      case 'start-branch':
        await startBranchWalkthrough();
        break;
      case 'cancel-branch':
        app.branchIntro = null;
        app.banner = 'Back on the original problem. Choose again.';
        render();
        break;
      case 'show-hint':
        showHint();
        break;
      case 'restart-walkthrough':
        await restartWalkthrough();
        break;
      case 'return-question':
        app.sessionResult = null;
        app.banner = 'Original question restored. The explored distractor is removed.';
        render();
        break;
      case 'open-rom-dialog':
        app.romDialogOpen = true;
        render();
        break;
      case 'close-rom-dialog':
        app.romDialogOpen = false;
        render();
        break;
      case 'choose-rom': {
        document.getElementById('rom-file-input')?.click();
        break;
      }
      case 'clear-rom':
        await app.bridge.clearStoredRom();
        app.bridgeStatus = app.bridge.getStatus();
        app.banner = 'Saved ROM cleared.';
        render();
        break;
      default:
        break;
    }
  }

  async function handleChange(event) {
    if (event.target.id === 'unit-filter') {
      app.filterUnit = event.target.value;
      savePersisted();
      render();
      return;
    }

    if (event.target.id === 'rom-file-input') {
      const file = event.target.files?.[0];

      if (!file) {
        return;
      }

      app.busy = true;
      app.banner = `Loading ${file.name}…`;
      render();

      try {
        await app.bridge.selectRomFile(file);
        app.bridgeStatus = app.bridge.getStatus();
        app.romDialogOpen = false;
        app.banner = `Stored and loaded ${file.name}.`;
      } catch (error) {
        app.banner = error.message;
      } finally {
        app.busy = false;
        updateMockCanvas();
        render();
      }
    }
  }

  function bindEvents() {
    root.addEventListener('click', (event) => {
      void handleClick(event);
    });

    root.addEventListener('change', (event) => {
      void handleChange(event);
    });
  }

  function attachBridge() {
    app.bridge = createBridge({
      onStatus(status) {
        app.bridgeStatus = status;

        if (status.code === 'needs-rom') {
          app.romDialogOpen = true;
        }

        updateMockCanvas();
        render();
      },
    });
  }

  async function init() {
    attachBridge();
    bindEvents();
    render();
    await app.bridge.init();
    app.bridgeStatus = app.bridge.getStatus();
    updateMockCanvas();
    render();
  }

  window.addEventListener('beforeunload', () => {
    app.bridge?.destroy();
  });

  void init();
}());

  </script>
</body>
</html>
